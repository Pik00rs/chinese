// ============================================================
// BACKEND API — appels au worker Cloudflare
// ============================================================
const BACKEND_URL = 'https://hsk-backend.tom-delaine14.workers.dev';

// Wrapper générique pour appeler le backend avec timeout et gestion d'erreur
async function callBackend(endpoint, body, timeoutMs = 30000) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

  try {
    const response = await fetch(BACKEND_URL + endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: controller.signal,
    });
    clearTimeout(timeoutId);

    if (!response.ok) {
      const err = await response.text();
      throw new Error(`Backend ${response.status}: ${err.slice(0, 200)}`);
    }
    return await response.json();
  } catch (e) {
    clearTimeout(timeoutId);
    if (e.name === 'AbortError') throw new Error('Timeout : le backend met trop de temps à répondre');
    throw e;
  }
}

// Endpoints concrets
const api = {
  generateSentence: (params) => callBackend('/generate-sentence', params),
  generateText: (params) => callBackend('/generate-text', params),
  gradeAnswer: (params) => callBackend('/grade-answer', params),

// ============================================================
// HOOK : détecter l'état online/offline
// ============================================================
function useOnlineStatus() {
  const [isOnline, setIsOnline] = useState(
    typeof navigator !== 'undefined' ? navigator.onLine : true
  );

  useEffect(() => {
    const handleOnline = () => setIsOnline(true);
    const handleOffline = () => setIsOnline(false);
    window.addEventListener('online', handleOnline);
    window.addEventListener('offline', handleOffline);
    return () => {
      window.removeEventListener('online', handleOnline);
      window.removeEventListener('offline', handleOffline);
    };
  }, []);

  return isOnline;
}


// ============================================================
// HOOK : détecter si une nouvelle version du service worker est dispo
// ============================================================
function useServiceWorkerUpdate() {
  const [updateAvailable, setUpdateAvailable] = useState(false);

  useEffect(() => {
    const handler = () => setUpdateAvailable(true);
    window.addEventListener('swUpdateAvailable', handler);
    return () => window.removeEventListener('swUpdateAvailable', handler);
  }, []);

  const applyUpdate = () => {
    if (typeof window.applyServiceWorkerUpdate === 'function') {
      window.applyServiceWorkerUpdate();
    } else {
      window.location.reload();
    }
  };

  return { updateAvailable, applyUpdate };
}


// ============================================================
// TTS — Lecture audio via Web Speech API native (gratuit, offline-capable)
// ============================================================
function speak(text, lang = 'zh-CN', rate = 0.85) {
  if (typeof window === 'undefined' || !window.speechSynthesis) return false;
  // Annuler une lecture en cours
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = lang;
  utterance.rate = rate;
  // Essayer de trouver une voix chinoise
  const voices = window.speechSynthesis.getVoices();
  const zhVoice = voices.find(v => v.lang.startsWith('zh'));
  if (zhVoice) utterance.voice = zhVoice;
  window.speechSynthesis.speak(utterance);
  return true;
}

function isTTSAvailable() {
  return typeof window !== 'undefined' && !!window.speechSynthesis;
}


// ============================================================
// PACK OFFLINE — gestion du stock d'exercices pré-générés
// ============================================================
const PACK_KEY = 'hsk_offline_pack';

// Structure du pack :
// {
//   sentences: [{id, target_word, sentence_zh, sentence_pinyin, sentence_fr, options_fr, correct_index, explanation, used: false, generated_at}],
//   texts: [{id, text_zh, text_pinyin, text_fr, new_words, questions, used: false, generated_at}],
//   dialogues: [{id, prompts: [{zh, pinyin, fr, response_options}], used: false, generated_at}],
// }

function loadPack() {
  try {
    const raw = localStorage.getItem(PACK_KEY);
    if (!raw) return { sentences: [], texts: [], dialogues: [] };
    const parsed = JSON.parse(raw);
    return {
      sentences: parsed.sentences || [],
      texts: parsed.texts || [],
      dialogues: parsed.dialogues || [],
    };
  } catch {
    return { sentences: [], texts: [], dialogues: [] };
  }
}

function savePack(pack) {
  try {
    localStorage.setItem(PACK_KEY, JSON.stringify(pack));
    return true;
  } catch (e) {
    console.warn('Pack save failed:', e);
    return false;
  }
}

// Ajouter un exercice au pack
function addToPack(type, exercise) {
  const pack = loadPack();
  const item = {
    id: `${type}_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
    ...exercise,
    used: false,
    generated_at: Date.now(),
  };
  pack[type] = pack[type] || [];
  pack[type].push(item);
  savePack(pack);
  return item;
}

// Marquer un exercice comme utilisé (mais le garder)
function markUsed(type, id) {
  const pack = loadPack();
  if (!pack[type]) return;
  const item = pack[type].find(x => x.id === id);
  if (item) item.used = true;
  savePack(pack);
}

// Compter les exos non-utilisés
function countAvailable(pack = null) {
  const p = pack || loadPack();
  return {
    sentences: (p.sentences || []).filter(x => !x.used).length,
    texts: (p.texts || []).filter(x => !x.used).length,
    dialogues: (p.dialogues || []).filter(x => !x.used).length,
    total:
      (p.sentences || []).filter(x => !x.used).length +
      (p.texts || []).filter(x => !x.used).length +
      (p.dialogues || []).filter(x => !x.used).length,
  };
}

// Compter le total (utilisés + non-utilisés)
function countTotal(pack = null) {
  const p = pack || loadPack();
  return {
    sentences: (p.sentences || []).length,
    texts: (p.texts || []).length,
    dialogues: (p.dialogues || []).length,
  };
}

// Piocher un exo non-utilisé (ou un exo utilisé si rien d'autre dispo)
function pickFromPack(type) {
  const pack = loadPack();
  const items = pack[type] || [];
  if (items.length === 0) return null;
  const fresh = items.filter(x => !x.used);
  if (fresh.length > 0) return fresh[Math.floor(Math.random() * fresh.length)];
  // Tous utilisés : on en repioche un au hasard
  return items[Math.floor(Math.random() * items.length)];
}

// Effacer tout le pack
function clearPack() {
  try {
    localStorage.removeItem(PACK_KEY);
    return true;
  } catch {
    return false;
  }
}


// ============================================================
// ERROR LOG — tracking des erreurs typées
// ============================================================
const ERROR_LOG_KEY = 'hsk_error_log';
const ERROR_LOG_MAX = 200; // on garde les 200 dernières erreurs

// Types d'erreur possibles (heuristiques basées sur le contexte de la carte)
// - tone : confusion de ton (pinyin similaire mais ton différent)
// - semantic : confusion de sens (ex: 你/您 ou 看/见)
// - graphic : confusion graphique de hanzi (ex: 天/夫)
// - structure : erreur de structure grammaticale (phrase tap)
// - unknown : pas pu typer

function logError(errorEntry) {
  // errorEntry : { item_id, hanzi, pinyin, fr, facet, mode, error_type, user_answer, correct_answer, timestamp }
  try {
    const raw = localStorage.getItem(ERROR_LOG_KEY);
    let log = raw ? JSON.parse(raw) : [];
    log.unshift({ ...errorEntry, timestamp: Date.now() });
    if (log.length > ERROR_LOG_MAX) log = log.slice(0, ERROR_LOG_MAX);
    localStorage.setItem(ERROR_LOG_KEY, JSON.stringify(log));
  } catch (e) {
    console.warn('Error log save failed:', e);
  }
}

function loadErrorLog() {
  try {
    const raw = localStorage.getItem(ERROR_LOG_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch {
    return [];
  }
}

function clearErrorLog() {
  try { localStorage.removeItem(ERROR_LOG_KEY); return true; } catch { return false; }
}

// Heuristique pour deviner le type d'erreur dans un QCM
function detectErrorType(correctItem, wrongItem, mode) {
  if (!correctItem || !wrongItem) return 'unknown';

  // Confusion de ton : même pinyin sans tons mais différents
  const stripTones = (p) => (p || '').toLowerCase()
    .replace(/[āáǎà]/g, 'a').replace(/[ēéěè]/g, 'e').replace(/[īíǐì]/g, 'i')
    .replace(/[ōóǒò]/g, 'o').replace(/[ūúǔù]/g, 'u').replace(/[ǖǘǚǜü]/g, 'u');
  if (stripTones(correctItem.pinyin) === stripTones(wrongItem.pinyin) && correctItem.pinyin !== wrongItem.pinyin) {
    return 'tone';
  }

  // Confusion graphique : hanzi qui partagent des caractères
  if (correctItem.hanzi && wrongItem.hanzi) {
    const sharedChars = [...correctItem.hanzi].filter(c => wrongItem.hanzi.includes(c));
    if (sharedChars.length > 0 && correctItem.hanzi !== wrongItem.hanzi) {
      // Si au moins un hanzi commun ou similaire visuellement
      return 'graphic';
    }
  }

  // Confusion sémantique : même type grammatical et tags partagés
  if (correctItem.type === wrongItem.type) {
    const commonTags = (correctItem.tags || []).filter(t => (wrongItem.tags || []).includes(t) && !t.startsWith('hsk'));
    if (commonTags.length > 0) return 'semantic';
  }

  return 'unknown';
}

// Regrouper les erreurs par item pour le carnet
function groupErrorsByItem(errors) {
  const grouped = {};
  for (const e of errors) {
    if (!e.item_id) continue;
    if (!grouped[e.item_id]) {
      grouped[e.item_id] = {
        item_id: e.item_id,
        hanzi: e.hanzi,
        pinyin: e.pinyin,
        fr: e.fr,
        count: 0,
        types: {},
        last_error: 0,
        confused_with: new Set(),
      };
    }
    grouped[e.item_id].count++;
    grouped[e.item_id].types[e.error_type] = (grouped[e.item_id].types[e.error_type] || 0) + 1;
    if (e.timestamp > grouped[e.item_id].last_error) grouped[e.item_id].last_error = e.timestamp;
    if (e.confused_with) grouped[e.item_id].confused_with.add(e.confused_with);
  }
  return Object.values(grouped).map(g => ({
    ...g,
    confused_with: Array.from(g.confused_with),
  })).sort((a, b) => b.count - a.count);
}

const WORD_QUALITY_KEY = 'hsk_word_quality';
const LESSON_PROGRESS_KEY = 'hsk_lesson_progress';

// VOCAB, PHRASES, LESSONS, THEMES sont chargés depuis lessons.js (variables globales)
// Helpers d'accès rapide (lazy maps)

let _phrasesById = null;
let _lessonsById = null;
function getWordById(id) {
  if (!_vocabById) {
    _vocabById = {};
    if (typeof VOCAB !== 'undefined') VOCAB.forEach(w => { _vocabById[w.id] = w; });

}
function getPhraseById(id) {

// ===== SCORE QUALITÉ PAR MOT =====
// Structure : { word_id: { qcm_zh_fr: bool, qcm_fr_zh: bool, fill_manual: bool, audio: bool, in_phrase: bool, errors: int, last_seen: ts } }
// Score = (réussites multi-modal × 20) - (erreurs × 10), borné 0-100

function loadWordQuality() {
  try {
    const raw = localStorage.getItem(WORD_QUALITY_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}
function saveWordQuality(q) {
  try { localStorage.setItem(WORD_QUALITY_KEY, JSON.stringify(q)); } catch {}
}

function getWordQualityScore(wordId, qualityMap = null) {
  const q = qualityMap || loadWordQuality();
  const entry = q[wordId];
  if (!entry) return 0;
  const modalSuccess =
    (entry.qcm_zh_fr ? 20 : 0) +
    (entry.qcm_fr_zh ? 20 : 0) +
    (entry.fill_manual ? 20 : 0) +
    (entry.audio ? 20 : 0) +
    (entry.in_phrase ? 20 : 0);
  const errorPenalty = Math.min((entry.errors || 0) * 10, 50);
  return Math.max(0, Math.min(100, modalSuccess - errorPenalty));
}

// Mettre à jour le score après un exercice
function updateWordQuality(wordId, modality, isSuccess) {
  // modality : 'qcm_zh_fr' | 'qcm_fr_zh' | 'fill_manual' | 'audio' | 'in_phrase'
  const q = loadWordQuality();
  if (!q[wordId]) {
    q[wordId] = { qcm_zh_fr: false, qcm_fr_zh: false, fill_manual: false, audio: false, in_phrase: false, errors: 0, last_seen: 0 };
  }
  const entry = q[wordId];
  if (isSuccess) {
    entry[modality] = true;
    // Une réussite "rachète" un peu d'erreur
    if (entry.errors > 0) entry.errors = Math.max(0, entry.errors - 0.5);
  } else {
    entry.errors = (entry.errors || 0) + 1;
    // Un échec invalide la réussite de cette modalité
    entry[modality] = false;
  }
  entry.last_seen = Date.now();
  saveWordQuality(q);
  return getWordQualityScore(wordId, q);
}

// Récupérer la qualité moyenne sur une liste de mots
function getAverageQuality(wordIds, qualityMap = null) {
  const q = qualityMap || loadWordQuality();
  if (wordIds.length === 0) return 0;
  const total = wordIds.reduce((sum, id) => sum + getWordQualityScore(id, q), 0);
  return Math.round(total / wordIds.length);
}

// ===== PROGRESSION PAR LEÇON =====
// Structure : { lesson_id: { unlocked: bool, started_at: ts, completed_at: ts, current_phase: 1-5, phase_progress: {...} } }

function loadLessonProgress() {
  try {
    const raw = localStorage.getItem(LESSON_PROGRESS_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}
function saveLessonProgress(p) {
  try { localStorage.setItem(LESSON_PROGRESS_KEY, JSON.stringify(p)); } catch {}
}

// Initialiser une leçon (la débloquer)
function startLesson(lessonId) {
  const progress = loadLessonProgress();
  if (!progress[lessonId]) {
    progress[lessonId] = {
      unlocked: true,
      started_at: Date.now(),
      completed_at: null,
      current_phase: 1,
      phase_progress: {},
    };
    saveLessonProgress(progress);
  }
  return progress[lessonId];
}

// Mettre à jour la phase d'une leçon
function updateLessonPhase(lessonId, phase) {
  const progress = loadLessonProgress();
  if (!progress[lessonId]) startLesson(lessonId);
  progress[lessonId].current_phase = phase;
  saveLessonProgress(progress);
}

// Marquer une leçon comme complétée
function completeLessonPhase(lessonId, phaseNumber) {
  const progress = loadLessonProgress();
  if (!progress[lessonId]) startLesson(lessonId);
  progress[lessonId].phase_progress[phaseNumber] = true;
  if (phaseNumber >= 5) {
    progress[lessonId].completed_at = Date.now();
  }
  saveLessonProgress(progress);
}

// Quelle est la prochaine leçon à faire ?
function getNextLesson() {
  const progress = loadLessonProgress();
  const lessons = getAllLessons();
  // Première leçon non complétée dans l'ordre
  for (const lesson of lessons.sort((a, b) => a.order - b.order)) {
    const p = progress[lesson.id];
    if (!p || !p.completed_at) return lesson;
  }
  return null; // toutes les leçons sont finies
}

// État d'une leçon (pour l'affichage)
function getLessonStatus(lessonId) {
  const progress = loadLessonProgress();
  const p = progress[lessonId];
  if (!p) return 'locked';
  if (p.completed_at) return 'completed';
  if (p.started_at) return 'in_progress';
  return 'unlocked';
}

// La leçon X est-elle débloquée ? (oui si la précédente est commencée OU c'est une fixed)
function isLessonAvailable(lessonId) {
  const lesson = getLessonById(lessonId);
  if (!lesson) return false;
  // Les leçons fixes s'enchaînent dans l'ordre, les autres se débloquent quand toutes les fixes sont commencées
  if (lesson.type === 'fixed' && lesson.order === 1) return true;
  // Pour les autres : la précédente doit être au moins commencée
  const lessons = getAllLessons().sort((a, b) => a.order - b.order);
  const idx = lessons.findIndex(l => l.id === lessonId);
  if (idx <= 0) return true;
  const prev = lessons[idx - 1];
  const status = getLessonStatus(prev.id);
  return status === 'in_progress' || status === 'completed';
}

// Reset complet du système leçons (pour repartir à zéro)
function resetLessonSystem() {
  try {
    localStorage.removeItem(WORD_QUALITY_KEY);
    localStorage.removeItem(LESSON_PROGRESS_KEY);
    return true;
  } catch { return false; }
}

const INTERESTS = ['hanzi', 'pinyin', 'sens'];

// Dérive les facettes (types d'exercices) à partir des intérêts cochés.
// Une facette = "vois X, donne Y" — donc il faut au moins 2 intérêts pour qu'un exercice existe.
// Chaque facette n'utilise QUE les intérêts cochés (rien ne fuite).
function deriveFacets(interests) {
  const has = (x) => interests.includes(x);
  const facets = [];
  // Hanzi <-> Sens
  if (has('hanzi') && has('sens')) {
    facets.push('hanzi_to_sens'); // vois 爱, choisis "aimer"
    facets.push('sens_to_hanzi'); // vois "aimer", rappelle 爱
  }
  // Pinyin <-> Sens
  if (has('pinyin') && has('sens')) {
    facets.push('pinyin_to_sens'); // vois "ài", choisis "aimer"
    facets.push('sens_to_pinyin'); // vois "aimer", tape "ai"
  }
  // Hanzi <-> Pinyin
  if (has('hanzi') && has('pinyin')) {
    facets.push('hanzi_to_pinyin'); // vois 爱, tape "ai"
    facets.push('pinyin_to_hanzi'); // vois "ài", choisis 爱 (QCM hanzi)
  }
  return facets;
}

// Legacy — gardé pour compat des stats globales
const FACETS = ['hanzi_to_sens', 'sens_to_hanzi', 'pinyin_to_sens', 'sens_to_pinyin', 'hanzi_to_pinyin', 'pinyin_to_hanzi'];

// ============================================================
// FSRS — algo de répétition espacée simplifié mais fonctionnel
// ============================================================
const FSRS_PARAMS = {
  requestRetention: 0.9,
  maximumInterval: 365,
  w: [0.4, 0.6, 2.4, 5.8, 4.93, 0.94, 0.86, 0.01, 1.49, 0.14, 0.94, 2.18, 0.05, 0.34, 1.26, 0.29, 2.61],
};

function initialState() {
  return {
    stability: 0,
    difficulty: 0,
    lastReview: null,
    nextReview: Date.now(),
    reps: 0,
    lapses: 0,
    state: 'new',
  };
}

function fsrsUpdate(card, rating) {
  const now = Date.now();
  const w = FSRS_PARAMS.w;
  let { stability, difficulty, reps, lapses, state } = card;

  if (state === 'new') {
    stability = w[rating - 1];
    difficulty = Math.max(1, Math.min(10, w[4] - (rating - 3) * w[5]));
    state = rating === 1 ? 'learning' : 'review';
  } else {
    const elapsed = card.lastReview ? (now - card.lastReview) / (1000 * 60 * 60 * 24) : 1;
    const retrievability = Math.exp(-elapsed / Math.max(stability, 0.1));
    difficulty = Math.max(1, Math.min(10, difficulty - w[6] * (rating - 3)));
    if (rating === 1) {
      stability = w[11] * Math.pow(difficulty, -w[12]) * (Math.pow(stability + 1, w[13]) - 1) * Math.exp(w[14] * (1 - retrievability));
      lapses += 1;
      state = 'relearning';
    } else {
      const hardPenalty = rating === 2 ? w[15] : 1;
      const easyBonus = rating === 4 ? w[16] : 1;
      stability = stability * (1 + Math.exp(w[8]) * (11 - difficulty) * Math.pow(stability, -w[9]) * (Math.exp((1 - retrievability) * w[10]) - 1) * hardPenalty * easyBonus);
      state = 'review';
    }
  }

  stability = Math.max(0.1, Math.min(stability, FSRS_PARAMS.maximumInterval));
  const intervalDays = Math.max(1, Math.round(stability * Math.log(FSRS_PARAMS.requestRetention) / Math.log(0.9)));
  const nextReview = now + intervalDays * 24 * 60 * 60 * 1000;

  return {
    stability,
    difficulty,
    lastReview: now,
    nextReview,
    reps: reps + 1,
    lapses,
    state,
  };
}

function intervalLabel(days) {
  if (days < 1) return '<1j';
  if (days < 30) return `${Math.round(days)}j`;
  if (days < 365) return `${Math.round(days / 30)}mo`;
  return `${(days / 365).toFixed(1)}an`;
}

function predictedInterval(card, rating) {
  const updated = fsrsUpdate(card, rating);
  return (updated.nextReview - Date.now()) / (1000 * 60 * 60 * 24);
}

// ============================================================
// PERSISTANCE via localStorage
// ============================================================
async function saveState(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    console.warn('save failed', e);
  }
}

async function loadState(key) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}

// ============================================================
// CLAUDE API helper — pour le mode dialogue
// ============================================================
async function callClaude(systemPrompt, userMessages) {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      system: systemPrompt,
      messages: userMessages,
    }),
  });
  const data = await response.json();
  return data.content.filter(c => c.type === 'text').map(c => c.text).join('\n');
}

// ============================================================
function pickDistractors(correct, allItems, n = 3) {
  // Préférer les distracteurs du même niveau HSK que le mot correct (plus cohérent)
  const correctLevel = correct.tags.find(t => t.startsWith('hsk'));
  let pool = allItems.filter(i => i.id !== correct.id && i.tags.includes(correctLevel));
  // Si pas assez de candidats du même niveau, élargir
  if (pool.length < n) {
    pool = allItems.filter(i => i.id !== correct.id);
  }
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, n);
}

function buildSessionQueue(learnerState, profile, allItems) {
  const now = Date.now();
  const due = [];
  const newCards = [];
  const facets = deriveFacets(profile.interests);

  if (facets.length === 0) return [];

  // Filtrer les mots selon les niveaux HSK activés dans le profil
  const levels = profile.hskLevels && profile.hskLevels.length > 0 ? profile.hskLevels : ['hsk1'];
  const filteredItems = allItems.filter(w => w.tags.some(t => levels.includes(t)));

  for (const item of filteredItems) {
    for (const facet of facets) {
      const key = `${item.id}_${facet}`;
      const state = learnerState[key] || initialState();
      if (state.state === 'new') {
        newCards.push({ item, facet, state });
      } else if (state.nextReview <= now) {
        due.push({ item, facet, state });
      }
    }
  }

  due.sort((a, b) => a.state.nextReview - b.state.nextReview);
  newCards.sort(() => Math.random() - 0.5);

  const targetSize = profile.sessionSize;
  const newCount = Math.min(newCards.length, Math.round(targetSize * profile.newRatio));
  const reviewCount = Math.min(due.length, targetSize - newCount);

  const queue = [...due.slice(0, reviewCount), ...newCards.slice(0, newCount)];
  return queue.sort(() => Math.random() - 0.5);
}

          color={C.red}
          icon="◌"
          name="Carnet d'erreurs"
          sub="Tes faiblesses"
          onClick={() => onMode('errorbook')}
        />
        <ModeCard
          color={C.purple}
          icon="◫"
          name="Calendrier"
          sub="Heatmap d'étude"
          onClick={() => onMode('calendar')}
        />
      </div>

      {/* Progression */}
      {/* Progression globale (basée sur les leçons) */}
      {(() => {
        const allLessons = getAllLessons();
        const lessonProgress = loadLessonProgress();
        const completed = allLessons.filter(l => lessonProgress[l.id]?.completed_at).length;
        const inProgress = allLessons.filter(l => lessonProgress[l.id]?.started_at && !lessonProgress[l.id]?.completed_at).length;
        const wordQ = loadWordQuality();
        const allWordIds = allLessons.flatMap(l => l.word_ids);
        const masteredWords = allWordIds.filter(id => getWordQualityScore(id, wordQ) >= 80).length;
        const pct = allLessons.length > 0 ? Math.round((completed / allLessons.length) * 100) : 0;

        return (
          <>
            <p style={{ fontSize: 10, color: C.textDim, margin: '0 0 10px', letterSpacing: 2 }}>PROGRESSION GLOBALE</p>
            <div style={{ background: C.bgCard, border: `0.5px solid ${C.border}`, borderRadius: 8, padding: 14 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 10 }}>
                <span style={{ fontSize: 13 }}>{completed} / {allLessons.length} leçons</span>
                <span style={{ fontSize: 14, color: C.teal, fontWeight: 500 }}>{pct}%</span>
              </div>
              <div style={{ height: 3, background: C.border, borderRadius: 2, overflow: 'hidden', marginBottom: 12 }}>
                <div style={{
                  width: `${pct}%`, height: '100%',
                  background: `linear-gradient(90deg, ${C.teal}, ${C.purple})`,
                }} />
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, color: C.textDim }}>
                <span>{masteredWords} mots maîtrisés · {inProgress} leçon{inProgress > 1 ? 's' : ''} en cours</span>
                <span>Série : {streak} {streak > 1 ? 'jours 🔥' : 'jour'}</span>
              </div>
            </div>
          </>
        );
      })()}
    </div>
  );
}

// ============================================================
// SESSION SCREEN — gère flashcards et QCM
// ============================================================
function SessionScreen({ profile, learnerState, setLearnerState, onComplete, onQuit, mode = 'mixed' }) {
  const [queue, setQueue] = useState([]);
  const [idx, setIdx] = useState(0);
  const [revealed, setRevealed] = useState(false);
  const [selectedAnswer, setSelectedAnswer] = useState(null);
  const [feedback, setFeedback] = useState(null);
  const [startTime] = useState(Date.now());
  const [correctCount, setCorrectCount] = useState(0);

  useEffect(() => {
    const q = buildSessionQueue(learnerState, profile, HSK1_DATA);
    setQueue(q);
  }, []);

  if (queue.length === 0) {
    return (
      <div style={{ textAlign: 'center', padding: '4rem 1rem' }}>
        <p style={{ fontSize: 16, color: C.textDim }}>Aucune carte à réviser pour l'instant.</p>
        <button onClick={onQuit} style={{
          marginTop: 20, padding: '12px 24px', background: 'transparent',
          border: `0.5px solid ${C.teal}`, color: C.teal, borderRadius: 8,
        }}>Retour</button>
      </div>
    );
  }

  if (idx >= queue.length) {
    const duration = Math.round((Date.now() - startTime) / 1000);
    return <SessionComplete count={queue.length} correct={correctCount} duration={duration} onDone={onComplete} />;
  }

  const current = queue[idx];
  const facet = current.facet;

  const submit = (rating) => {
    const key = `${current.item.id}_${current.facet}`;
    const newState = fsrsUpdate(current.state, rating);
    setLearnerState(prev => ({ ...prev, [key]: newState }));
    if (rating >= 3) setCorrectCount(c => c + 1);
    setIdx(idx + 1);
    setRevealed(false);
    setSelectedAnswer(null);
    setFeedback(null);
  };

  return (
    <div className="slide-up">
      {/* Progress bar */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
        <span style={{ fontSize: 10, color: C.textDim, letterSpacing: 2 }}>
          CARTE {idx + 1} / {queue.length}
        </span>
        <button onClick={onQuit} style={{
          fontSize: 11, color: C.textDim, background: 'transparent', border: 'none',
        }}>Quitter ✕</button>
      </div>
      <div style={{ height: 2, background: C.border, borderRadius: 1, marginBottom: 24, overflow: 'hidden' }}>
        <div style={{
          width: `${(idx / queue.length) * 100}%`,
          height: '100%',
          background: `linear-gradient(90deg, ${C.teal}, ${C.purple})`,
          transition: 'width 0.3s',
        }} />
      </div>

      <FacetBadge facet={facet} state={current.state.state} />

      {/* Carte — key force le remontage à chaque nouvelle carte (reset propre des états internes) */}
      <CardContent
        key={`${idx}_${current.item.id}_${facet}`}
        item={current.item}
        facet={facet}
        revealed={revealed}
        setRevealed={setRevealed}
        selectedAnswer={selectedAnswer}
        setSelectedAnswer={setSelectedAnswer}
        feedback={feedback}
        setFeedback={setFeedback}
        onSubmit={submit}
        currentState={current.state}
      />
    </div>
  );
}

// SmartRating : choisit entre AutoRatingButtons (correct) et RatingButtons (incorrect → continuer)
// Utilisé pour QCM et saisie pinyin où l'app sait déjà si la réponse est juste.
function SmartRating({ feedback, onRate, card }) {
  if (feedback === 'wrong') {
    return <RatingButtons onRate={onRate} card={card} forcedRating={1} />;
  }
  return <AutoRatingButtons onRate={onRate} card={card} />;
}

function FacetBadge({ facet, state }) {
  const labels = {
    hanzi_to_sens: 'HANZI → SENS',
    sens_to_hanzi: 'SENS → HANZI',
    pinyin_to_sens: 'PINYIN → SENS',
    sens_to_pinyin: 'SENS → PINYIN',

    pinyin_to_hanzi: 'PINYIN → HANZI',
  };
  const stateColors = { new: C.purple, review: C.teal, learning: C.amber, relearning: C.red };
  return (

      <span style={{
        fontSize: 9, padding: '4px 10px', border: `0.5px solid ${stateColors[state] || C.teal}`,
        color: stateColors[state] || C.teal, borderRadius: 12, letterSpacing: 1.5,

}

function CardContent({ item, facet, revealed, setRevealed, selectedAnswer, setSelectedAnswer, feedback, setFeedback, onSubmit, currentState }) {

  // ===== HANZI → SENS : QCM (vois 爱, choisis "aimer") =====
  if (facet === 'hanzi_to_sens') {
    const distractors = useMemo(() => pickDistractors(item, HSK1_DATA, 3), [item.id]);
    const options = useMemo(() => [...distractors, item].sort(() => Math.random() - 0.5), [item.id]);
    const handleSelect = (opt) => {
      if (selectedAnswer) return;
      setSelectedAnswer(opt);
      const correct = opt.id === item.id;
      setFeedback(correct ? 'correct' : 'wrong');
      if (!correct) {
        logError({
          item_id: item.id, hanzi: item.hanzi, pinyin: item.pinyin, fr: item.fr,
          facet, mode: 'session',
          error_type: detectErrorType(item, opt, 'qcm'),
          user_answer: opt.fr, correct_answer: item.fr,
          confused_with: opt.hanzi,
        });
      }
    };
    return (
      <>
        <QuestionBox gradient={GRADIENTS.teal}>
          <p className="hanzi" style={{ fontSize: 64, margin: 0, color: C.text, lineHeight: 1, fontWeight: 300 }}>
            {item.hanzi}
          </p>
        </QuestionBox>
        <p style={{ textAlign: 'center', fontSize: 12, color: C.textDim, margin: '0 0 14px' }}>
          Quel est le sens ?
        </p>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 24 }}>
          {options.map(opt => {
            let borderColor = C.border, bg = C.bgCard;
            if (selectedAnswer) {
              if (opt.id === item.id) { borderColor = C.teal; bg = 'rgba(45,212,191,0.08)'; }
              else if (opt.id === selectedAnswer.id) { borderColor = C.red; bg = 'rgba(239,68,68,0.08)'; }
            }
            return (
              <button key={opt.id} onClick={() => handleSelect(opt)} disabled={!!selectedAnswer} style={{
                background: bg, border: `0.5px solid ${borderColor}`, color: C.text,
                padding: 13, borderRadius: 8, textAlign: 'left', fontSize: 14,
              }}>{opt.fr}</button>
            );
          })}
        </div>
        {selectedAnswer && <SmartRating feedback={feedback} onRate={onSubmit} card={currentState} />}
      </>
    );
  }

  // ===== SENS → HANZI : flashcard reveal =====
  if (facet === 'sens_to_hanzi') {
    return (
      <>
        <QuestionBox gradient={GRADIENTS.purple}>
          <p style={{ fontSize: 22, margin: '0 0 12px', color: C.text, fontWeight: 400 }}>
            {item.fr}
          </p>
          {revealed ? (
            <>
              <div style={{ height: 1, background: C.borderAccent, margin: '16px auto', width: '60%' }} />
              <p className="hanzi" style={{ fontSize: 56, margin: 0, color: C.text, fontWeight: 300 }}>
                {item.hanzi}
              </p>
            </>
          ) : (
            <button onClick={() => setRevealed(true)} style={{
              marginTop: 24, background: 'transparent', border: `0.5px solid ${C.purple}`,
              color: C.purple, padding: '10px 22px', borderRadius: 8, fontSize: 13, letterSpacing: 1,
            }}>RÉVÉLER</button>
          )}
        </QuestionBox>
        {revealed && <RatingButtons onRate={onSubmit} card={currentState} />}
      </>
    );
  }

  // ===== PINYIN → SENS : QCM (vois "ài", choisis "aimer") =====
  if (facet === 'pinyin_to_sens') {
    const distractors = useMemo(() => pickDistractors(item, HSK1_DATA, 3), [item.id]);
    const options = useMemo(() => [...distractors, item].sort(() => Math.random() - 0.5), [item.id]);
    const handleSelect = (opt) => {
      if (selectedAnswer) return;
      setSelectedAnswer(opt);
      const correct = opt.id === item.id;
      setFeedback(correct ? 'correct' : 'wrong');
      if (!correct) {
        logError({
          item_id: item.id, hanzi: item.hanzi, pinyin: item.pinyin, fr: item.fr,
          facet, mode: 'session',
          error_type: detectErrorType(item, opt, 'qcm'),
          user_answer: opt.fr, correct_answer: item.fr,
          confused_with: opt.hanzi,
        });
      }
    };
    return (
      <>
        <QuestionBox gradient={GRADIENTS.amber}>
          <p style={{ fontSize: 36, margin: 0, color: C.text, fontWeight: 400, letterSpacing: 2 }}>
            {item.pinyin}
          </p>
        </QuestionBox>
        <p style={{ textAlign: 'center', fontSize: 12, color: C.textDim, margin: '0 0 14px' }}>
          Quel est le sens ?
        </p>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 24 }}>
          {options.map(opt => {
            let borderColor = C.border, bg = C.bgCard;
            if (selectedAnswer) {
              if (opt.id === item.id) { borderColor = C.teal; bg = 'rgba(45,212,191,0.08)'; }
              else if (opt.id === selectedAnswer.id) { borderColor = C.red; bg = 'rgba(239,68,68,0.08)'; }
            }
            return (
              <button key={opt.id} onClick={() => handleSelect(opt)} disabled={!!selectedAnswer} style={{
                background: bg, border: `0.5px solid ${borderColor}`, color: C.text,
                padding: 13, borderRadius: 8, textAlign: 'left', fontSize: 14,
              }}>{opt.fr}</button>
            );
          })}
        </div>
        {selectedAnswer && <SmartRating feedback={feedback} onRate={onSubmit} card={currentState} />}
      </>
    );
  }

  // ===== SENS → PINYIN : taper le pinyin =====
  if (facet === 'sens_to_pinyin') {
    return <PinyinInputCard item={item} questionText={item.fr} questionStyle={{ fontSize: 22, fontWeight: 400 }}
      gradient={GRADIENTS.purple} hint="Tape le pinyin (sans tons)" feedback={feedback} setFeedback={setFeedback}
      onSubmit={onSubmit} currentState={currentState} showSensInFeedback={false} />;

  // ===== HANZI → PINYIN : taper le pinyin =====

      questionStyle={{ fontSize: 64, fontWeight: 300, lineHeight: 1 }}
      gradient={GRADIENTS.teal} hint="Tape le pinyin (sans tons)" feedback={feedback} setFeedback={setFeedback}
      onSubmit={onSubmit} currentState={currentState} showSensInFeedback={false} />;
  }

  // ===== PINYIN → HANZI : QCM avec hanzi (vois "ài", choisis 爱) =====
  if (facet === 'pinyin_to_hanzi') {
    const distractors = useMemo(() => pickDistractors(item, HSK1_DATA, 3), [item.id]);
    const options = useMemo(() => [...distractors, item].sort(() => Math.random() - 0.5), [item.id]);
    const handleSelect = (opt) => {
      if (selectedAnswer) return;
      setSelectedAnswer(opt);
      const correct = opt.id === item.id;
      setFeedback(correct ? 'correct' : 'wrong');
      if (!correct) {
        logError({
          item_id: item.id, hanzi: item.hanzi, pinyin: item.pinyin, fr: item.fr,
          facet, mode: 'session',
          error_type: detectErrorType(item, opt, 'qcm'),
          user_answer: opt.hanzi, correct_answer: item.hanzi,
          confused_with: opt.hanzi,
        });
      }
    };
    return (
      <>
        <QuestionBox gradient={GRADIENTS.amber}>
          <p style={{ fontSize: 36, margin: 0, color: C.text, fontWeight: 400, letterSpacing: 2 }}>
            {item.pinyin}
          </p>

        <p style={{ textAlign: 'center', fontSize: 12, color: C.textDim, margin: '0 0 14px' }}>
          Quel hanzi correspond ?
        </p>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginBottom: 24 }}>
          {options.map(opt => {
            let borderColor = C.border, bg = C.bgCard;
            if (selectedAnswer) {
              if (opt.id === item.id) { borderColor = C.teal; bg = 'rgba(45,212,191,0.08)'; }
              else if (opt.id === selectedAnswer.id) { borderColor = C.red; bg = 'rgba(239,68,68,0.08)'; }
            }
            return (
              <button key={opt.id} onClick={() => handleSelect(opt)} disabled={!!selectedAnswer} style={{
                background: bg, border: `0.5px solid ${borderColor}`, color: C.text,
                padding: '18px 8px', borderRadius: 8, textAlign: 'center',
              }}>
                <span className="hanzi" style={{ fontSize: 28, fontWeight: 300 }}>{opt.hanzi}</span>
              </button>
            );
          })}
        </div>
        {selectedAnswer && <SmartRating feedback={feedback} onRate={onSubmit} card={currentState} />}
      </>
    );
  }

  return null;
}

// Composant réutilisable : carte avec saisie de pinyin
function PinyinInputCard({ item, questionText, isHanzi = false, questionStyle, gradient, hint, feedback, setFeedback, onSubmit, currentState }) {
  const [input, setInput] = useState('');
  const [submitted, setSubmitted] = useState(false);

  const normalize = (s) => s.toLowerCase()
    .replace(/[āáǎà]/g, 'a').replace(/[ēéěè]/g, 'e')
    .replace(/[īíǐì]/g, 'i').replace(/[ōóǒò]/g, 'o')
    .replace(/[ūúǔù]/g, 'u').replace(/[ǖǘǚǜü]/g, 'u')
    .replace(/\s/g, '').trim();

  const check = () => {
    if (submitted) return;
    setSubmitted(true);
    const correct = normalize(input) === normalize(item.pinyin);
    setFeedback(correct ? 'correct' : 'wrong');
    if (!correct) {
      // Si la réponse est proche en stripping les tons → erreur de ton
      const stripTones = (s) => normalize(s);
      const errorType = (input.length > 0 && stripTones(input) === stripTones(item.pinyin))
        ? 'tone'
        : 'unknown';
      logError({
        item_id: item.id, hanzi: item.hanzi, pinyin: item.pinyin, fr: item.fr,
        facet: isHanzi ? 'hanzi_to_pinyin' : 'sens_to_pinyin', mode: 'session',
        error_type: errorType,
        user_answer: input, correct_answer: item.pinyin,
      });
    }
  };

  return (
    <>
      <QuestionBox gradient={gradient}>
        <p className={isHanzi ? 'hanzi' : ''} style={{ margin: 0, color: C.text, ...questionStyle }}>
          {questionText}
        </p>
        <p style={{ fontSize: 12, color: C.textDim, margin: '14px 0 0' }}>{hint}</p>
      </QuestionBox>

      <input
        value={input} onChange={e => setInput(e.target.value)} disabled={submitted}
        placeholder="ai, ni hao..."
        style={{
          width: '100%', background: C.bgCard,
          border: `0.5px solid ${submitted ? (feedback === 'correct' ? C.teal : C.red) : C.border}`,
          color: C.text, padding: 14, borderRadius: 8, fontSize: 16, marginBottom: 16,
          textAlign: 'center', letterSpacing: 1,
        }}
        onKeyDown={e => e.key === 'Enter' && !submitted && check()}
      />

      {!submitted ? (
        <button onClick={check} disabled={!input} style={{
          width: '100%', background: input ? C.amber : C.border, color: input ? C.bg : C.textDim,
          border: 'none', padding: 13, borderRadius: 8, fontSize: 14, fontWeight: 600,
        }}>VÉRIFIER</button>
      ) : (
        <>
          <div style={{
            padding: 14, borderRadius: 8, marginBottom: 16,
            background: feedback === 'correct' ? 'rgba(45,212,191,0.08)' : 'rgba(239,68,68,0.08)',
            border: `0.5px solid ${feedback === 'correct' ? C.teal : C.red}`,
          }}>
            <p style={{ margin: 0, fontSize: 13, color: feedback === 'correct' ? C.teal : C.red }}>
              {feedback === 'correct' ? '✓ Correct' : `✗ Bonne réponse : ${item.pinyin}`}
            </p>
          </div>
          <SmartRating feedback={feedback} onRate={onSubmit} card={currentState} />
        </>
      )}
    </>
  );
}

// AutoRatingButtons : pour les exercices où l'app sait déjà si c'est juste (QCM, saisie pinyin).
// On propose juste "Bien" (auto-passage 1.5s) ou "Trop facile" (intervalle plus long).
function AutoRatingButtons({ onRate, card, autoPassDelay = 1500 }) {
  const [countdown, setCountdown] = useState(autoPassDelay);
  const [paused, setPaused] = useState(false);

  useEffect(() => {
    if (paused) return;
    if (countdown <= 0) {
      onRate(3); // "Bien"
      return;
    }
    const t = setTimeout(() => setCountdown(c => c - 100), 100);
    return () => clearTimeout(t);
  }, [countdown, paused, onRate]);

  const goodInterval = predictedInterval(card, 3);
  const easyInterval = predictedInterval(card, 4);
  const progress = Math.max(0, Math.min(100, (countdown / autoPassDelay) * 100));

  return (
    <>
      <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 2, textAlign: 'center', margin: '0 0 10px' }}>
        ÉVALUATION
      </p>
      <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: 6 }}>
        <button
          onClick={() => onRate(3)}
          onMouseEnter={() => setPaused(true)}
          onMouseLeave={() => setPaused(false)}
          style={{
            position: 'relative', overflow: 'hidden',
            background: 'transparent', border: `0.5px solid ${C.teal}`,
            color: C.teal, padding: '14px 8px', borderRadius: 8, fontSize: 12,
            textAlign: 'center', fontWeight: 500,
          }}>
          {!paused && (
            <span style={{
              position: 'absolute', bottom: 0, left: 0, height: 2,
              width: `${progress}%`, background: C.teal, opacity: 0.5,
              transition: 'width 0.1s linear',
            }} />
          )}
          BIEN · CONTINUER
          <span style={{ display: 'block', fontSize: 9, opacity: 0.65, marginTop: 3 }}>
            revoir dans {intervalLabel(goodInterval)}
          </span>
        </button>
        <button
          onClick={() => onRate(4)}
          onMouseEnter={() => setPaused(true)}
          onMouseLeave={() => setPaused(false)}
          style={{
            background: 'transparent', border: `0.5px solid ${C.purple}`,
            color: C.purple, padding: '14px 4px', borderRadius: 8, fontSize: 11,

  const interestOptions = [

    { id: 'sens', label: 'Sens / traduction', desc: 'Le sens en français', color: C.purple },
  ];

  const checkForUpdates = async () => {
    setUpdateStatus('checking');
    try {
      if ('serviceWorker' in navigator) {
        const reg = await navigator.serviceWorker.getRegistration();
        if (reg) {
          await reg.update();
          if (reg.waiting) {
            // Une nouvelle version est prête, on l'active
            setUpdateStatus('updating');
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            // controllerchange dans index.html va recharger la page
            return;
          }
          // Pas de mise à jour disponible
          await new Promise(r => setTimeout(r, 800));
          setUpdateStatus('uptodate');
          setTimeout(() => setUpdateStatus('idle'), 2000);
        } else {
          location.reload();
        }

function StatsScreen({ learnerState, profile, onBack }) {
  const facets = deriveFacets(profile.interests);
  const showHanzi = profile.interests.includes('hanzi');
  const showPinyin = profile.interests.includes('pinyin');
  const showSens = profile.interests.includes('sens');

  const breakdown = useMemo(() => {
    const counts = { new: 0, learning: 0, review: 0, relearning: 0 };
    let totalReps = 0, totalLapses = 0;
    const levels = profile.hskLevels || ['hsk1'];
    const filtered = HSK1_DATA.filter(w => w.tags.some(t => levels.includes(t)));
    for (const item of filtered) {
      for (const facet of facets) {
        const key = `${item.id}_${facet}`;
        const state = learnerState[key] || initialState();
        counts[state.state]++;
        totalReps += state.reps;
        totalLapses += state.lapses;
      }
    }
    const total = filtered.length * Math.max(facets.length, 1);
    return { counts, totalReps, totalLapses, total };
  }, [learnerState, profile.interests, profile.hskLevels]);

  const knownItems = useMemo(() => {
    if (facets.length === 0) return [];
    const levels = profile.hskLevels || ['hsk1'];
    const filtered = HSK1_DATA.filter(w => w.tags.some(t => levels.includes(t)));
    const items = [];
    for (const item of filtered) {
      const states = facets.map(f => learnerState[`${item.id}_${f}`] || initialState());
      const avgReps = states.reduce((s, st) => s + st.reps, 0) / facets.length;
      const mastered = states.filter(s => s.reps >= 2 && s.state === 'review').length;
      items.push({ ...item, avgReps, mastered, total: facets.length });
    }
    return items.filter(i => i.avgReps > 0).sort((a, b) => b.mastered - a.mastered);
  }, [learnerState, profile.interests, profile.hskLevels]);

  return (
    <div className="slide-up">
      <button onClick={onBack} style={{
        background: 'transparent', border: 'none', color: C.teal, fontSize: 13, padding: 0, marginBottom: 16,
      }}>← retour</button>

      <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 2, margin: '0 0 6px' }}>STATISTIQUES</p>
      <p style={{ fontSize: 22, fontWeight: 500, margin: '0 0 28px', color: C.text }}>Ta progression</p>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginBottom: 20 }}>
        <Stat label="Nouvelles" value={breakdown.counts.new} color={C.purple} />
        <Stat label="En révision" value={breakdown.counts.review} color={C.teal} />
        <Stat label="Total reps" value={breakdown.totalReps} color={C.amber} />
        <Stat label="Oublis" value={breakdown.totalLapses} color={C.red} />
      </div>

      <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 2, margin: '0 0 10px' }}>
        VOCABULAIRE TRAVAILLÉ ({knownItems.length})
      </p>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
        {knownItems.length === 0 && (
          <p style={{ color: C.textDim, fontSize: 13, textAlign: 'center', padding: '2rem 0' }}>
            Aucune carte travaillée pour l'instant.<br />Lance une session !
          </p>
        )}
        {knownItems.map(item => (
          <div key={item.id} style={{
            background: C.bgCard, border: `0.5px solid ${C.border}`,
            borderRadius: 8, padding: 12, display: 'flex', alignItems: 'center', gap: 12,
          }}>
            {showHanzi && (
              <span className="hanzi" style={{ fontSize: 22, color: C.text, minWidth: 50 }}>{item.hanzi}</span>
            )}
            <div style={{ flex: 1 }}>
              {showSens && <p style={{ fontSize: 12, margin: '0 0 2px' }}>{item.fr}</p>}
              {showPinyin && <p style={{ fontSize: 10, color: C.textDim, margin: 0, letterSpacing: 1 }}>{item.pinyin}</p>}
            </div>
            <div style={{ display: 'flex', gap: 3 }}>
              {Array.from({ length: item.total }).map((_, i) => (
                <div key={i} style={{
                  width: 6, height: 6, borderRadius: '50%',
                  background: i < item.mastered ? C.teal : C.border,
                }} />
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ============================================================
// SMART SENTENCE SCREEN — phrase générée par Claude avec QCM
// ============================================================
function SmartSentenceScreen({ profile, learnerState, setLearnerState, onBack }) {
  const isOnline = useOnlineStatus();
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [exercise, setExercise] = useState(null);
  const [selectedAnswer, setSelectedAnswer] = useState(null);
  const [feedback, setFeedback] = useState(null);
  const [stats, setStats] = useState({ done: 0, correct: 0 });
  const [currentTarget, setCurrentTarget] = useState(null);

  // Récupérer le pool de mots du profil
  const levels = profile.hskLevels || ['hsk1'];
  const pool = HSK1_DATA.filter(w => w.tags.some(t => levels.includes(t)));

  // Mots déjà rencontrés (utilisés comme contexte connu pour Claude)
  const knownWords = useMemo(() => {
    const seen = new Set();
    for (const item of pool) {
      const anyTouched = ['hanzi_to_sens', 'sens_to_hanzi', 'pinyin_to_sens', 'sens_to_pinyin', 'hanzi_to_pinyin', 'pinyin_to_hanzi']
        .some(f => {
          const state = learnerState[`${item.id}_${f}`];
          return state && state.reps > 0;
        });
      if (anyTouched) seen.add(item.hanzi);
    }
    // Si peu de mots travaillés, prendre les premiers HSK1 pour avoir du contexte
    if (seen.size < 10) {
      pool.slice(0, 20).forEach(w => seen.add(w.hanzi));
    }
    return Array.from(seen);
  }, [learnerState, levels.join(',')]);

  const [fromPack, setFromPack] = useState(false);
  const [packId, setPackId] = useState(null);

  const generateNew = async () => {
    setLoading(true);
    setError(null);
    setExercise(null);
    setSelectedAnswer(null);
    setFeedback(null);
    setFromPack(false);
    setPackId(null);

    // Stratégie : online → API ; offline → pack
    if (!isOnline) {
      const fromStock = pickFromPack('sentences');
      if (fromStock) {
        setExercise(fromStock);
        setCurrentTarget(fromStock.target_word || null);
        setFromPack(true);
        setPackId(fromStock.id);
        setLoading(false);
        return;
      }
      // Pas de pack et pas de réseau
      setError('Hors-ligne et aucun exercice en stock. Reconnecte-toi ou télécharge un pack offline.');
      setLoading(false);
      return;
    }

    // Mode online : choisir un mot cible et appeler l'API
    const candidates = pool.filter(w => {
      const notTouched = !['hanzi_to_sens', 'sens_to_hanzi'].some(f => {
        const s = learnerState[`${w.id}_${f}`];
        return s && s.reps > 0;
      });
      return notTouched;
    });
    const target = (candidates.length > 0 ? candidates : pool)[Math.floor(Math.random() * (candidates.length > 0 ? candidates.length : pool.length))];
    setCurrentTarget(target);

    const hskNum = levels.includes('hsk3') ? 3 : levels.includes('hsk2') ? 2 : 1;

    try {
      const result = await api.generateSentence({
        known_words: knownWords.slice(0, 60),
        target_word: { hanzi: target.hanzi, pinyin: target.pinyin, fr: target.fr },
        hsk_level: hskNum,
        format: 'qcm',
        answer_in: 'fr',
      });
      setExercise(result);
    } catch (e) {
      // Si erreur réseau, fallback sur le pack si dispo
      const fromStock = pickFromPack('sentences');
      if (fromStock) {
        setExercise(fromStock);
        setCurrentTarget(fromStock.target_word || target);
        setFromPack(true);
        setPackId(fromStock.id);
      } else {
        setError(e.message || 'Erreur de génération');
      }
    }
    setLoading(false);
  };

  // Charger un premier exercice à l'ouverture
  useEffect(() => {
    if (!exercise && !loading && !error) generateNew();
  }, []);

  const handleSelect = (idx) => {
    if (selectedAnswer !== null) return;
    setSelectedAnswer(idx);
    const correct = idx === exercise.correct_index;
    setFeedback(correct ? 'correct' : 'wrong');
    setStats(s => ({ done: s.done + 1, correct: s.correct + (correct ? 1 : 0) }));

    // Marquer l'exo du pack comme utilisé (mais conservé)
    if (fromPack && packId) {
      markUsed('sentences', packId);
    }

    // Mettre à jour le learner_state pour le mot cible (facette hanzi_to_sens)
    if (currentTarget) {
      const key = `${currentTarget.id}_hanzi_to_sens`;
      const oldState = learnerState[key] || initialState();
      const newState = fsrsUpdate(oldState, correct ? 3 : 1);
      setLearnerState(prev => ({ ...prev, [key]: newState }));
    }
  };

  return (
    <div className="slide-up">
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
        <button onClick={onBack} style={{
          background: 'transparent', border: 'none', color: C.teal, fontSize: 13, padding: 0,
        }}>← retour</button>
        <span style={{ fontSize: 11, color: C.textDim, letterSpacing: 1 }}>
          {stats.done > 0 ? `${stats.correct} / ${stats.done}` : 'session'}
        </span>
      </div>

      <p style={{ fontSize: 11, color: C.textDim, letterSpacing: 2, margin: '0 0 6px' }}>PHRASE INTELLIGENTE</p>
      <p style={{ fontSize: 18, margin: '0 0 24px', color: C.text }}>
        <span className="hanzi" style={{ color: C.teal }}>智能</span> · phrase générée par IA
      </p>

      {loading && (
        <div className="pulse" style={{ textAlign: 'center', padding: '4rem 1rem', color: C.textDim }}>
          <p style={{ fontSize: 14, margin: 0 }}>Génération en cours...</p>
        </div>
      )}

      {error && (
        <div style={{
          background: 'rgba(239,68,68,0.06)', border: `0.5px solid ${C.red}`,
          borderLeft: `2px solid ${C.red}`, padding: 16, marginBottom: 16,
        }}>
          <p style={{ fontSize: 12, color: C.red, margin: '0 0 8px', letterSpacing: 1 }}>ERREUR</p>
          <p style={{ fontSize: 13, color: C.text, margin: '0 0 12px', lineHeight: 1.5 }}>{error}</p>
          <button onClick={generateNew} style={{
            background: 'transparent', border: `0.5px solid ${C.red}`, color: C.red,
            padding: '8px 16px', borderRadius: 8, fontSize: 12,
          }}>Réessayer</button>
        </div>
      )}

      {exercise && !loading && (
        <>
          {/* Tag du mot cible */}
          {currentTarget && (
            <div style={{ textAlign: 'center', margin: '0 0 8px' }}>
              <span style={{
                fontSize: 9, padding: '4px 10px', border: `0.5px solid ${C.purple}`,
                color: C.purple, borderRadius: 12, letterSpacing: 1.5,
              }}>MOT CIBLE · {currentTarget.hanzi} · {currentTarget.pinyin}</span>
            </div>
          )}
          {fromPack && (
            <div style={{ textAlign: 'center', margin: '0 0 14px' }}>
              <span style={{
                fontSize: 9, padding: '3px 8px', color: C.amber,
                letterSpacing: 1.5, fontStyle: 'italic',
              }}>📦 depuis le pack offline</span>
            </div>
          )}

          {/* Phrase */}
          <div style={{
            background: 'linear-gradient(135deg, rgba(45,212,191,0.06), rgba(168,85,247,0.04))',
            border: `0.5px solid ${C.borderAccent}`,
            borderRadius: 12, padding: '24px 16px', margin: '8px 0 16px', textAlign: 'center',
          }}>
            <p className="hanzi" style={{ fontSize: 28, margin: '0 0 12px', color: C.text, fontWeight: 400, lineHeight: 1.4 }}>
              {exercise.sentence_zh}
            </p>
            <p style={{ fontSize: 14, color: C.textDim, margin: '0 0 12px', letterSpacing: 1 }}>
              {exercise.sentence_pinyin}
            </p>
            {isTTSAvailable() && (
              <button onClick={() => speak(exercise.sentence_zh)} style={{
                background: 'transparent', border: `0.5px solid ${C.teal}`, color: C.teal,
                padding: '6px 14px', borderRadius: 8, fontSize: 11, letterSpacing: 1,
              }}>♪ ÉCOUTER</button>
            )}
          </div>

          <p style={{ textAlign: 'center', fontSize: 12, color: C.textDim, margin: '0 0 14px' }}>
            Quelle est la traduction ?
          </p>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 16 }}>
            {(exercise.options_fr || []).map((opt, i) => {
              let borderColor = C.border, bg = C.bgCard;
              if (selectedAnswer !== null) {
                if (i === exercise.correct_index) { borderColor = C.teal; bg = 'rgba(45,212,191,0.08)'; }
                else if (i === selectedAnswer) { borderColor = C.red; bg = 'rgba(239,68,68,0.08)'; }
              }
              return (
                <button key={i} onClick={() => handleSelect(i)} disabled={selectedAnswer !== null} style={{
                  background: bg, border: `0.5px solid ${borderColor}`, color: C.text,
                  padding: 13, borderRadius: 8, textAlign: 'left', fontSize: 14,
                }}>{opt}</button>
              );
            })}
          </div>

          {/* Feedback + explication */}
          {selectedAnswer !== null && (
            <>
              <div style={{
                padding: 14, borderRadius: 8, marginBottom: 14,
                background: feedback === 'correct' ? 'rgba(45,212,191,0.08)' : 'rgba(239,68,68,0.08)',
                border: `0.5px solid ${feedback === 'correct' ? C.teal : C.red}`,
              }}>
                <p style={{ margin: '0 0 6px', fontSize: 13, color: feedback === 'correct' ? C.teal : C.red }}>
                  {feedback === 'correct' ? '✓ Correct' : '✗ Incorrect'}
                </p>
                <p style={{ margin: 0, fontSize: 12, color: C.textDim, lineHeight: 1.5 }}>
                  Traduction : <em>{exercise.sentence_fr}</em>
                </p>
                {exercise.explanation && (
                  <p style={{ margin: '8px 0 0', fontSize: 11, color: C.textDim, fontStyle: 'italic', lineHeight: 1.5 }}>
                    {exercise.explanation}
                  </p>
                )}
              </div>

              <button onClick={generateNew} style={{
                width: '100%', background: C.teal, color: C.bg, border: 'none',
                padding: 13, borderRadius: 8, fontWeight: 600, fontSize: 14, letterSpacing: 0.5,
              }}>PHRASE SUIVANTE →</button>
            </>
          )}
        </>
      )}
    </div>
  );
}

function ReadingScreen({ profile, learnerState, onBack }) {

  const [error, setError] = useState(null);
  const [content, setContent] = useState(null); // { text_zh, text_pinyin, text_fr, new_words, questions }

  const [showPinyin, setShowPinyin] = useState(false);

  const levels = profile.hskLevels || ['hsk1'];
  const pool = HSK1_DATA.filter(w => w.tags.some(t => levels.includes(t)));

  const knownWords = useMemo(() => {
    const seen = new Set();
    for (const item of pool) {
      const anyTouched = ['hanzi_to_sens', 'sens_to_hanzi', 'pinyin_to_sens', 'sens_to_pinyin', 'hanzi_to_pinyin', 'pinyin_to_hanzi']
        .some(f => {
          const state = learnerState[`${item.id}_${f}`];
          return state && state.reps > 0;
        });
      if (anyTouched) seen.add(item.hanzi);
    }
    if (seen.size < 15) pool.slice(0, 30).forEach(w => seen.add(w.hanzi));
    return Array.from(seen);
  }, [learnerState, levels.join(',')]);

  const [fromPack, setFromPack] = useState(false);
  const [packId, setPackId] = useState(null);

  const generateText = async () => {
    setLoading(true);
    setError(null);
    setContent(null);
    setAnswers({});
    setRevealed(false);
    setFromPack(false);
    setPackId(null);

    // Stratégie : online → API ; offline → pack
    if (!isOnline) {
      const fromStock = pickFromPack('texts');
      if (fromStock) {
        setContent(fromStock);
        setFromPack(true);
        setPackId(fromStock.id);
        markUsed('texts', fromStock.id);
        setLoading(false);
        return;
      }
      setError('Hors-ligne et aucun texte en stock. Reconnecte-toi ou télécharge un pack offline.');

      return;

    const hskNum = levels.includes('hsk3') ? 3 : levels.includes('hsk2') ? 2 : 1;

        known_words: knownWords.slice(0, 80),
        hsk_level: hskNum,
        length: 'short',
        question_count: 2,
      });
      setContent(result);
    } catch (e) {
      // Fallback pack en cas d'erreur réseau
      const fromStock = pickFromPack('texts');
      if (fromStock) {
        setContent(fromStock);
        setFromPack(true);
        setPackId(fromStock.id);
        markUsed('texts', fromStock.id);
      } else {
        setError(e.message || 'Erreur de génération');

    setLoading(false);

    if (!content && !loading && !error) generateText();

          <span style={{ fontSize: 9, color: C.amber, letterSpacing: 1.5, fontStyle: 'italic' }}>

      <p style={{ fontSize: 18, margin: '0 0 24px', color: C.text }}>
        <span className="hanzi" style={{ color: C.pink }}>阅读</span> · texte généré par IA
      </p>

          <p style={{ fontSize: 14, margin: 0 }}>Génération du texte...</p>

            borderRadius: 12, padding: '20px 16px', margin: '0 0 14px',

                flex: 1, background: revealed ? 'rgba(168,85,247,0.1)' : 'transparent',
                border: `0.5px solid ${C.purple}`, color: C.purple,
                padding: '8px', borderRadius: 8, fontSize: 11, letterSpacing: 1,
              }}>{revealed ? '✓ ' : ''}TRADUCTION</button>
            </div>
          </div>

          {/* Mots nouveaux */}
          {content.new_words && content.new_words.length > 0 && (
            <div style={{
              background: C.bgCard, border: `0.5px solid ${C.border}`,

              <p style={{ fontSize: 10, color: C.amber, letterSpacing: 1, margin: '0 0 8px' }}>
                NOUVEAUX MOTS
              </p>
              {content.new_words.map((w, i) => (
                <div key={i} style={{ marginBottom: 6, fontSize: 12 }}>
                  <span className="hanzi" style={{ color: C.text, fontSize: 15 }}>{w.hanzi}</span>
                  <span style={{ color: C.textDim, marginLeft: 8 }}>{w.pinyin}</span>
                  <span style={{ color: C.textFaint, marginLeft: 8 }}>· {w.fr}</span>
                </div>
              ))}
            </div>
          )}

          {/* Questions */}
          {content.questions && content.questions.length > 0 && (
            <>
              <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 2, margin: '0 0 10px' }}>QUESTIONS</p>
              {content.questions.map((q, qi) => (
                <div key={qi} style={{
                  background: C.bgCard, border: `0.5px solid ${C.border}`,
                  borderRadius: 8, padding: 14, marginBottom: 12,
                }}>
                  <p className="hanzi" style={{ fontSize: 15, margin: '0 0 4px', color: C.text }}>
                    {q.q_zh}
                  </p>
                  {q.q_pinyin && (
                    <p style={{ fontSize: 11, color: C.textDim, margin: '0 0 12px', letterSpacing: 0.5 }}>
                      {q.q_pinyin}
                    </p>
                  )}
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                    {(q.options_zh || []).map((opt, oi) => {
                      const userAnswer = answers[qi];
                      let borderColor = C.border, bg = 'transparent';
                      if (userAnswer !== undefined) {
                        if (oi === q.correct_index) { borderColor = C.teal; bg = 'rgba(45,212,191,0.08)'; }
                        else if (oi === userAnswer) { borderColor = C.red; bg = 'rgba(239,68,68,0.08)'; }
                      }
                      return (
                        <button
                          key={oi}
                          onClick={() => handleAnswer(qi, oi)}
                          disabled={userAnswer !== undefined}
                          style={{
                            background: bg, border: `0.5px solid ${borderColor}`, color: C.text,
                            padding: 10, borderRadius: 8, textAlign: 'left', fontSize: 13,
                          }}
                        >
                          <span className="hanzi">{opt}</span>
                          {q.options_pinyin && q.options_pinyin[oi] && (
                            <span style={{ color: C.textFaint, fontSize: 11, marginLeft: 8 }}>
                              {q.options_pinyin[oi]}
                            </span>
                          )}
                        </button>
                      );
                    })}
                  </div>
                </div>
              ))}
            </>
          )}

          <button onClick={generateText} style={{
            width: '100%', background: C.pink, color: C.bg, border: 'none',
            padding: 13, borderRadius: 8, fontWeight: 600, fontSize: 14, letterSpacing: 0.5,
            marginTop: 14,
          }}>NOUVEAU TEXTE →</button>
        </>
      )}
    </div>
  );
}
