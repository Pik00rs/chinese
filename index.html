function SentenceBuilderScreen({ profile, onBack }) {
  const [currentIdx, setCurrentIdx] = useState(0);
  const [pool, setPool] = useState([]);
  const [available, setAvailable] = useState([]); // mots restant à tapper (avec distracteurs)
  const [built, setBuilt] = useState([]); // mots déjà tappés dans l'ordre
  const [feedback, setFeedback] = useState(null); // 'correct' | 'wrong' | null
  const [stats, setStats] = useState({ done: 0, correct: 0 });

  const levels = profile.hskLevels || ['hsk1'];

  // Filtrer les phrases selon les niveaux activés et mélanger
  useEffect(() => {
    const filtered = SENTENCE_BANK.filter(s => levels.includes(s.hsk));
    const shuffled = [...filtered].sort(() => Math.random() - 0.5);
    setPool(shuffled);
  }, [levels.join(',')]);

  const current = pool[currentIdx];

  // Préparer la liste des mots disponibles (tokens + distracteurs, mélangés)
  useEffect(() => {
    if (!current) return;
    const allTokens = [
      ...current.tokens.map((t, i) => ({ word: t, key: `t_${i}_${Math.random()}` })),
      ...current.distractors.map((d, i) => ({ word: d, key: `d_${i}_${Math.random()}` })),
    ];
    setAvailable(allTokens.sort(() => Math.random() - 0.5));
    setBuilt([]);
    setFeedback(null);
  }, [currentIdx, pool]);

  if (pool.length === 0) {
    return (
      <div className="slide-up" style={{ padding: '2rem 0' }}>
        <button onClick={onBack} style={{
          background: 'transparent', border: 'none', color: C.teal, fontSize: 13, padding: 0, marginBottom: 24,
        }}>← retour</button>
        <p style={{ fontSize: 11, color: C.textDim, letterSpacing: 2, margin: '0 0 6px' }}>CONSTRUCTION</p>
        <p style={{ fontSize: 22, fontWeight: 500, margin: '0 0 24px', color: C.text }}>Pas de phrases pour ce niveau</p>
        <p style={{ fontSize: 13, color: C.textDim, lineHeight: 1.6 }}>
          Active HSK 1 dans tes paramètres pour avoir des phrases à reconstruire.
        </p>
      </div>
    );
  }

  if (!current) return null;

  const handleTokenTap = (tokenObj) => {
    if (feedback) return;
    setBuilt([...built, tokenObj]);
    setAvailable(available.filter(t => t.key !== tokenObj.key));
  };

  const handleBuiltTap = (tokenObj) => {
    if (feedback) return;
    setBuilt(built.filter(t => t.key !== tokenObj.key));
    setAvailable([...available, tokenObj]);
  };

  const handleCheck = () => {
    if (feedback) return;
    const userPhrase = built.map(b => b.word).join('');
    const correctPhrase = current.tokens.join('');
    const isCorrect = userPhrase === correctPhrase;
    setFeedback(isCorrect ? 'correct' : 'wrong');
    setStats(s => ({ done: s.done + 1, correct: s.correct + (isCorrect ? 1 : 0) }));
    if (!isCorrect) {
      logError({
        item_id: `sentence_${currentIdx}`,
        hanzi: correctPhrase,
        pinyin: '',
        fr: current.fr,
        facet: 'sentence_construction',
        mode: 'sentence_builder',
        error_type: 'structure',
        user_answer: userPhrase,
        correct_answer: correctPhrase,
      });
    }
    markActivity(1);
  };

  const handleNext = () => {
    if (currentIdx + 1 >= pool.length) {
      // Recommencer en mélangeant
      setPool(p => [...p].sort(() => Math.random() - 0.5));
      setCurrentIdx(0);
    } else {
      setCurrentIdx(currentIdx + 1);
    }
  };

  const canCheck = built.length > 0 && !feedback;

  return (
    <div className="slide-up">
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
        <button onClick={onBack} style={{
          background: 'transparent', border: 'none', color: C.teal, fontSize: 13, padding: 0,
        }}>← retour</button>
        <span style={{ fontSize: 11, color: C.textDim, letterSpacing: 1 }}>
          {stats.done > 0 ? `${stats.correct} / ${stats.done}` : `${currentIdx + 1} / ${pool.length}`}
        </span>
      </div>

      <p style={{ fontSize: 11, color: C.textDim, letterSpacing: 2, margin: '0 0 6px' }}>CONSTRUCTION</p>
      <p style={{ fontSize: 18, margin: '0 0 16px', color: C.text }}>
        <span className="hanzi" style={{ color: C.amber }}>组句</span> · reconstruis la phrase
      </p>

      {/* Niveau de la phrase */}
      <div style={{ textAlign: 'center', margin: '0 0 16px' }}>
        <span style={{
          fontSize: 9, padding: '4px 10px', border: `0.5px solid ${C.amber}`,
          color: C.amber, borderRadius: 12, letterSpacing: 1.5,
        }}>{current.hsk.toUpperCase()}</span>
      </div>

      {/* Phrase française à traduire */}
      <div style={{
        background: `linear-gradient(135deg, rgba(251,191,36,0.06), rgba(244,114,182,0.04))`,
        border: `0.5px solid ${C.borderAccent}`,
        borderRadius: 12, padding: 18, marginBottom: 18, textAlign: 'center',
      }}>
        <p style={{ fontSize: 16, color: C.text, margin: 0, lineHeight: 1.5 }}>
          {current.fr}
        </p>
      </div>

      {/* Zone de construction */}
      <div style={{
        background: C.bgCard,
        border: `1px solid ${
          feedback === 'correct' ? C.teal : feedback === 'wrong' ? C.red : C.border
        }`,
        borderRadius: 8, padding: 14, marginBottom: 14, minHeight: 64,
        display: 'flex', flexWrap: 'wrap', gap: 6, alignItems: 'flex-start',
      }}>
        {built.length === 0 && (
          <p style={{ color: C.textFaint, fontSize: 12, margin: 'auto', fontStyle: 'italic' }}>
            Tappe les mots dans l'ordre...
          </p>
        )}
        {built.map(t => (
          <button
            key={t.key}
            onClick={() => handleBuiltTap(t)}
            disabled={!!feedback}
            className="hanzi"
            style={{
              background: feedback === 'correct' ? 'rgba(45,212,191,0.15)' : feedback === 'wrong' ? 'rgba(239,68,68,0.15)' : C.bgElevated,
              border: `0.5px solid ${feedback === 'correct' ? C.teal : feedback === 'wrong' ? C.red : C.borderAccent}`,
              color: C.text, padding: '8px 12px', borderRadius: 6, fontSize: 18,
            }}
          >{t.word}</button>
        ))}
      </div>

      {/* Banque de mots disponibles */}
      {!feedback && (
        <>
          <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 2, margin: '0 0 8px' }}>MOTS DISPONIBLES</p>
          <div style={{
            display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 16,
            minHeight: 80,
          }}>
            {available.map(t => (
              <button
                key={t.key}
                onClick={() => handleTokenTap(t)}
                className="hanzi"
                style={{
                  background: C.bgCard, border: `0.5px solid ${C.border}`,
                  color: C.text, padding: '10px 14px', borderRadius: 6, fontSize: 18,
                }}
              >{t.word}</button>
            ))}
          </div>
        </>
      )}

      {/* Feedback */}
      {feedback === 'correct' && (
        <div style={{
          padding: 14, borderRadius: 8, marginBottom: 14,
          background: 'rgba(45,212,191,0.08)',
          border: `0.5px solid ${C.teal}`,
        }}>
          <p style={{ margin: 0, fontSize: 13, color: C.teal, fontWeight: 500 }}>
            ✓ Parfait !
          </p>
          <p style={{ margin: '6px 0 0', fontSize: 12, color: C.textDim, fontStyle: 'italic' }}>
            {current.tokens.join(' ')}
          </p>
        </div>
      )}

      {feedback === 'wrong' && (
        <div style={{
          padding: 14, borderRadius: 8, marginBottom: 14,
          background: 'rgba(239,68,68,0.08)',
          border: `0.5px solid ${C.red}`,
        }}>
          <p style={{ margin: '0 0 6px', fontSize: 13, color: C.red, fontWeight: 500 }}>
            ✗ Pas tout à fait
          </p>
          <p style={{ margin: 0, fontSize: 12, color: C.textDim }}>
            <span style={{ color: C.text }}>Bonne réponse :</span> <span className="hanzi" style={{ fontSize: 14, color: C.text }}>{current.tokens.join(' ')}</span>
          </p>
        </div>
      )}

      {/* Boutons d'action */}
      {!feedback ? (
        <button
          onClick={handleCheck}
          disabled={!canCheck}
          style={{
            width: '100%', background: canCheck ? C.amber : C.border,
            color: canCheck ? C.bg : C.textDim, border: 'none', padding: 13,
            borderRadius: 8, fontWeight: 600, fontSize: 14, letterSpacing: 0.5,
          }}
        >VÉRIFIER</button>
      ) : (
        <button onClick={handleNext} style={{
          width: '100%', background: C.amber, color: C.bg, border: 'none',
          padding: 13, borderRadius: 8, fontWeight: 600, fontSize: 14, letterSpacing: 0.5,
        }}>PHRASE SUIVANTE →</button>
      )}
    </div>
  );
}


function PackDownloadScreen({ profile, learnerState, onBack }) {
  const isOnline = useOnlineStatus();
  const [sentenceCount, setSentenceCount] = useState(50);
  const [textCount, setTextCount] = useState(20);
  const [dialogueCount, setDialogueCount] = useState(10);
  const [includeSentences, setIncludeSentences] = useState(true);
  const [includeTexts, setIncludeTexts] = useState(true);
  const [includeDialogues, setIncludeDialogues] = useState(false);

  const [downloading, setDownloading] = useState(false);
  const [progress, setProgress] = useState({ current: 0, total: 0, type: '' });
  const [errors, setErrors] = useState([]);
  const [completed, setCompleted] = useState(false);
  const cancelRef = useRef(false);

  // État courant du pack en stock
  const [packStats, setPackStats] = useState(countTotal());
  const [available, setAvailable] = useState(countAvailable());

  const refreshStats = () => {
    setPackStats(countTotal());
    setAvailable(countAvailable());
  };

  useEffect(() => { refreshStats(); }, []);

  const levels = profile.hskLevels || ['hsk1'];
  const pool = HSK1_DATA.filter(w => w.tags.some(t => levels.includes(t)));
  const hskNum = levels.includes('hsk3') ? 3 : levels.includes('hsk2') ? 2 : 1;

  // Construire la liste des mots connus pour donner du contexte à Claude
  const knownWords = useMemo(() => {
    const seen = new Set();
    for (const item of pool) {
      const anyTouched = ['hanzi_to_sens', 'sens_to_hanzi', 'pinyin_to_sens', 'sens_to_pinyin', 'hanzi_to_pinyin', 'pinyin_to_hanzi']
        .some(f => {
          const state = learnerState[`${item.id}_${f}`];
          return state && state.reps > 0;
        });
      if (anyTouched) seen.add(item.hanzi);
    }
    if (seen.size < 15) pool.slice(0, 30).forEach(w => seen.add(w.hanzi));
    return Array.from(seen);
  }, []);

  const totalRequested =
    (includeSentences ? sentenceCount : 0) +
    (includeTexts ? textCount : 0) +
    (includeDialogues ? dialogueCount : 0);

  const startDownload = async () => {
    if (!isOnline) {
      setErrors(['Tu dois être connecté à internet pour télécharger.']);
      return;
    }
    if (totalRequested === 0) {
      setErrors(['Choisis au moins un type d\'exercice.']);
      return;
    }
    setDownloading(true);
    setErrors([]);
    setCompleted(false);
    cancelRef.current = false;

    let done = 0;
    const total = totalRequested;
    setProgress({ current: 0, total, type: 'init' });

    // ===== Phase 1 : phrases =====
    if (includeSentences) {
      for (let i = 0; i < sentenceCount; i++) {
        if (cancelRef.current) break;
        const target = pool[Math.floor(Math.random() * pool.length)];
        try {
          const result = await api.generateSentence({
            known_words: knownWords.slice(0, 60),
            target_word: { hanzi: target.hanzi, pinyin: target.pinyin, fr: target.fr },
            hsk_level: hskNum,
            format: 'qcm',
            answer_in: 'fr',
          });
          addToPack('sentences', { ...result, target_word: target });
          done++;
          setProgress({ current: done, total, type: 'sentences' });
        } catch (e) {
          setErrors(prev => [...prev, `Phrase ${i + 1}: ${e.message.slice(0, 80)}`]);
        }
        // Petit délai pour éviter rate-limiting
        await new Promise(r => setTimeout(r, 200));
      }
    }

    // ===== Phase 2 : textes =====
    if (includeTexts && !cancelRef.current) {
      for (let i = 0; i < textCount; i++) {
        if (cancelRef.current) break;
        try {
          const result = await api.generateText({
            known_words: knownWords.slice(0, 80),
            hsk_level: hskNum,
            length: 'short',
            question_count: 2,
          });
          addToPack('texts', result);
          done++;
          setProgress({ current: done, total, type: 'texts' });
        } catch (e) {
          setErrors(prev => [...prev, `Texte ${i + 1}: ${e.message.slice(0, 80)}`]);
        }
        await new Promise(r => setTimeout(r, 250));
      }
    }

    // ===== Phase 3 : dialogues (= phrases d'amorce conversationnelles) =====
    if (includeDialogues && !cancelRef.current) {
      for (let i = 0; i < dialogueCount; i++) {
        if (cancelRef.current) break;
        // On utilise generate-sentence avec un format conversationnel
        const target = pool[Math.floor(Math.random() * pool.length)];
        try {
          const result = await api.generateSentence({
            known_words: knownWords.slice(0, 60),
            target_word: { hanzi: target.hanzi, pinyin: target.pinyin, fr: target.fr },
            hsk_level: hskNum,
            format: 'translation', // demande à traduire — plus actif
            answer_in: 'fr',
          });
          addToPack('dialogues', { ...result, target_word: target });
          done++;
          setProgress({ current: done, total, type: 'dialogues' });
        } catch (e) {
          setErrors(prev => [...prev, `Dialogue ${i + 1}: ${e.message.slice(0, 80)}`]);
        }
        await new Promise(r => setTimeout(r, 200));
      }
    }

    setDownloading(false);
    setCompleted(!cancelRef.current);
    refreshStats();
  };

  const handleCancel = () => {
    cancelRef.current = true;
  };

  const handleClear = () => {
    if (confirm('Effacer TOUT le pack offline ? Tu pourras le re-télécharger plus tard.')) {
      clearPack();
      refreshStats();
    }
  };

  const eta = downloading
    ? Math.round(((progress.total - progress.current) * 2.5) / 60)
    : 0;

  return (
    <div className="slide-up">
      <button onClick={onBack} disabled={downloading} style={{
        background: 'transparent', border: 'none', color: downloading ? C.textFaint : C.teal,
        fontSize: 13, padding: 0, marginBottom: 16,
      }}>← retour</button>

      <p style={{ fontSize: 11, color: C.textDim, letterSpacing: 2, margin: '0 0 6px' }}>PACK OFFLINE</p>
      <p style={{ fontSize: 22, fontWeight: 500, margin: '0 0 8px', color: C.text }}>
        Pré-charger des exos
      </p>
      <p style={{ fontSize: 13, color: C.textDim, margin: '0 0 24px', lineHeight: 1.5 }}>
        Génère un stock d'exercices que tu pourras utiliser hors-ligne (avion, métro, etc.).
      </p>

      {/* État du pack actuel */}
      <div style={{
        background: C.bgCard, border: `0.5px solid ${C.border}`,
        borderLeft: `2px solid ${available.total > 0 ? C.teal : C.textFaint}`,
        padding: 14, marginBottom: 24,
      }}>
        <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 1, margin: '0 0 8px' }}>STOCK ACTUEL</p>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <span style={{ fontSize: 24, color: C.text, fontWeight: 500 }}>{available.total}</span>
          <span style={{ fontSize: 11, color: C.textDim }}>exos dispo</span>
        </div>
        {available.total > 0 && (
          <p style={{ fontSize: 10, color: C.textDim, margin: '6px 0 0' }}>
            {available.sentences > 0 && `${available.sentences} phrases · `}
            {available.texts > 0 && `${available.texts} textes · `}
            {available.dialogues > 0 && `${available.dialogues} dialogues`}
          </p>
        )}
        {(packStats.sentences + packStats.texts + packStats.dialogues) > available.total && (
          <p style={{ fontSize: 10, color: C.textFaint, margin: '4px 0 0', fontStyle: 'italic' }}>
            ({(packStats.sentences + packStats.texts + packStats.dialogues) - available.total} déjà utilisés, gardés en archive)
          </p>
        )}
      </div>

      {/* Pendant le téléchargement */}
      {downloading && (
        <div style={{
          background: 'linear-gradient(135deg, rgba(45,212,191,0.06), rgba(168,85,247,0.04))',
          border: `0.5px solid ${C.teal}`,
          borderRadius: 12, padding: 18, marginBottom: 20,
        }}>
          <p style={{ fontSize: 10, color: C.teal, letterSpacing: 2, margin: '0 0 10px' }}>
            TÉLÉCHARGEMENT EN COURS · {progress.type.toUpperCase()}
          </p>
          <p style={{ fontSize: 26, color: C.text, margin: '0 0 12px', fontWeight: 500 }}>
            {progress.current} / {progress.total}
          </p>
          <div style={{ height: 4, background: C.border, borderRadius: 2, overflow: 'hidden', marginBottom: 12 }}>
            <div style={{
              width: `${(progress.current / progress.total) * 100}%`,
              height: '100%',
              background: `linear-gradient(90deg, ${C.teal}, ${C.purple})`,
              transition: 'width 0.3s',
            }} />
          </div>
          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, color: C.textDim, marginBottom: 14 }}>
            <span>{Math.round((progress.current / progress.total) * 100)}%</span>
            {eta > 0 && <span>~{eta} min restantes</span>}
          </div>
          <button onClick={handleCancel} style={{
            width: '100%', background: 'transparent', border: `0.5px solid ${C.amber}`,
            color: C.amber, padding: 10, borderRadius: 8, fontSize: 12, letterSpacing: 1,
          }}>⏸ ANNULER</button>
        </div>
      )}

      {/* Message de fin */}
      {completed && !downloading && (
        <div style={{
          background: 'rgba(45,212,191,0.08)', border: `0.5px solid ${C.teal}`,
          padding: 14, marginBottom: 20, borderRadius: 8,
        }}>
          <p style={{ fontSize: 13, color: C.teal, margin: '0 0 4px', fontWeight: 500 }}>
            ✓ Pack téléchargé
          </p>
          <p style={{ fontSize: 12, color: C.text, margin: 0, lineHeight: 1.5 }}>
            {progress.current} exercices ajoutés. Tu peux les utiliser maintenant même sans réseau.
          </p>
        </div>
      )}

      {/* Erreurs éventuelles */}
      {errors.length > 0 && !downloading && (
        <div style={{
          background: 'rgba(251,191,36,0.06)', border: `0.5px solid ${C.amber}`,
          borderLeft: `2px solid ${C.amber}`, padding: 12, marginBottom: 16,
        }}>
          <p style={{ fontSize: 11, color: C.amber, letterSpacing: 1, margin: '0 0 6px' }}>
            {errors.length} erreur{errors.length > 1 ? 's' : ''}
          </p>
          {errors.slice(0, 3).map((e, i) => (
            <p key={i} style={{ fontSize: 11, color: C.textDim, margin: '4px 0', lineHeight: 1.4 }}>{e}</p>
          ))}
          {errors.length > 3 && (
            <p style={{ fontSize: 11, color: C.textFaint, margin: '4px 0 0', fontStyle: 'italic' }}>
              + {errors.length - 3} autres
            </p>
          )}
        </div>
      )}

      {/* Form de configuration */}
      {!downloading && (
        <>
          <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 2, margin: '0 0 12px' }}>
            CONFIGURATION
          </p>

          {/* Phrases */}
          <div style={{
            background: C.bgCard, border: `0.5px solid ${includeSentences ? C.teal : C.border}`,
            borderLeft: `2px solid ${includeSentences ? C.teal : C.border}`,
            padding: 14, marginBottom: 8,
          }}>
            <button onClick={() => setIncludeSentences(!includeSentences)} style={{
              background: 'transparent', border: 'none', color: C.text, padding: 0,
              display: 'flex', justifyContent: 'space-between', alignItems: 'center', width: '100%',
              marginBottom: includeSentences ? 12 : 0,
            }}>
              <div style={{ textAlign: 'left' }}>
                <p style={{ fontSize: 14, margin: '0 0 2px', fontWeight: 500 }}>Phrases IA</p>
                <p style={{ fontSize: 11, color: C.textDim, margin: 0 }}>
                  Phrase + QCM traduction
                </p>
              </div>
              <span style={{
                width: 18, height: 18, borderRadius: 4,
                border: `1px solid ${includeSentences ? C.teal : C.textFaint}`,
                background: includeSentences ? C.teal : 'transparent',
                color: C.bg, display: 'flex', alignItems: 'center', justifyContent: 'center',

            {includeSentences && (

          {/* Textes */}
          <div style={{

              </div>
              <span style={{
                width: 18, height: 18, borderRadius: 4,
                border: `1px solid ${includeTexts ? C.pink : C.textFaint}`,
                background: includeTexts ? C.pink : 'transparent',
                color: C.bg, display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontSize: 12, fontWeight: 700,
              }}>{includeTexts ? '✓' : ''}</span>
            </button>
            {includeTexts && (
              <>
                <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 1, margin: '0 0 6px' }}>

                <p style={{ fontSize: 11, color: C.textDim, margin: 0 }}>
                  Phrases conversationnelles à traduire

            </p>

              ~{Math.round(totalRequested * 2.5 / 60)} min · ~${(totalRequested * 0.003).toFixed(2)} d'API

          {!isOnline && (
            <p style={{ fontSize: 11, color: C.amber, textAlign: 'center', margin: '0 0 12px' }}>

              color: (isOnline && totalRequested > 0) ? C.bg : C.textDim,

              marginBottom: 12,

          {(packStats.sentences + packStats.texts + packStats.dialogues) > 0 && (
            <button onClick={handleClear} style={{
              width: '100%', background: 'transparent', border: `0.5px solid ${C.red}`,
              color: C.red, padding: 11, borderRadius: 8, fontSize: 11, letterSpacing: 1,
            }}>🗑 EFFACER LE PACK ({packStats.sentences + packStats.texts + packStats.dialogues} exos)</button>
          )}
        </>
      )}
    </div>
  );
}

// ERROR BOOK — Carnet des erreurs récentes
// ============================================================
function ErrorBookScreen({ onBack, onPracticeItem }) {
  const [errors, setErrors] = useState([]);
  const [filter, setFilter] = useState('all'); // all | tone | semantic | graphic | structure

  useEffect(() => {
    setErrors(loadErrorLog());
  }, []);

  const grouped = useMemo(() => {
    const filtered = filter === 'all'
      ? errors
      : errors.filter(e => e.error_type === filter);
    return groupErrorsByItem(filtered);
  }, [errors, filter]);

  const totalByType = useMemo(() => {
    const counts = { tone: 0, semantic: 0, graphic: 0, structure: 0, unknown: 0 };
    for (const e of errors) {
      counts[e.error_type || 'unknown'] = (counts[e.error_type || 'unknown'] || 0) + 1;
    }
    return counts;
  }, [errors]);

  const handleClearAll = () => {
    if (confirm('Effacer tout le carnet d\'erreurs ?')) {
      clearErrorLog();
      setErrors([]);
    }
  };

  const errorTypeLabels = {
    tone: { label: 'Tons', color: C.amber, icon: '♬' },
    semantic: { label: 'Sens', color: C.purple, icon: '◈' },
    graphic: { label: 'Graphique', color: C.pink, icon: '◇' },
    structure: { label: 'Grammaire', color: C.teal, icon: '⊞' },
    unknown: { label: 'Autre', color: C.textFaint, icon: '◌' },
  };

  return (
    <div className="slide-up">
      <button onClick={onBack} style={{
        background: 'transparent', border: 'none', color: C.teal, fontSize: 13, padding: 0, marginBottom: 16,
      }}>← retour</button>

      <p style={{ fontSize: 11, color: C.textDim, letterSpacing: 2, margin: '0 0 6px' }}>CARNET D'ERREURS</p>
      <p style={{ fontSize: 22, fontWeight: 500, margin: '0 0 8px', color: C.text }}>
        <span className="hanzi" style={{ color: C.red }}>错</span> · {errors.length} erreurs
      </p>
      <p style={{ fontSize: 13, color: C.textDim, margin: '0 0 24px', lineHeight: 1.5 }}>
        Analyse tes erreurs récentes par type pour cibler tes faiblesses.
      </p>

      {errors.length === 0 ? (
        <div style={{ textAlign: 'center', padding: '3rem 1rem' }}>
          <p style={{ fontSize: 48, margin: '0 0 12px', color: C.teal }}>✓</p>
          <p style={{ fontSize: 14, color: C.text, margin: '0 0 6px' }}>Aucune erreur enregistrée</p>
          <p style={{ fontSize: 12, color: C.textDim, lineHeight: 1.5 }}>
            Tes erreurs apparaîtront ici quand tu te tromperas dans les sessions.
          </p>
        </div>
      ) : (
        <>
          {/* Stats par type */}
          <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 2, margin: '0 0 10px' }}>RÉPARTITION</p>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 8, marginBottom: 20 }}>
            {Object.entries(totalByType)
              .filter(([_, count]) => count > 0)
              .map(([type, count]) => {
                const cfg = errorTypeLabels[type];
                return (
                  <div key={type} style={{
                    background: C.bgCard, border: `0.5px solid ${C.border}`,
                    borderLeft: `2px solid ${cfg.color}`, padding: 10,
                  }}>
                    <p style={{ fontSize: 10, color: C.textDim, margin: '0 0 4px', letterSpacing: 1 }}>
                      {cfg.icon} {cfg.label.toUpperCase()}
                    </p>
                    <p style={{ fontSize: 18, color: cfg.color, margin: 0, fontWeight: 500 }}>{count}</p>
                  </div>
                );
              })}
          </div>

          {/* Filtres */}
          <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 2, margin: '0 0 8px' }}>FILTRER</p>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 20 }}>
            <button onClick={() => setFilter('all')} style={{
              background: filter === 'all' ? C.teal : 'transparent',
              color: filter === 'all' ? C.bg : C.textDim,
              border: `0.5px solid ${filter === 'all' ? C.teal : C.border}`,
              padding: '6px 12px', borderRadius: 16, fontSize: 11, letterSpacing: 1,
            }}>TOUT ({errors.length})</button>
            {Object.entries(totalByType)
              .filter(([_, c]) => c > 0)
              .map(([type, count]) => {
                const cfg = errorTypeLabels[type];
                return (
                  <button key={type} onClick={() => setFilter(type)} style={{
                    background: filter === type ? cfg.color : 'transparent',
                    color: filter === type ? C.bg : cfg.color,
                    border: `0.5px solid ${cfg.color}`,
                    padding: '6px 12px', borderRadius: 16, fontSize: 11, letterSpacing: 1,
                  }}>{cfg.label} ({count})</button>
                );
              })}
          </div>

          {/* Liste des items qui posent problème */}
          <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 2, margin: '0 0 10px' }}>
            ITEMS PROBLÉMATIQUES ({grouped.length})
          </p>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {grouped.slice(0, 30).map(g => {
              const dominantType = Object.entries(g.types).sort((a, b) => b[1] - a[1])[0]?.[0] || 'unknown';
              const cfg = errorTypeLabels[dominantType];
              return (
                <div key={g.item_id} style={{
                  background: C.bgCard, border: `0.5px solid ${C.border}`,
                  borderLeft: `2px solid ${cfg.color}`, padding: 12,
                  display: 'flex', alignItems: 'center', gap: 12,
                }}>
                  <span className="hanzi" style={{ fontSize: 22, color: C.text, minWidth: 50 }}>
                    {g.hanzi}
                  </span>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    {g.fr && <p style={{ fontSize: 12, margin: '0 0 2px', color: C.text }}>{g.fr}</p>}
                    {g.pinyin && <p style={{ fontSize: 10, color: C.textDim, margin: '0 0 4px', letterSpacing: 0.5 }}>{g.pinyin}</p>}
                    <p style={{ fontSize: 10, color: cfg.color, margin: 0 }}>
                      {cfg.icon} {cfg.label} · {g.count}× raté
                      {g.confused_with.length > 0 && (
                        <span style={{ color: C.textFaint }}> · confondu avec <span className="hanzi">{g.confused_with.slice(0, 3).join(' ')}</span></span>
                      )}
                    </p>
                  </div>
                </div>
              );
            })}
          </div>

          <button onClick={handleClearAll} style={{
            marginTop: 24, width: '100%',
            background: 'transparent', border: `0.5px solid ${C.red}`,
            color: C.red, padding: 11, borderRadius: 8, fontSize: 11, letterSpacing: 1,
          }}>🗑 EFFACER LE CARNET</button>
        </>
      )}
    </div>
  );
}

function CalendarScreen({ onBack }) {
  const [calendar, setCalendar] = useState({});

  useEffect(() => {
    setCalendar(loadCalendar());
  }, []);

  // Construire la matrice des 17 dernières semaines (~4 mois)
  const matrix = useMemo(() => {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const weeks = [];
    // Calculer le lundi de la semaine actuelle puis remonter 16 semaines
    const dayOfWeek = (today.getDay() + 6) % 7; // 0 = lundi
    const startDate = new Date(today);
    startDate.setDate(today.getDate() - dayOfWeek - 16 * 7);

    for (let w = 0; w < 17; w++) {
      const week = [];
      for (let d = 0; d < 7; d++) {
        const date = new Date(startDate);
        date.setDate(startDate.getDate() + w * 7 + d);
        const dateStr = date.toISOString().slice(0, 10);
        const count = calendar[dateStr] || 0;
        const isFuture = date > today;
        week.push({ date, dateStr, count, isFuture });
      }
      weeks.push(week);
    }
    return weeks;
  }, [calendar]);

  // Stats globales
  const stats = useMemo(() => {
    const entries = Object.entries(calendar);
    const totalSessions = entries.reduce((sum, [_, c]) => sum + c, 0);
    const activeDays = entries.filter(([_, c]) => c > 0).length;

    // Calculer la série actuelle
    const today = new Date();
    let currentStreak = 0;
    for (let i = 0; i < 365; i++) {
      const d = new Date(today);
      d.setDate(today.getDate() - i);
      const ds = d.toISOString().slice(0, 10);
      if (calendar[ds] > 0) currentStreak++;
      else if (i > 0) break;
    }

    return { totalSessions, activeDays, currentStreak };
  }, [calendar]);

  // Couleur en fonction de l'intensité
  const intensityColor = (count) => {
    if (count === 0) return C.bgCard;
    if (count === 1) return 'rgba(45,212,191,0.25)';
    if (count <= 3) return 'rgba(45,212,191,0.55)';
    if (count <= 6) return 'rgba(45,212,191,0.85)';
    return C.teal;
  };

  const monthLabels = ['JAN', 'FÉV', 'MAR', 'AVR', 'MAI', 'JUIN', 'JUIL', 'AOÛ', 'SEP', 'OCT', 'NOV', 'DÉC'];
  const dayLabels = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];

  return (
    <div className="slide-up">
      <button onClick={onBack} style={{
        background: 'transparent', border: 'none', color: C.teal, fontSize: 13, padding: 0, marginBottom: 16,
      }}>← retour</button>

      <p style={{ fontSize: 11, color: C.textDim, letterSpacing: 2, margin: '0 0 6px' }}>CALENDRIER</p>
      <p style={{ fontSize: 22, fontWeight: 500, margin: '0 0 24px', color: C.text }}>
        <span className="hanzi" style={{ color: C.teal }}>日历</span> · ton historique
      </p>

      {/* Stats globales */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8, marginBottom: 24 }}>
        <div style={{ background: C.bgCard, border: `0.5px solid ${C.border}`, borderLeft: `2px solid ${C.teal}`, padding: 12 }}>
          <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 1, margin: '0 0 4px' }}>SÉRIE</p>
          <p style={{ fontSize: 22, color: C.teal, margin: 0, fontWeight: 500 }}>{stats.currentStreak}</p>
          <p style={{ fontSize: 10, color: C.textFaint, margin: '4px 0 0' }}>jours{stats.currentStreak > 1 ? ' 🔥' : ''}</p>
        </div>
        <div style={{ background: C.bgCard, border: `0.5px solid ${C.border}`, borderLeft: `2px solid ${C.purple}`, padding: 12 }}>
          <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 1, margin: '0 0 4px' }}>JOURS</p>
          <p style={{ fontSize: 22, color: C.purple, margin: 0, fontWeight: 500 }}>{stats.activeDays}</p>
          <p style={{ fontSize: 10, color: C.textFaint, margin: '4px 0 0' }}>actifs</p>
        </div>
        <div style={{ background: C.bgCard, border: `0.5px solid ${C.border}`, borderLeft: `2px solid ${C.amber}`, padding: 12 }}>
          <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 1, margin: '0 0 4px' }}>SESSIONS</p>
          <p style={{ fontSize: 22, color: C.amber, margin: 0, fontWeight: 500 }}>{stats.totalSessions}</p>
          <p style={{ fontSize: 10, color: C.textFaint, margin: '4px 0 0' }}>total</p>
        </div>
      </div>

      {/* Heatmap */}
      <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 2, margin: '0 0 12px' }}>4 DERNIERS MOIS</p>
      <div style={{
        background: C.bgCard, border: `0.5px solid ${C.border}`,
        borderRadius: 8, padding: 14, marginBottom: 16, overflowX: 'auto',
      }}>
        {/* Mois */}
        <div style={{ display: 'flex', gap: 3, marginLeft: 18, marginBottom: 6 }}>
          {matrix.map((week, wi) => {
            const firstDay = week[0].date;
            const showLabel = firstDay.getDate() <= 7;
            return (
              <div key={wi} style={{ width: 14, fontSize: 8, color: C.textDim, textAlign: 'center', letterSpacing: 0.5 }}>
                {showLabel ? monthLabels[firstDay.getMonth()] : ''}
              </div>
            );
          })}
        </div>
        {/* Grille jours */}
        <div style={{ display: 'flex', gap: 6 }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 3, paddingTop: 1 }}>
            {dayLabels.map((d, i) => (
              <span key={i} style={{ fontSize: 8, color: C.textFaint, height: 14, lineHeight: '14px' }}>
                {i % 2 === 0 ? d : ''}
              </span>
            ))}
          </div>
          <div style={{ display: 'flex', gap: 3 }}>
            {matrix.map((week, wi) => (
              <div key={wi} style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
                {week.map((day, di) => (
                  <div
                    key={di}
                    title={`${day.dateStr} : ${day.count} session${day.count > 1 ? 's' : ''}`}
                    style={{
                      width: 14, height: 14, borderRadius: 2,
                      background: day.isFuture ? 'transparent' : intensityColor(day.count),
                      border: day.isFuture ? `1px dashed ${C.border}` : `0.5px solid ${C.border}`,
                    }}
                  />
                ))}
              </div>
            ))}
          </div>
        </div>

        {/* Légende */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 14, justifyContent: 'flex-end' }}>
          <span style={{ fontSize: 9, color: C.textDim }}>moins</span>
          {[0, 1, 3, 6, 10].map((c, i) => (
            <div key={i} style={{
              width: 11, height: 11, borderRadius: 2,
              background: intensityColor(c),
              border: `0.5px solid ${C.border}`,
            }} />
          ))}
          <span style={{ fontSize: 9, color: C.textDim }}>plus</span>
        </div>
      </div>

      <p style={{ fontSize: 11, color: C.textFaint, textAlign: 'center', fontStyle: 'italic', lineHeight: 1.5 }}>
        Chaque carré = un jour. L'intensité reflète le nombre de sessions complétées.
      </p>
    </div>
  );
}

function LessonsListScreen({ onBack, onSelectLesson }) {
  const lessons = useMemo(() => getAllLessons().sort((a, b) => a.order - b.order), []);
  const [refreshKey, setRefreshKey] = useState(0);

  // Grouper par chapitre
  const grouped = useMemo(() => {
    const g = {};
    for (const l of lessons) {
      const chap = l.chapter || 'Autres';
      if (!g[chap]) g[chap] = [];
      g[chap].push(l);
    }
    return g;
  }, [lessons]);

  const wordQuality = loadWordQuality();
  const progress = loadLessonProgress();

  return (
    <div className="slide-up">
      <button onClick={onBack} style={{
        background: 'transparent', border: 'none', color: C.teal, fontSize: 13, padding: 0, marginBottom: 16,
      }}>← retour</button>

      <p style={{ fontSize: 11, color: C.textDim, letterSpacing: 2, margin: '0 0 6px' }}>LEÇONS</p>
      <p style={{ fontSize: 22, fontWeight: 500, margin: '0 0 8px', color: C.text }}>
        <span className="hanzi" style={{ color: C.teal }}>课程</span> · {lessons.length} leçons
      </p>
      <p style={{ fontSize: 13, color: C.textDim, margin: '0 0 24px', lineHeight: 1.5 }}>
        Parcours organisé par thème. Chaque leçon = 10-15 mots + phrases.
      </p>

      {/* Stats globales */}
      {(() => {
        const completed = lessons.filter(l => progress[l.id]?.completed_at).length;
        const inProgress = lessons.filter(l => progress[l.id]?.started_at && !progress[l.id]?.completed_at).length;
        return (
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8, marginBottom: 24 }}>
            <div style={{ background: C.bgCard, border: `0.5px solid ${C.border}`, borderLeft: `2px solid ${C.teal}`, padding: 10 }}>
              <p style={{ fontSize: 9, color: C.textDim, letterSpacing: 1, margin: '0 0 4px' }}>FAITES</p>
              <p style={{ fontSize: 18, color: C.teal, margin: 0, fontWeight: 500 }}>{completed}</p>
            </div>
            <div style={{ background: C.bgCard, border: `0.5px solid ${C.border}`, borderLeft: `2px solid ${C.amber}`, padding: 10 }}>
              <p style={{ fontSize: 9, color: C.textDim, letterSpacing: 1, margin: '0 0 4px' }}>EN COURS</p>
              <p style={{ fontSize: 18, color: C.amber, margin: 0, fontWeight: 500 }}>{inProgress}</p>
            </div>
            <div style={{ background: C.bgCard, border: `0.5px solid ${C.border}`, borderLeft: `2px solid ${C.purple}`, padding: 10 }}>
              <p style={{ fontSize: 9, color: C.textDim, letterSpacing: 1, margin: '0 0 4px' }}>RESTANTES</p>
              <p style={{ fontSize: 18, color: C.purple, margin: 0, fontWeight: 500 }}>{lessons.length - completed - inProgress}</p>
            </div>
          </div>
        );
      })()}

      {Object.entries(grouped).map(([chapter, lessonsInChap]) => (
        <div key={chapter} style={{ marginBottom: 20 }}>
          <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 2, margin: '0 0 10px' }}>
            {chapter.toUpperCase()} · {lessonsInChap.length} leçons
          </p>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {lessonsInChap.map(l => {
              const status = getLessonStatus(l.id);
              const available = isLessonAvailable(l.id);
              const avgQuality = getAverageQuality(l.word_ids, wordQuality);

              let borderColor = C.border;
              let bg = C.bgCard;
              let icon = '○';
              let iconColor = C.textFaint;
              let opacity = 1;

              if (status === 'completed') {
                borderColor = C.teal;
                icon = '✓';
                iconColor = C.teal;
              } else if (status === 'in_progress') {
                borderColor = C.amber;
                icon = '◐';
                iconColor = C.amber;
              } else if (!available) {
                opacity = 0.4;
                icon = '◌';
              }

              return (
                <button
                  key={l.id}
                  onClick={() => available && onSelectLesson(l.id)}
                  disabled={!available}
                  style={{
                    background: bg, border: `0.5px solid ${C.border}`,
                    borderLeft: `2px solid ${borderColor}`,
                    color: C.text, padding: 12, borderRadius: 0, textAlign: 'left',
                    display: 'flex', alignItems: 'center', gap: 12, opacity, width: '100%',
                  }}>
                  <span style={{ fontSize: 18, color: iconColor, minWidth: 22, textAlign: 'center' }}>
                    {icon}
                  </span>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <p style={{ fontSize: 13, margin: '0 0 2px', fontWeight: 500 }}>
                      {l.theme}
                    </p>
                    <p style={{ fontSize: 10, color: C.textDim, margin: 0 }}>
                      {l.word_ids.length} mots · {l.phrase_ids?.length || 0} phrases

                  </div>
                  {available && <span style={{ color: borderColor, fontSize: 16 }}>›</span>}
                </button>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );

function LessonDetailScreen({ lessonId, onBack, onStart }) {
  const lesson = getLessonById(lessonId);
  if (!lesson) {
    return (
      <div className="slide-up">
        <button onClick={onBack} style={{
          background: 'transparent', border: 'none', color: C.teal, fontSize: 13, padding: 0, marginBottom: 16,
        }}>← retour</button>
        <p style={{ color: C.textDim }}>Leçon introuvable.</p>
      </div>
    );
  }

  const words = lesson.word_ids.map(id => getWordById(id)).filter(Boolean);
  const phrases = (lesson.phrase_ids || []).map(id => getPhraseById(id)).filter(Boolean);
  const progress = loadLessonProgress()[lesson.id];
  const wordQuality = loadWordQuality();
  const avgQuality = getAverageQuality(lesson.word_ids, wordQuality);

  const phaseLabels = {
    1: 'Apprentissage des mots',
    2: 'Mots + phrases simples',
    3: 'Phrases complètes',
    4: 'Renforcement',
    5: 'Texte de synthèse',
  };

  const currentPhase = progress?.current_phase || 1;
  const isCompleted = progress?.completed_at;

  return (
    <div className="slide-up">
      <button onClick={onBack} style={{
        background: 'transparent', border: 'none', color: C.teal, fontSize: 13, padding: 0, marginBottom: 16,
      }}>← retour</button>

      <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 2, margin: '0 0 6px' }}>
        {lesson.chapter.toUpperCase()} · #{lesson.order}
      </p>
      <p style={{ fontSize: 24, fontWeight: 500, margin: '0 0 8px', color: C.text }}>
        {lesson.theme}
      </p>
      <p style={{ fontSize: 13, color: C.textDim, margin: '0 0 24px', lineHeight: 1.5 }}>
        {lesson.description}
      </p>

      {/* Statut + score qualité */}
      <div style={{
        background: 'linear-gradient(135deg, rgba(45,212,191,0.06), rgba(168,85,247,0.04))',
        border: `0.5px solid ${C.borderAccent}`,
        borderRadius: 12, padding: 16, marginBottom: 20,
      }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 12 }}>
          <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 2, margin: 0 }}>QUALITÉ MOYENNE</p>
          <span style={{ fontSize: 20, color: C.teal, fontWeight: 500 }}>{avgQuality}%</span>
        </div>
        <div style={{ height: 4, background: C.border, borderRadius: 2, overflow: 'hidden' }}>
          <div style={{
            width: `${avgQuality}%`, height: '100%',
            background: `linear-gradient(90deg, ${C.teal}, ${C.purple})`,
            transition: 'width 0.3s',
          }} />
        </div>
        {progress && (
          <p style={{ fontSize: 11, color: C.textDim, margin: '10px 0 0' }}>
            Phase actuelle : {currentPhase}/5 — {phaseLabels[currentPhase]}
          </p>
        )}
      </div>

      {/* Stepper des 5 phases */}
      <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 2, margin: '0 0 10px' }}>
        PARCOURS DE LA LEÇON
      </p>
      <div style={{
        background: C.bgCard, border: `0.5px solid ${C.border}`,
        borderRadius: 8, padding: 14, marginBottom: 20,
      }}>
        {[1, 2, 3, 4, 5].map(phaseNum => {
          const isCompleted = progress?.phase_progress?.[phaseNum];
          const isCurrent = currentPhase === phaseNum && !isCompleted;
          const isLocked = !isCompleted && !isCurrent && phaseNum > currentPhase;

          let icon = '○';
          let iconColor = C.textFaint;
          let textColor = C.textDim;
          let badge = null;

          if (isCompleted) {
            icon = '✓'; iconColor = C.teal; textColor = C.text;
          } else if (isCurrent) {
            icon = '◐'; iconColor = C.amber; textColor = C.text;
            badge = (
              <span style={{
                fontSize: 9, padding: '2px 8px', background: C.amber, color: C.bg,
                borderRadius: 10, letterSpacing: 1, fontWeight: 600,
              }}>EN COURS</span>
            );
          } else if (isLocked) {
            icon = '◌'; iconColor = C.textFaint; textColor = C.textFaint;
          }

          return (
            <div key={phaseNum} style={{
              display: 'flex', alignItems: 'center', gap: 12,
              padding: '8px 0',
              borderBottom: phaseNum < 5 ? `0.5px solid ${C.border}` : 'none',
              opacity: isLocked ? 0.5 : 1,
            }}>
              <span style={{
                fontSize: 18, color: iconColor, minWidth: 22, textAlign: 'center',
              }}>{icon}</span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <p style={{ fontSize: 12, margin: '0 0 2px', fontWeight: 500, color: textColor }}>
                  Phase {phaseNum} · {phaseLabels[phaseNum]}
                </p>
                <p style={{ fontSize: 10, color: C.textDim, margin: 0 }}>
                  {phaseNum === 1 && '4 modalités par mot : QCM ↔ traduction + écriture + audio'}
                  {phaseNum === 2 && 'Mots dans des phrases courtes'}
                  {phaseNum === 3 && 'Phrases complètes : QCM, tap-word, écriture'}
                  {phaseNum === 4 && 'Renforcement adaptatif sur les mots faibles'}
                  {phaseNum === 5 && 'Texte de synthèse via IA'}
                </p>
              </div>
              {badge}
            </div>
          );
        })}
      </div>

      {/* Liste des mots cibles */}
      <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 2, margin: '0 0 10px' }}>
        MOTS CIBLES ({words.length})
      </p>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 20 }}>
        {words.map(w => {
          const score = getWordQualityScore(w.id, wordQuality);
          let color = C.textFaint;
          if (score >= 80) color = C.teal;
          else if (score >= 50) color = C.amber;
          else if (score > 0) color = C.purple;
          return (
            <div key={w.id} style={{
              background: C.bgCard, border: `0.5px solid ${C.border}`,
              borderLeft: `2px solid ${color}`,
              padding: '8px 10px', display: 'flex', alignItems: 'center', gap: 6,
            }}>
              <span className="hanzi" style={{ fontSize: 16, color: C.text }}>{w.hanzi}</span>
              <span style={{ fontSize: 9, color: C.textDim }}>{w.pinyin}</span>
            </div>
          );
        })}
      </div>

      {/* Phrases si dispo */}
      {phrases.length > 0 && (
        <>
          <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 2, margin: '0 0 10px' }}>
            PHRASES ASSOCIÉES ({phrases.length})
          </p>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 24 }}>
            {phrases.slice(0, 5).map(p => (
              <div key={p.id} style={{
                background: C.bgCard, border: `0.5px solid ${C.border}`,
                padding: 10,
              }}>
                <p className="hanzi" style={{ fontSize: 14, color: C.text, margin: '0 0 2px' }}>{p.hanzi}</p>
                <p style={{ fontSize: 10, color: C.textDim, margin: '0 0 2px', letterSpacing: 0.5 }}>{p.pinyin}</p>
                <p style={{ fontSize: 11, color: C.textFaint, margin: 0 }}>{p.fr}</p>
              </div>
            ))}
            {phrases.length > 5 && (
              <p style={{ fontSize: 11, color: C.textFaint, textAlign: 'center', fontStyle: 'italic', margin: 0 }}>
                + {phrases.length - 5} autres
              </p>
            )}
          </div>
        </>
      )}

      {/* Bouton démarrer */}
      <button onClick={() => onStart(lesson.id)} style={{
        width: '100%',
        background: isCompleted ? C.purple : C.teal,
        color: C.bg, border: 'none', padding: 14, borderRadius: 8,
        fontWeight: 600, fontSize: 14, letterSpacing: 0.5,
      }}>
        {isCompleted ? '↻ REVOIR LA LEÇON' : progress ? 'CONTINUER →' : 'COMMENCER →'}
      </button>
    </div>
  );
}


// ============================================================
// LESSON PHASE 1 — Apprentissage des mots cibles
// QCM pinyin→fr, fr→pinyin, remplissage manuel
// On boucle sur les mots jusqu'à ce qu'ils soient marqués "connus" (qualité >= 60% sur ces 3 modalités)
// ============================================================
function LessonPhase1Screen({ lessonId, onBack, onPhaseComplete }) {
  const lesson = getLessonById(lessonId);
  const words = lesson.word_ids.map(id => getWordById(id)).filter(Boolean);

  // État de l'exercice courant
  const [currentExo, setCurrentExo] = useState(null); // { word, modality, options/input }
  const [submitted, setSubmitted] = useState(false);
  const [feedback, setFeedback] = useState(null);
  const [userInput, setUserInput] = useState('');
  const [stats, setStats] = useState({ done: 0, correct: 0 });
  const [refreshKey, setRefreshKey] = useState(0);

  // Calcul de la progression
  const wordQuality = useMemo(() => loadWordQuality(), [refreshKey]);
  const wordsToWork = useMemo(() => {
    // Mots dont la modalité QCM ou fill_manual n'est pas encore validée
    return words.filter(w => {
      const q = wordQuality[w.id] || {};
      return !(q.qcm_zh_fr && q.qcm_fr_zh && q.fill_manual && q.audio);
    });
  }, [words, wordQuality]);

  // Calculer les pools de distracteurs (autres mots de la leçon + mots du même thème)
  const distractorPool = useMemo(() => {
    if (typeof VOCAB === 'undefined') return [];
    return VOCAB.filter(w => w.theme === lesson.theme_code).slice(0, 50);
  }, [lesson.theme_code]);

  // Choisir le prochain exercice
  const pickNext = () => {
    setSubmitted(false);
    setFeedback(null);
    setUserInput('');

    if (wordsToWork.length === 0) {
      // Phase 1 terminée
      setCurrentExo(null);
      return;
    }

    // Choisir un mot à travailler (priorité au moins maîtrisé)
    const sortedWords = [...wordsToWork].sort((a, b) => {
      const qa = wordQuality[a.id] || {};
      const qb = wordQuality[b.id] || {};
      const scoreA = (qa.qcm_zh_fr ? 1 : 0) + (qa.qcm_fr_zh ? 1 : 0) + (qa.fill_manual ? 1 : 0) + (qa.audio ? 1 : 0);
      const scoreB = (qb.qcm_zh_fr ? 1 : 0) + (qb.qcm_fr_zh ? 1 : 0) + (qb.fill_manual ? 1 : 0) + (qb.audio ? 1 : 0);
      return scoreA - scoreB; // moins maîtrisé d'abord
    });
    const word = sortedWords[Math.floor(Math.random() * Math.min(3, sortedWords.length))];

    // Choisir la modalité non encore validée pour ce mot
    const q = wordQuality[word.id] || {};
    const modalities = [];
    if (!q.qcm_zh_fr) modalities.push('qcm_zh_fr');
    if (!q.qcm_fr_zh) modalities.push('qcm_fr_zh');
    if (!q.fill_manual) modalities.push('fill_manual');
    if (!q.audio && isTTSAvailable()) modalities.push('audio');

    const modality = modalities[Math.floor(Math.random() * modalities.length)];

    // Construire l'exercice
    if (modality === 'qcm_zh_fr' || modality === 'qcm_fr_zh') {
      // Distracteurs : 3 autres mots du même thème, ou de la leçon, ou globaux
      let candidates = distractorPool.filter(w => w.id !== word.id);
      if (candidates.length < 3) {
        candidates = (typeof VOCAB !== 'undefined' ? VOCAB : []).filter(w => w.id !== word.id);
      }
      // Mélanger
      const distractors = [...candidates].sort(() => Math.random() - 0.5).slice(0, 3);
      const all = [...distractors, word].sort(() => Math.random() - 0.5);
      setCurrentExo({ word, modality, options: all });
    } else if (modality === 'audio') {
      // Audio : on entend, on tape pinyin OU sens (alterne au hasard)
      const audioMode = Math.random() < 0.5 ? 'pinyin' : 'fr';
      setCurrentExo({ word, modality, audioMode });
      // Lancer l'audio automatiquement après un court délai
      setTimeout(() => speak(word.hanzi), 400);
    } else {
      // Remplissage manuel : user tape le pinyin du mot
      setCurrentExo({ word, modality });
    }
  };

  useEffect(() => {
    if (!currentExo && wordsToWork.length > 0) pickNext();
    if (wordsToWork.length === 0) setCurrentExo(null);
  }, [wordsToWork.length, refreshKey]);

  if (!lesson) return <p style={{ color: C.textDim }}>Leçon introuvable.</p>;

  // Si tous les mots sont validés
  if (wordsToWork.length === 0) {
    return (
      <div className="slide-up">
        <button onClick={onBack} style={{
          background: 'transparent', border: 'none', color: C.teal, fontSize: 13, padding: 0, marginBottom: 16,
        }}>← retour</button>

        <div style={{ textAlign: 'center', padding: '3rem 1rem' }}>
          <p style={{ fontSize: 56, margin: '0 0 16px', color: C.teal }}>✓</p>
          <p style={{ fontSize: 22, fontWeight: 500, margin: '0 0 8px', color: C.text }}>
            Phase 1 terminée
          </p>
          <p style={{ fontSize: 13, color: C.textDim, margin: '0 0 24px', lineHeight: 1.6 }}>
            Tu as validé toutes les modalités sur les {words.length} mots de cette leçon.
            Phase 2 : mots + phrases simples (à venir au prochain sprint).
          </p>
          <button onClick={onPhaseComplete} style={{
            background: C.teal, color: C.bg, border: 'none',
            padding: '12px 28px', borderRadius: 8, fontWeight: 600, fontSize: 14, letterSpacing: 0.5,
          }}>RETOUR À LA LEÇON</button>
        </div>
      </div>
    );
  }

  if (!currentExo) return null;

  const { word, modality, options } = currentExo;

  // Handler QCM
  const handleQCMSelect = (opt) => {
    if (submitted) return;
    setSubmitted(true);
    const correct = opt.id === word.id;
    setFeedback(correct ? 'correct' : 'wrong');
    setStats(s => ({ done: s.done + 1, correct: s.correct + (correct ? 1 : 0) }));
    updateWordQuality(word.id, modality, correct);
    if (!correct) {
      logError({
        item_id: word.id, hanzi: word.hanzi, pinyin: word.pinyin, fr: word.fr,
        facet: modality, mode: 'lesson_phase1',
        error_type: detectErrorType(word, opt, 'qcm'),
        user_answer: modality === 'qcm_zh_fr' ? opt.fr : opt.pinyin,
        correct_answer: modality === 'qcm_zh_fr' ? word.fr : word.pinyin,
        confused_with: opt.hanzi,
      });
    }
    markActivity(1);
  };

  // Handler remplissage manuel
  const normalizeInput = (s) => s.toLowerCase().trim()
    .replace(/[āáǎà]/g, 'a').replace(/[ēéěè]/g, 'e').replace(/[īíǐì]/g, 'i')
    .replace(/[ōóǒò]/g, 'o').replace(/[ūúǔù]/g, 'u').replace(/[ǖǘǚǜü]/g, 'u')
    .replace(/\s+/g, '');

  const handleFillSubmit = () => {
    if (submitted) return;
    setSubmitted(true);
    const correct = normalizeInput(userInput) === normalizeInput(word.pinyin);
    setFeedback(correct ? 'correct' : 'wrong');
    setStats(s => ({ done: s.done + 1, correct: s.correct + (correct ? 1 : 0) }));
    updateWordQuality(word.id, modality, correct);
    if (!correct) {
      logError({
        item_id: word.id, hanzi: word.hanzi, pinyin: word.pinyin, fr: word.fr,
        facet: 'fill_manual', mode: 'lesson_phase1',
        error_type: 'unknown',
        user_answer: userInput, correct_answer: word.pinyin,
      });
    }
    markActivity(1);
  };

  // Handler audio : on entend, on tape pinyin OU sens FR
  const handleAudioSubmit = () => {
    if (submitted) return;
    setSubmitted(true);
    const audioMode = currentExo.audioMode; // 'pinyin' | 'fr'
    let correct = false;
    if (audioMode === 'pinyin') {
      correct = normalizeInput(userInput) === normalizeInput(word.pinyin);
    } else {
      // Pour le sens : on accepte si la réponse contient le sens principal (insensible à la casse)
      const userClean = userInput.toLowerCase().trim();
      const expected = word.fr.toLowerCase();
      // On split sur virgules et on accepte si une des variantes match
      const variants = expected.split(/[,;]/).map(s => s.trim());
      correct = variants.some(v => v === userClean) ||
                userClean.length >= 3 && variants.some(v => v.includes(userClean) || userClean.includes(v));
    }
    setFeedback(correct ? 'correct' : 'wrong');
    setStats(s => ({ done: s.done + 1, correct: s.correct + (correct ? 1 : 0) }));
    updateWordQuality(word.id, 'audio', correct);
    if (!correct) {
      logError({
        item_id: word.id, hanzi: word.hanzi, pinyin: word.pinyin, fr: word.fr,
        facet: 'audio', mode: 'lesson_phase1',
        error_type: 'unknown',
        user_answer: userInput,
        correct_answer: audioMode === 'pinyin' ? word.pinyin : word.fr,
      });
    }
    markActivity(1);
  };

  const handleNext = () => {
    setRefreshKey(k => k + 1);
    pickNext();
  };

  const totalToValidate = words.length * (isTTSAvailable() ? 4 : 3);
  const validated = words.reduce((sum, w) => {
    const q = wordQuality[w.id] || {};
    return sum + (q.qcm_zh_fr ? 1 : 0) + (q.qcm_fr_zh ? 1 : 0) + (q.fill_manual ? 1 : 0) + (isTTSAvailable() && q.audio ? 1 : 0);
  }, 0);

  return (
    <div className="slide-up">
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
        <button onClick={onBack} style={{
          background: 'transparent', border: 'none', color: C.teal, fontSize: 13, padding: 0,
        }}>← retour</button>
        <span style={{ fontSize: 11, color: C.textDim, letterSpacing: 1 }}>
          {validated} / {totalToValidate} validations
        </span>
      </div>

      <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 2, margin: '0 0 4px' }}>
        PHASE 1 · APPRENTISSAGE
      </p>
      <p style={{ fontSize: 16, margin: '0 0 16px', color: C.text }}>{lesson.theme}</p>

      {/* Barre de progression de la phase */}
      <div style={{ height: 3, background: C.border, borderRadius: 2, overflow: 'hidden', marginBottom: 20 }}>
        <div style={{
          width: `${(validated / totalToValidate) * 100}%`, height: '100%',
          background: `linear-gradient(90deg, ${C.teal}, ${C.purple})`, transition: 'width 0.3s',
        }} />
      </div>

      {/* QCM hanzi → fr */}
      {modality === 'qcm_zh_fr' && (
        <>
          <div style={{
            background: 'linear-gradient(135deg, rgba(45,212,191,0.08), rgba(168,85,247,0.06))',
            border: `0.5px solid ${C.borderAccent}`,
            borderRadius: 12, padding: '32px 16px', marginBottom: 16, textAlign: 'center',
          }}>
            <p className="hanzi" style={{ fontSize: 56, margin: 0, color: C.text, fontWeight: 300 }}>
              {word.hanzi}
            </p>
            <p style={{ fontSize: 13, color: C.textDim, margin: '12px 0 0', letterSpacing: 1 }}>
              {word.pinyin}
            </p>
            {isTTSAvailable() && (
              <button onClick={() => speak(word.hanzi)} style={{
                marginTop: 12, background: 'transparent', border: `0.5px solid ${C.teal}`, color: C.teal,
                padding: '5px 12px', borderRadius: 8, fontSize: 11, letterSpacing: 1,
              }}>♪ ÉCOUTER</button>
            )}
          </div>
          <p style={{ textAlign: 'center', fontSize: 12, color: C.textDim, margin: '0 0 14px' }}>
            Quel est le sens ?
          </p>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 16 }}>
            {options.map(opt => {
              let borderColor = C.border, bg = C.bgCard;
              if (submitted) {
                if (opt.id === word.id) { borderColor = C.teal; bg = 'rgba(45,212,191,0.08)'; }
                else if (feedback === 'wrong') { /* ne pas highlight les wrong sauf celui qu'on a choisi */ }
              }
              return (
                <button key={opt.id} onClick={() => handleQCMSelect(opt)} disabled={submitted} style={{
                  background: bg, border: `0.5px solid ${borderColor}`, color: C.text,
                  padding: 13, borderRadius: 8, textAlign: 'left', fontSize: 14,
                }}>{opt.fr}</button>
              );
            })}
          </div>
        </>
      )}

      {/* QCM fr → hanzi */}
      {modality === 'qcm_fr_zh' && (
        <>
          <div style={{
            background: 'linear-gradient(135deg, rgba(244,114,182,0.06), rgba(168,85,247,0.04))',
            border: `0.5px solid ${C.borderAccent}`,
            borderRadius: 12, padding: '24px 16px', marginBottom: 16, textAlign: 'center',
          }}>
            <p style={{ fontSize: 22, margin: 0, color: C.text, fontWeight: 400 }}>
              {word.fr}
            </p>
          </div>
          <p style={{ textAlign: 'center', fontSize: 12, color: C.textDim, margin: '0 0 14px' }}>
            Quel hanzi correspond ?
          </p>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 16 }}>
            {options.map(opt => {
              let borderColor = C.border, bg = C.bgCard;
              if (submitted) {
                if (opt.id === word.id) { borderColor = C.teal; bg = 'rgba(45,212,191,0.08)'; }
              }
              return (
                <button key={opt.id} onClick={() => handleQCMSelect(opt)} disabled={submitted} style={{
                  background: bg, border: `0.5px solid ${borderColor}`, color: C.text,
                  padding: 13, borderRadius: 8, textAlign: 'left', fontSize: 16,
                  display: 'flex', alignItems: 'center', gap: 10,
                }}>
                  <span className="hanzi" style={{ fontSize: 20 }}>{opt.hanzi}</span>
                  <span style={{ fontSize: 10, color: C.textDim }}>{opt.pinyin}</span>
                </button>
              );
            })}
          </div>
        </>
      )}

      {/* Remplissage manuel */}
      {modality === 'fill_manual' && (
        <>
          <div style={{
            background: 'linear-gradient(135deg, rgba(251,191,36,0.06), rgba(244,114,182,0.04))',
            border: `0.5px solid ${C.borderAccent}`,
            borderRadius: 12, padding: '32px 16px', marginBottom: 16, textAlign: 'center',
          }}>
            <p className="hanzi" style={{ fontSize: 48, margin: '0 0 8px', color: C.text, fontWeight: 300 }}>
              {word.hanzi}
            </p>
            <p style={{ fontSize: 13, color: C.textDim, margin: 0 }}>
              ({word.fr})
            </p>
          </div>
          <p style={{ textAlign: 'center', fontSize: 12, color: C.textDim, margin: '0 0 14px' }}>
            Tape le pinyin (les tons sont optionnels)
          </p>
          <input
            type="text" value={userInput} onChange={e => setUserInput(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && handleFillSubmit()}
            disabled={submitted}
            placeholder="ex: ni hao"
            autoFocus
            style={{
              width: '100%', boxSizing: 'border-box',
              background: C.bgCard,
              border: `0.5px solid ${submitted ? (feedback === 'correct' ? C.teal : C.red) : C.border}`,
              color: C.text, padding: 14, borderRadius: 8, fontSize: 16,
              fontFamily: 'monospace', letterSpacing: 1,
              marginBottom: 12,
            }}
          />
          {!submitted && (
            <button onClick={handleFillSubmit} disabled={!userInput.trim()} style={{
              width: '100%', background: userInput.trim() ? C.amber : C.border,
              color: userInput.trim() ? C.bg : C.textDim, border: 'none',
              padding: 13, borderRadius: 8, fontWeight: 600, fontSize: 14, letterSpacing: 0.5,
              marginBottom: 12,
            }}>VÉRIFIER</button>
          )}
        </>
      )}

      {/* AUDIO : on entend, on tape pinyin ou français */}
      {modality === 'audio' && currentExo.audioMode && (
        <>
          <div style={{
            background: 'linear-gradient(135deg, rgba(168,85,247,0.08), rgba(45,212,191,0.05))',
            border: `0.5px solid ${C.borderAccent}`,
            borderRadius: 12, padding: '32px 16px', marginBottom: 16, textAlign: 'center',
          }}>
            <p style={{ fontSize: 10, color: C.purple, letterSpacing: 2, margin: '0 0 12px' }}>
              ÉCOUTE
            </p>
            <button onClick={() => speak(word.hanzi)} style={{
              background: C.purple, color: C.bg, border: 'none',
              width: 80, height: 80, borderRadius: '50%',
              fontSize: 32, marginBottom: 8,
              display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
              boxShadow: '0 0 24px rgba(168,85,247,0.35)',
            }}>♪</button>
            <p style={{ fontSize: 11, color: C.textDim, margin: '8px 0 0' }}>
              Tap pour réécouter
            </p>
            {submitted && (
              <p className="hanzi" style={{ fontSize: 22, color: C.text, margin: '12px 0 0' }}>
                {word.hanzi}
              </p>
            )}
          </div>
          <p style={{ textAlign: 'center', fontSize: 12, color: C.textDim, margin: '0 0 14px' }}>
            {currentExo.audioMode === 'pinyin'
              ? 'Tape le pinyin (les tons sont optionnels)'
              : 'Tape la traduction française'}
          </p>
          <input
            type="text" value={userInput} onChange={e => setUserInput(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && handleAudioSubmit()}
            disabled={submitted}
            placeholder={currentExo.audioMode === 'pinyin' ? 'ex: ni hao' : 'ex: bonjour'}
            autoFocus
            style={{
              width: '100%', boxSizing: 'border-box',
              background: C.bgCard,
              border: `0.5px solid ${submitted ? (feedback === 'correct' ? C.teal : C.red) : C.border}`,
              color: C.text, padding: 14, borderRadius: 8, fontSize: 16,
              fontFamily: currentExo.audioMode === 'pinyin' ? 'monospace' : 'inherit',
              letterSpacing: currentExo.audioMode === 'pinyin' ? 1 : 'normal',
              marginBottom: 12,
            }}
          />
          {!submitted && (
            <button onClick={handleAudioSubmit} disabled={!userInput.trim()} style={{
              width: '100%', background: userInput.trim() ? C.purple : C.border,
              color: userInput.trim() ? C.bg : C.textDim, border: 'none',
              padding: 13, borderRadius: 8, fontWeight: 600, fontSize: 14, letterSpacing: 0.5,
              marginBottom: 12,
            }}>VÉRIFIER</button>
          )}
        </>
      )}

      {/* Feedback global */}
      {submitted && (
        <>
          <div style={{
            padding: 12, borderRadius: 8, marginBottom: 12,
            background: feedback === 'correct' ? 'rgba(45,212,191,0.08)' : 'rgba(239,68,68,0.08)',
            border: `0.5px solid ${feedback === 'correct' ? C.teal : C.red}`,
          }}>
            <p style={{ margin: '0 0 4px', fontSize: 13, color: feedback === 'correct' ? C.teal : C.red, fontWeight: 500 }}>
              {feedback === 'correct' ? '✓ Correct' : '✗ Incorrect'}
            </p>
            <p style={{ margin: 0, fontSize: 12, color: C.textDim }}>
              <span className="hanzi" style={{ fontSize: 14, color: C.text }}>{word.hanzi}</span>
              <span style={{ marginLeft: 8 }}>{word.pinyin}</span>
              <span style={{ marginLeft: 8, color: C.textFaint }}>· {word.fr}</span>
            </p>
          </div>
          <button onClick={handleNext} style={{
            width: '100%', background: C.teal, color: C.bg, border: 'none',
            padding: 13, borderRadius: 8, fontWeight: 600, fontSize: 14, letterSpacing: 0.5,
          }}>SUIVANT →</button>
        </>
      )}
    </div>
  );
}

// ============================================================
// LESSON PHASE 2 — Mots + petites phrases
// On boucle sur les mots cibles + phrases courtes qui les contiennent
// Objectif : valider la modalité 'in_phrase' pour chaque mot cible
// ============================================================
function LessonPhase2Screen({ lessonId, onBack, onPhaseComplete }) {
  const lesson = getLessonById(lessonId);
  const words = useMemo(() => (lesson?.word_ids || []).map(id => getWordById(id)).filter(Boolean), [lessonId]);
  const allLessonPhrases = useMemo(
    () => (lesson?.phrase_ids || []).map(id => getPhraseById(id)).filter(Boolean),
    [lessonId]
  );

  // Phrases courtes à utiliser pour cette phase (≤10 caractères + au moins 2 mots de la leçon)
  const shortPhrases = useMemo(() => {
    const wordSet = new Set(words.map(w => w.id));
    return allLessonPhrases.filter(p =>
      p.hanzi.length <= 10 && p.words && p.words.filter(wid => wordSet.has(wid)).length >= 1
    );
  }, [allLessonPhrases, words]);

  const [currentExo, setCurrentExo] = useState(null);
  const [submitted, setSubmitted] = useState(false);
  const [feedback, setFeedback] = useState(null);
  const [stats, setStats] = useState({ done: 0, correct: 0 });
  const [refreshKey, setRefreshKey] = useState(0);

  const wordQuality = useMemo(() => loadWordQuality(), [refreshKey]);

  // Mots qui n'ont PAS encore validé in_phrase → à travailler
  const wordsToWork = useMemo(() => {
    return words.filter(w => !(wordQuality[w.id]?.in_phrase));
  }, [words, wordQuality]);

  const phaseDone = wordsToWork.length === 0;

  const pickNext = () => {
    setSubmitted(false);
    setFeedback(null);
    if (phaseDone) {
      setCurrentExo(null);
      return;
    }

    // Stratégie : alterner entre exo "phrase contenant un mot cible" (60%) et "QCM mot rapide" (40%)
    // Mais si pas de phrases dispo, on fait que des QCM
    const useSentence = shortPhrases.length > 0 && Math.random() < 0.7;

    if (useSentence) {
      // Choisir une phrase qui contient au moins un mot non-validé
      const wordsToWorkIds = new Set(wordsToWork.map(w => w.id));
      const candidatesPhrases = shortPhrases.filter(p =>
        p.words.some(wid => wordsToWorkIds.has(wid))
      );
      const phrase = candidatesPhrases.length > 0
        ? candidatesPhrases[Math.floor(Math.random() * candidatesPhrases.length)]
        : shortPhrases[Math.floor(Math.random() * shortPhrases.length)];

      // Choisir le mot cible dans cette phrase
      const targetWordId = phrase.words.find(wid => wordsToWorkIds.has(wid)) || phrase.words[0];
      const targetWord = getWordById(targetWordId);
      if (!targetWord) {
        // fallback QCM mot
        const w = wordsToWork[Math.floor(Math.random() * wordsToWork.length)];
        return setCurrentExo({ type: 'word_quick_qcm', word: w });
      }

      // Type d'exo phrase : "Quel mot dans cette phrase signifie X ?" (français → trouve hanzi dans phrase)
      // ou "Cette phrase signifie quoi ?" (QCM traduction)
      const subType = Math.random() < 0.5 ? 'phrase_word_qcm' : 'phrase_translate_qcm';

      if (subType === 'phrase_word_qcm') {
        // Distracteurs : autres mots de la leçon non présents dans la phrase
        const wordsInPhrase = new Set(phrase.words);
        const distractors = words.filter(w => !wordsInPhrase.has(w.id) && w.id !== targetWord.id);
        const shuffledD = [...distractors].sort(() => Math.random() - 0.5).slice(0, 3);
        const opts = [targetWord, ...shuffledD].sort(() => Math.random() - 0.5);
        setCurrentExo({ type: 'phrase_word_qcm', phrase, targetWord, options: opts });
      } else {
        // Distracteurs : phrases d'autres leçons + autres phrases de la leçon courante
        const otherPhrases = allLessonPhrases.filter(p => p.id !== phrase.id);
        const shuffledP = [...otherPhrases].sort(() => Math.random() - 0.5).slice(0, 3);
        const opts = [phrase, ...shuffledP].sort(() => Math.random() - 0.5);
        setCurrentExo({ type: 'phrase_translate_qcm', phrase, targetWord, options: opts });
      }
    } else {
      // QCM rapide mot pour rafraîchir
      const word = wordsToWork[Math.floor(Math.random() * wordsToWork.length)];
      setCurrentExo({ type: 'word_quick_qcm', word });
    }
  };

  useEffect(() => {
    if (!phaseDone && !currentExo) pickNext();
  }, [phaseDone, refreshKey]);

  if (!lesson) return <p style={{ color: C.textDim }}>Leçon introuvable.</p>;

  // Phase complétée
  if (phaseDone) {
    return (
      <div className="slide-up">
        <button onClick={onBack} style={{
          background: 'transparent', border: 'none', color: C.teal, fontSize: 13, padding: 0, marginBottom: 16,
        }}>← retour</button>
        <div style={{ textAlign: 'center', padding: '3rem 1rem' }}>
          <p style={{ fontSize: 56, margin: '0 0 16px', color: C.teal }}>✓</p>
          <p style={{ fontSize: 22, fontWeight: 500, margin: '0 0 8px', color: C.text }}>
            Phase 2 terminée
          </p>
          <p style={{ fontSize: 13, color: C.textDim, margin: '0 0 24px', lineHeight: 1.6 }}>
            Tu reconnais maintenant ces mots dans des phrases. Phase 3 : phrases complètes.
          </p>
          <button onClick={onPhaseComplete} style={{
            background: C.teal, color: C.bg, border: 'none',
            padding: '12px 28px', borderRadius: 8, fontWeight: 600, fontSize: 14, letterSpacing: 0.5,
          }}>CONTINUER →</button>
        </div>
      </div>
    );
  }

  if (!currentExo) return null;

  // Handler unifié
  const handleSelect = (correct, targetWordId) => {
    if (submitted) return;
    setSubmitted(true);
    setFeedback(correct ? 'correct' : 'wrong');
    setStats(s => ({ done: s.done + 1, correct: s.correct + (correct ? 1 : 0) }));
    if (correct && targetWordId) {
      updateWordQuality(targetWordId, 'in_phrase', true);
    } else if (!correct && targetWordId) {
      updateWordQuality(targetWordId, 'in_phrase', false);
      const w = getWordById(targetWordId);
      if (w) {
        logError({
          item_id: w.id, hanzi: w.hanzi, pinyin: w.pinyin, fr: w.fr,
          facet: 'in_phrase', mode: 'lesson_phase2',
          error_type: 'unknown', user_answer: '?', correct_answer: w.fr,
        });
      }
    }
    markActivity(1);
  };

  const handleNext = () => {
    setRefreshKey(k => k + 1);
    pickNext();
  };

  const totalToValidate = words.length;
  const validated = words.filter(w => wordQuality[w.id]?.in_phrase).length;

  return (
    <div className="slide-up">
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
        <button onClick={onBack} style={{
          background: 'transparent', border: 'none', color: C.teal, fontSize: 13, padding: 0,
        }}>← retour</button>
        <span style={{ fontSize: 11, color: C.textDim, letterSpacing: 1 }}>
          {validated} / {totalToValidate} mots dans phrases
        </span>
      </div>

      <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 2, margin: '0 0 4px' }}>
        PHASE 2 · MOTS DANS PHRASES
      </p>
      <p style={{ fontSize: 16, margin: '0 0 16px', color: C.text }}>{lesson.theme}</p>

      <div style={{ height: 3, background: C.border, borderRadius: 2, overflow: 'hidden', marginBottom: 20 }}>
        <div style={{
          width: `${(validated / totalToValidate) * 100}%`, height: '100%',
          background: `linear-gradient(90deg, ${C.teal}, ${C.purple})`, transition: 'width 0.3s',
        }} />
      </div>

      {/* QCM rapide sur un mot (pour rafraîchir) */}
      {currentExo.type === 'word_quick_qcm' && (() => {
        const w = currentExo.word;
        const distractors = words.filter(x => x.id !== w.id);
        const opts = [...distractors.sort(() => Math.random() - 0.5).slice(0, 3), w].sort(() => Math.random() - 0.5);
        return (
          <>
            <div style={{
              background: 'linear-gradient(135deg, rgba(45,212,191,0.06), rgba(168,85,247,0.04))',
              border: `0.5px solid ${C.borderAccent}`,
              borderRadius: 12, padding: '24px 16px', marginBottom: 16, textAlign: 'center',
            }}>
              <p className="hanzi" style={{ fontSize: 42, margin: 0, color: C.text, fontWeight: 300 }}>
                {w.hanzi}
              </p>
              <p style={{ fontSize: 12, color: C.textDim, margin: '8px 0 0' }}>
                {w.pinyin}
              </p>
            </div>
            <p style={{ textAlign: 'center', fontSize: 12, color: C.textDim, margin: '0 0 14px' }}>
              Quel sens ?
            </p>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 16 }}>
              {opts.map(opt => {
                let borderColor = C.border, bg = C.bgCard;
                if (submitted) {
                  if (opt.id === w.id) { borderColor = C.teal; bg = 'rgba(45,212,191,0.08)'; }
                }
                return (
                  <button key={opt.id} onClick={() => handleSelect(opt.id === w.id, w.id)} disabled={submitted} style={{
                    background: bg, border: `0.5px solid ${borderColor}`, color: C.text,
                    padding: 12, borderRadius: 8, textAlign: 'left', fontSize: 14,
                  }}>{opt.fr}</button>
                );
              })}
            </div>
          </>
        );
      })()}

      {/* "Quel mot signifie X dans cette phrase ?" */}
      {currentExo.type === 'phrase_word_qcm' && (
        <>
          <div style={{
            background: 'linear-gradient(135deg, rgba(244,114,182,0.05), rgba(168,85,247,0.03))',
            border: `0.5px solid ${C.borderAccent}`,
            borderRadius: 12, padding: '20px 16px', marginBottom: 14, textAlign: 'center',
          }}>
            <p className="hanzi" style={{ fontSize: 24, margin: '0 0 8px', color: C.text }}>
              {currentExo.phrase.hanzi}
            </p>
            <p style={{ fontSize: 11, color: C.textDim, margin: '0 0 6px' }}>
              {currentExo.phrase.pinyin}
            </p>
            <p style={{ fontSize: 11, color: C.textFaint, margin: 0, fontStyle: 'italic' }}>
              {currentExo.phrase.fr}
            </p>
            {isTTSAvailable() && (
              <button onClick={() => speak(currentExo.phrase.hanzi)} style={{
                marginTop: 10, background: 'transparent', border: `0.5px solid ${C.teal}`,
                color: C.teal, padding: '4px 10px', borderRadius: 6, fontSize: 10, letterSpacing: 1,
              }}>♪ ÉCOUTER</button>
            )}
          </div>
          <p style={{ textAlign: 'center', fontSize: 12, color: C.textDim, margin: '0 0 14px' }}>
