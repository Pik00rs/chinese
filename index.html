function SentenceBuilderScreen({ profile, onBack, modeConfig = null }) {
  const [currentIdx, setCurrentIdx] = useState(0);
  const [pool, setPool] = useState([]);
  const [available, setAvailable] = useState([]); // mots restant à tapper (avec distracteurs)
  const [built, setBuilt] = useState([]); // mots déjà tappés dans l'ordre
  const [feedback, setFeedback] = useState(null); // 'correct' | 'wrong' | null
  const [stats, setStats] = useState({ done: 0, correct: 0 });

  const targetCount = modeConfig?.questionCount || pool.length;

  // Construit le pool de phrases selon modeConfig
  // Utilise les phrases des leçons sélectionnées (banque + IA)
  useEffect(() => {
    let phrases = [];

    if (modeConfig && modeConfig.lessonIds && modeConfig.lessonIds.length > 0) {
      // Récupérer phrases depuis les leçons choisies
      const allLessons = getAllLessons();
      const selectedLessons = allLessons.filter(l => modeConfig.lessonIds.includes(l.id));
      const allP = [];
      for (const l of selectedLessons) {
        const banque = (l.phrase_ids || []).map(id => getPhraseById(id)).filter(Boolean);
        const ai = (l.extra_ai_phrases || []);
        allP.push(...banque, ...ai);
      }
      // Convertir au format SentenceBuilder : { fr, tokens (pinyin), distractors }
      phrases = allP
        .filter(p => p.hanzi && p.pinyin && p.fr)
        .map(p => {
          // Tokens = syllabes pinyin de la phrase
          const tokens = (p.pinyin || '').split(/\s+/).filter(Boolean);
          if (tokens.length < 2 || tokens.length > 8) return null;
          return {
            fr: p.fr,
            tokens,
            distractors: [], // remplis plus bas
            hanzi: p.hanzi,
            pinyin: p.pinyin,
          };
        })
        .filter(Boolean);

      // Pour chaque phrase, ajouter 2-3 distracteurs depuis les autres phrases
      const allTokens = phrases.flatMap(p => p.tokens);
      const uniqueTokens = [...new Set(allTokens)];
      phrases = phrases.map(p => {
        const correctSet = new Set(p.tokens);
        const candidates = uniqueTokens.filter(t => !correctSet.has(t));
        const shuffled = candidates.sort(() => Math.random() - 0.5);
        return { ...p, distractors: shuffled.slice(0, 2) };
      });
    } else {
      // Fallback : SENTENCE_BANK historique
      phrases = SENTENCE_BANK;
    }

    const shuffled = [...phrases].sort(() => Math.random() - 0.5);
    setPool(shuffled);
  }, [modeConfig]);

  const current = pool[currentIdx];

  // Préparer la liste des mots disponibles (tokens + distracteurs, mélangés)
  useEffect(() => {
    if (!current) return;
    const allTokens = [
      ...current.tokens.map((t, i) => ({ word: t, key: `t_${i}_${Math.random()}` })),
      ...current.distractors.map((d, i) => ({ word: d, key: `d_${i}_${Math.random()}` })),
    ];
    setAvailable(allTokens.sort(() => Math.random() - 0.5));
    setBuilt([]);
    setFeedback(null);
  }, [currentIdx, pool]);

  if (pool.length === 0) {
    return (
      <div className="slide-up" style={{ padding: '2rem 0' }}>
        <button onClick={onBack} style={{
          background: 'transparent', border: 'none', color: C.teal, fontSize: 13, padding: 0, marginBottom: 24,
        }}>← retour</button>
        <p style={{ fontSize: 11, color: C.textDim, letterSpacing: 2, margin: '0 0 6px' }}>CONSTRUCTION</p>
        <p style={{ fontSize: 22, fontWeight: 500, margin: '0 0 24px', color: C.text }}>Pas de phrases pour ce niveau</p>
        <p style={{ fontSize: 13, color: C.textDim, lineHeight: 1.6 }}>
          Active HSK 1 dans tes paramètres pour avoir des phrases à reconstruire.
        </p>
      </div>
    );
  }

  if (!current) return null;

  const handleTokenTap = (tokenObj) => {
    if (feedback) return;
    setBuilt([...built, tokenObj]);
    setAvailable(available.filter(t => t.key !== tokenObj.key));
  };

  const handleBuiltTap = (tokenObj) => {
    if (feedback) return;
    setBuilt(built.filter(t => t.key !== tokenObj.key));
    setAvailable([...available, tokenObj]);
  };

  const handleCheck = () => {
    if (feedback) return;
    const userPhrase = built.map(b => b.word).join('');
    const correctPhrase = current.tokens.join('');
    const isCorrect = userPhrase === correctPhrase;
    setFeedback(isCorrect ? 'correct' : 'wrong');
    setStats(s => ({ done: s.done + 1, correct: s.correct + (isCorrect ? 1 : 0) }));
    if (!isCorrect) {
      logError({
        item_id: `sentence_${currentIdx}`,
        hanzi: correctPhrase,
        pinyin: '',
        fr: current.fr,
        facet: 'sentence_construction',
        mode: 'sentence_builder',
        error_type: 'structure',
        user_answer: userPhrase,
        correct_answer: correctPhrase,
      });
    }
    markActivity(1);
  };

  const handleNext = () => {
    if (currentIdx + 1 >= pool.length) {
      // Recommencer en mélangeant
      setPool(p => [...p].sort(() => Math.random() - 0.5));
      setCurrentIdx(0);
    } else {
      setCurrentIdx(currentIdx + 1);
    }
  };

  const canCheck = built.length > 0 && !feedback;

  return (
    <div className="slide-up">
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
        <button onClick={onBack} style={{
          background: 'transparent', border: 'none', color: C.teal, fontSize: 13, padding: 0,
        }}>← retour</button>
        <span style={{ fontSize: 11, color: C.textDim, letterSpacing: 1 }}>
          {stats.done > 0 ? `${stats.correct} / ${stats.done}` : `${currentIdx + 1} / ${pool.length}`}
        </span>
      </div>

      <p style={{ fontSize: 11, color: C.textDim, letterSpacing: 2, margin: '0 0 6px' }}>CONSTRUCTION</p>
      <p style={{ fontSize: 18, margin: '0 0 16px', color: C.text }}>
        <span className="hanzi" style={{ color: C.amber }}>组句</span> · reconstruis la phrase en pinyin
      </p>

      {/* Niveau de la phrase */}
      {current.hsk && (
        <div style={{ textAlign: 'center', margin: '0 0 16px' }}>
          <span style={{
            fontSize: 9, padding: '4px 10px', border: `0.5px solid ${C.amber}`,
            color: C.amber, borderRadius: 12, letterSpacing: 1.5,
          }}>{current.hsk.toUpperCase()}</span>
        </div>
      )}

      {/* Phrase française à traduire */}
      <div style={{
        background: `linear-gradient(135deg, rgba(251,191,36,0.06), rgba(244,114,182,0.04))`,
        border: `0.5px solid ${C.borderAccent}`,
        borderRadius: 12, padding: 18, marginBottom: 18, textAlign: 'center',
      }}>
        <p style={{ fontSize: 16, color: C.text, margin: 0, lineHeight: 1.5 }}>
          {current.fr}
        </p>
      </div>

      {/* Zone de construction */}
      <div style={{
        background: C.bgCard,
        border: `1px solid ${
          feedback === 'correct' ? C.teal : feedback === 'wrong' ? C.red : C.border
        }`,
        borderRadius: 8, padding: 14, marginBottom: 14, minHeight: 64,
        display: 'flex', flexWrap: 'wrap', gap: 6, alignItems: 'flex-start',
      }}>
        {built.length === 0 && (
          <p style={{ color: C.textFaint, fontSize: 12, margin: 'auto', fontStyle: 'italic' }}>
            Tappe les mots dans l'ordre...
          </p>
        )}
        {built.map(t => (
          <button
            key={t.key}
            onClick={() => handleBuiltTap(t)}
            disabled={!!feedback}
            style={{
              background: feedback === 'correct' ? 'rgba(45,212,191,0.15)' : feedback === 'wrong' ? 'rgba(239,68,68,0.15)' : C.bgElevated,
              border: `0.5px solid ${feedback === 'correct' ? C.teal : feedback === 'wrong' ? C.red : C.borderAccent}`,
              color: C.text, padding: '6px 10px', borderRadius: 6, fontSize: 14,
              fontFamily: 'monospace', letterSpacing: 0.5,
            }}
          >{(/[\u4e00-\u9fa5]/.test(t.word)) ? '?' : t.word}</button>
        ))}
      </div>

      {/* Banque de mots disponibles */}
      {!feedback && (
        <>
          <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 2, margin: '0 0 8px' }}>MOTS DISPONIBLES</p>
          <div style={{
            display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 16,
            minHeight: 80,
          }}>
            {available.map(t => (
              <button
                key={t.key}
                onClick={() => handleTokenTap(t)}
                style={{
                  background: C.bgCard, border: `0.5px solid ${C.border}`,
                  color: C.text, padding: '8px 12px', borderRadius: 6, fontSize: 14,
                  fontFamily: 'monospace', letterSpacing: 0.5,
                }}
              >{(/[\u4e00-\u9fa5]/.test(t.word)) ? '?' : t.word}</button>
            ))}
          </div>
        </>
      )}

      {/* Feedback */}
      {feedback === 'correct' && (
        <div style={{
          padding: 14, borderRadius: 8, marginBottom: 14,
          background: 'rgba(45,212,191,0.08)',
          border: `0.5px solid ${C.teal}`,
        }}>
          <p style={{ margin: 0, fontSize: 13, color: C.teal, fontWeight: 500 }}>
            ✓ Parfait !
          </p>
          {current.hanzi && (
            <p className="hanzi" style={{ margin: '6px 0 0', fontSize: 16, color: C.text }}>
              {current.hanzi}
            </p>
          )}
          <p style={{ margin: '4px 0 0', fontSize: 12, color: C.textDim, fontStyle: 'italic', fontFamily: 'monospace' }}>
            {current.tokens.join(' ')}
          </p>
        </div>
      )}

      {feedback === 'wrong' && (
        <div style={{
          padding: 14, borderRadius: 8, marginBottom: 14,
          background: 'rgba(239,68,68,0.08)',
          border: `0.5px solid ${C.red}`,
        }}>
          <p style={{ margin: '0 0 6px', fontSize: 13, color: C.red, fontWeight: 500 }}>
            ✗ Pas tout à fait
          </p>
          <p style={{ margin: 0, fontSize: 12, color: C.textDim }}>
            <span style={{ color: C.text }}>Bonne réponse :</span>
          </p>
          {current.hanzi && (
            <p className="hanzi" style={{ margin: '4px 0 0', fontSize: 16, color: C.text }}>
              {current.hanzi}
            </p>
          )}
          <p style={{ margin: '2px 0 0', fontSize: 12, color: C.text, fontFamily: 'monospace' }}>
            {current.tokens.join(' ')}
          </p>
        </div>
      )}

      {/* Boutons d'action */}
      {!feedback ? (
        <button
          onClick={handleCheck}
          disabled={!canCheck}
          style={{
            width: '100%', background: canCheck ? C.amber : C.border,
            color: canCheck ? C.bg : C.textDim, border: 'none', padding: 13,
            borderRadius: 8, fontWeight: 600, fontSize: 14, letterSpacing: 0.5,
          }}
        >VÉRIFIER</button>
      ) : (
        <button onClick={handleNext} style={{
          width: '100%', background: C.amber, color: C.bg, border: 'none',
          padding: 13, borderRadius: 8, fontWeight: 600, fontSize: 14, letterSpacing: 0.5,
        }}>PHRASE SUIVANTE →</button>
      )}
    </div>
  );
}


// ============================================================
// PACK OFFLINE — pré-télécharger les textes Phase 5 par leçon
// (plus l'ancien système sentences/texts/dialogues)
// ============================================================
function PackDownloadScreen({ profile, learnerState, onBack }) {
  const isOnline = useOnlineStatus();
  const [downloading, setDownloading] = useState(false);
  const [progress, setProgress] = useState({ current: 0, total: 0, currentLesson: '' });
  const [errors, setErrors] = useState([]);
  const [completed, setCompleted] = useState(false);
  const cancelRef = useRef(false);

  // Quels textes Phase 5 sont déjà téléchargés ?
  const [downloadedTexts, setDownloadedTexts] = useState({});

  const refreshDownloaded = () => {
    if (typeof localStorage === 'undefined') return;
    const map = {};
    try {
      for (const key of Object.keys(localStorage)) {
        if (key.startsWith('hsk_phase5_')) {
          const lessonId = key.replace('hsk_phase5_', '');
          map[lessonId] = true;
        }
      }
    } catch {}
    setDownloadedTexts(map);
  };

  useEffect(() => { refreshDownloaded(); }, []);

  const allLessons = useMemo(() => getAllLessons(), []);
  const downloadedCount = Object.keys(downloadedTexts).length;
  const totalLessons = allLessons.length;
  const remaining = totalLessons - downloadedCount;

  const downloadAllTexts = async () => {
    if (!isOnline) {
      setErrors(['Tu dois être connecté à internet pour télécharger.']);
      return;
    }
    setDownloading(true);
    setErrors([]);
    setCompleted(false);
    cancelRef.current = false;

    const toDownload = allLessons.filter(l => !downloadedTexts[l.id]);
    setProgress({ current: 0, total: toDownload.length, currentLesson: '' });

    let success = 0;
    const localErrors = [];

    for (let i = 0; i < toDownload.length; i++) {
      if (cancelRef.current) break;
      const lesson = toDownload[i];
      setProgress({ current: i, total: toDownload.length, currentLesson: lesson.theme });

      try {
        const words = lesson.word_ids.map(id => getWordById(id)).filter(Boolean);
        const wordList = words.map(w => `${w.hanzi}(${w.pinyin}, ${w.fr})`).join(', ');

        const resp = await fetch('https://hsk-backend.tom-delaine14.workers.dev/generate-text', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            known_words: words.map(w => w.hanzi),
            hsk_level: 2,
            theme: `${lesson.theme} — utilise les mots suivants : ${wordList}`,
            length: 'short',
            question_count: 3,
          }),
        });

        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        if (!data.text_zh) throw new Error('Réponse incomplète');

        localStorage.setItem(`hsk_phase5_${lesson.id}`, JSON.stringify(data));
        success++;

        // Petite pause entre les requêtes pour ne pas spammer
        await new Promise(r => setTimeout(r, 300));
      } catch (e) {
        console.warn(`Failed for ${lesson.id}:`, e);
        localErrors.push(`${lesson.theme}: ${e.message}`);
      }
    }

    setErrors(localErrors);
    setCompleted(true);
    setDownloading(false);
    refreshDownloaded();
  };

  const downloadOne = async (lesson) => {
    if (!isOnline || downloading) return;
    setDownloading(true);
    setErrors([]);
    setProgress({ current: 0, total: 1, currentLesson: lesson.theme });

    try {
      const words = lesson.word_ids.map(id => getWordById(id)).filter(Boolean);
      const wordList = words.map(w => `${w.hanzi}(${w.pinyin}, ${w.fr})`).join(', ');

      const resp = await fetch('https://hsk-backend.tom-delaine14.workers.dev/generate-text', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          known_words: words.map(w => w.hanzi),
          hsk_level: 2,
          theme: `${lesson.theme} — utilise les mots suivants : ${wordList}`,
          length: 'short',
          question_count: 3,
        }),
      });

      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      if (!data.text_zh) throw new Error('Réponse incomplète');

      localStorage.setItem(`hsk_phase5_${lesson.id}`, JSON.stringify(data));
    } catch (e) {
      setErrors([`${lesson.theme}: ${e.message}`]);
    }

    setDownloading(false);
    refreshDownloaded();
  };

  const deleteOne = (lesson) => {
    if (downloading) return;
    if (!confirm(`Supprimer le texte téléchargé pour "${lesson.theme}" ?`)) return;
    try { localStorage.removeItem(`hsk_phase5_${lesson.id}`); } catch {}
    refreshDownloaded();
  };

  const deleteAll = () => {
    if (downloading) return;
    if (!confirm('Supprimer TOUS les textes Phase 5 téléchargés ?')) return;
    try {
      for (const key of Object.keys(localStorage)) {
        if (key.startsWith('hsk_phase5_')) localStorage.removeItem(key);
      }
    } catch {}
    refreshDownloaded();
  };

  return (
    <div className="slide-up">
      <button onClick={onBack} style={{
        background: 'transparent', border: 'none', color: C.teal, fontSize: 13, padding: 0, marginBottom: 16,
      }}>← retour</button>

      <p style={{ fontSize: 11, color: C.textDim, letterSpacing: 2, margin: '0 0 6px' }}>📥 PACK OFFLINE</p>
      <p style={{ fontSize: 22, fontWeight: 500, margin: '0 0 8px', color: C.text }}>
        Textes Phase 5
      </p>
      <p style={{ fontSize: 12, color: C.textDim, margin: '0 0 20px', lineHeight: 1.5 }}>
        Pré-charge les textes IA de chaque leçon pour pouvoir les lire offline.
        Chaque téléchargement utilise une requête au service IA (~5 sec).
      </p>

      {/* État global */}
      <div style={{
        background: 'linear-gradient(135deg, rgba(45,212,191,0.06), rgba(168,85,247,0.04))',
        border: `0.5px solid ${C.borderAccent}`,
        borderRadius: 12, padding: 16, marginBottom: 20,
      }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 10 }}>
          <span style={{ fontSize: 12, color: C.textDim, letterSpacing: 1 }}>TÉLÉCHARGÉS</span>
          <span style={{ fontSize: 18, color: C.teal, fontWeight: 500 }}>
            {downloadedCount} / {totalLessons}
          </span>
        </div>
        <div style={{ height: 4, background: C.border, borderRadius: 2, overflow: 'hidden' }}>
          <div style={{
            width: `${totalLessons > 0 ? (downloadedCount / totalLessons) * 100 : 0}%`,
            height: '100%',
            background: `linear-gradient(90deg, ${C.teal}, ${C.purple})`,
            transition: 'width 0.3s',
          }} />
        </div>
      </div>

      {/* Statut online */}
      {!isOnline && (
        <div style={{
          padding: 12, background: 'rgba(239,68,68,0.06)',
          border: `0.5px solid ${C.red}`, borderRadius: 8, marginBottom: 16,
        }}>
          <p style={{ fontSize: 12, color: C.red, margin: 0 }}>
            ⚠ Tu es offline. Reviens en ligne pour télécharger.
          </p>
        </div>
      )}

      {/* Bouton tout télécharger */}
      {!downloading && remaining > 0 && (
        <button onClick={downloadAllTexts} disabled={!isOnline} style={{
          width: '100%',
          background: isOnline ? C.teal : C.border,
          color: isOnline ? C.bg : C.textDim,
          border: 'none', padding: 14, borderRadius: 8,
          fontWeight: 600, fontSize: 13, letterSpacing: 0.5, marginBottom: 8,
        }}>
          ↓ TÉLÉCHARGER TOUT ({remaining} restant{remaining > 1 ? 's' : ''})
        </button>
      )}

      {/* Bouton tout supprimer */}
      {!downloading && downloadedCount > 0 && (
        <button onClick={deleteAll} style={{
          width: '100%', background: 'transparent',
          border: `0.5px solid ${C.red}`, color: C.red,
          padding: 10, borderRadius: 8, fontSize: 11, letterSpacing: 1, marginBottom: 16,
        }}>
          ⚠ SUPPRIMER TOUS LES TÉLÉCHARGEMENTS
        </button>
      )}

      {/* Progress bar pendant téléchargement */}
      {downloading && (
        <div style={{
          background: C.bgCard, border: `0.5px solid ${C.amber}`,
          borderRadius: 8, padding: 14, marginBottom: 16,
        }}>
          <p style={{ fontSize: 11, color: C.amber, letterSpacing: 1, margin: '0 0 6px' }}>
            ⟳ TÉLÉCHARGEMENT EN COURS
          </p>
          <p style={{ fontSize: 13, color: C.text, margin: '0 0 10px' }}>
            {progress.currentLesson}
          </p>
          <div style={{ height: 3, background: C.border, borderRadius: 2, overflow: 'hidden', marginBottom: 8 }}>
            <div style={{
              width: progress.total > 0 ? `${(progress.current / progress.total) * 100}%` : '0%',
              height: '100%',
              background: `linear-gradient(90deg, ${C.amber}, ${C.teal})`,
              transition: 'width 0.3s',
            }} />
          </div>
          <p style={{ fontSize: 11, color: C.textDim, margin: 0 }}>
            {progress.current + 1} / {progress.total}
          </p>
          <button onClick={() => { cancelRef.current = true; }} style={{
            marginTop: 10, background: 'transparent',
            border: `0.5px solid ${C.red}`, color: C.red,
            padding: '6px 12px', borderRadius: 6, fontSize: 11, letterSpacing: 1,
          }}>ANNULER</button>
        </div>
      )}

      {/* Erreurs */}
      {errors.length > 0 && !downloading && (
        <div style={{
          padding: 12, background: 'rgba(239,68,68,0.06)',
          border: `0.5px solid ${C.red}`, borderRadius: 8, marginBottom: 16,
        }}>
          <p style={{ fontSize: 11, color: C.red, margin: '0 0 6px' }}>
            {errors.length} erreur{errors.length > 1 ? 's' : ''} :
          </p>
          {errors.slice(0, 5).map((err, i) => (
            <p key={i} style={{ fontSize: 11, color: C.textDim, margin: '0 0 2px' }}>
              {err}
            </p>
          ))}
          {errors.length > 5 && (
            <p style={{ fontSize: 11, color: C.textFaint, margin: '4px 0 0', fontStyle: 'italic' }}>
              ... et {errors.length - 5} autres
            </p>
          )}
        </div>
      )}

      {/* Liste des leçons */}
      <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 2, margin: '0 0 8px' }}>
        DÉTAIL PAR LEÇON
      </p>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 4, marginBottom: 16 }}>
        {allLessons.map(lesson => {
          const isDl = !!downloadedTexts[lesson.id];
          return (
            <div key={lesson.id} style={{
              background: C.bgCard,
              border: `0.5px solid ${isDl ? C.teal : C.border}`,
              borderLeft: `2px solid ${isDl ? C.teal : C.border}`,
              padding: 10, display: 'flex', alignItems: 'center', gap: 10,
            }}>
              <span style={{ color: isDl ? C.teal : C.textFaint, fontSize: 14, minWidth: 18 }}>
                {isDl ? '✓' : '○'}
              </span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <p style={{ fontSize: 12, margin: '0 0 1px', color: C.text }}>
                  {lesson.theme}
                </p>
                <p style={{ fontSize: 9, color: C.textDim, margin: 0 }}>
                  {lesson.chapter}
                </p>
              </div>
              {isDl ? (
                <button onClick={() => deleteOne(lesson)} disabled={downloading} style={{
                  background: 'transparent', border: 'none', color: C.red,
                  fontSize: 14, padding: '4px 8px',
                }}>×</button>
              ) : (
                <button onClick={() => downloadOne(lesson)} disabled={!isOnline || downloading} style={{
                  background: isOnline && !downloading ? 'transparent' : C.border,
                  border: `0.5px solid ${isOnline && !downloading ? C.teal : C.border}`,
                  color: isOnline && !downloading ? C.teal : C.textDim,
                  padding: '5px 10px', borderRadius: 4, fontSize: 10, letterSpacing: 0.5,
                }}>↓ DL</button>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ErrorBookScreen({ onBack, onPracticeItem }) {
  const [errors, setErrors] = useState([]);
  const [filter, setFilter] = useState('all'); // all | tone | semantic | graphic | structure

  useEffect(() => {
    setErrors(loadErrorLog());
  }, []);

  const grouped = useMemo(() => {
    const filtered = filter === 'all'
      ? errors
      : errors.filter(e => e.error_type === filter);
    return groupErrorsByItem(filtered);
  }, [errors, filter]);

  const totalByType = useMemo(() => {
    const counts = { tone: 0, semantic: 0, graphic: 0, structure: 0, unknown: 0 };
    for (const e of errors) {
      counts[e.error_type || 'unknown'] = (counts[e.error_type || 'unknown'] || 0) + 1;
    }
    return counts;
  }, [errors]);

  const handleClearAll = () => {
    if (confirm('Effacer tout le carnet d\'erreurs ?')) {
      clearErrorLog();
      setErrors([]);
    }
  };

  const errorTypeLabels = {
    tone: { label: 'Tons', color: C.amber, icon: '♬' },
    semantic: { label: 'Sens', color: C.purple, icon: '◈' },
    graphic: { label: 'Graphique', color: C.pink, icon: '◇' },
    structure: { label: 'Grammaire', color: C.teal, icon: '⊞' },
    unknown: { label: 'Autre', color: C.textFaint, icon: '◌' },

  return (
    <div className="slide-up">
      <button onClick={onBack} style={{
        background: 'transparent', border: 'none', color: C.teal, fontSize: 13, padding: 0, marginBottom: 16,
      }}>← retour</button>

      <p style={{ fontSize: 11, color: C.textDim, letterSpacing: 2, margin: '0 0 6px' }}>CARNET D'ERREURS</p>

        <span className="hanzi" style={{ color: C.red }}>错</span> · {errors.length} erreurs

          <p style={{ fontSize: 48, margin: '0 0 12px', color: C.teal }}>✓</p>
          <p style={{ fontSize: 14, color: C.text, margin: '0 0 6px' }}>Aucune erreur enregistrée</p>
          <p style={{ fontSize: 12, color: C.textDim, lineHeight: 1.5 }}>
            Tes erreurs apparaîtront ici quand tu te tromperas dans les sessions.
          </p>

                    <p style={{ fontSize: 10, color: C.textDim, margin: '0 0 4px', letterSpacing: 1 }}>
                      {cfg.icon} {cfg.label.toUpperCase()}

          {/* Filtres */}

          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 20 }}>

function CalendarScreen({ onBack }) {
  const [calendar, setCalendar] = useState({});

  useEffect(() => {
    setCalendar(loadCalendar());
  }, []);

  // Construire la matrice des 17 dernières semaines (~4 mois)
  const matrix = useMemo(() => {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const weeks = [];
    // Calculer le lundi de la semaine actuelle puis remonter 16 semaines
    const dayOfWeek = (today.getDay() + 6) % 7; // 0 = lundi
    const startDate = new Date(today);
    startDate.setDate(today.getDate() - dayOfWeek - 16 * 7);

    for (let w = 0; w < 17; w++) {
      const week = [];
      for (let d = 0; d < 7; d++) {
        const date = new Date(startDate);
        date.setDate(startDate.getDate() + w * 7 + d);
        const dateStr = date.toISOString().slice(0, 10);
        const count = calendar[dateStr] || 0;
        const isFuture = date > today;
        week.push({ date, dateStr, count, isFuture });
      }
      weeks.push(week);
    }
    return weeks;
  }, [calendar]);

  // Stats globales
  const stats = useMemo(() => {
    const entries = Object.entries(calendar);
    const totalSessions = entries.reduce((sum, [_, c]) => sum + c, 0);
    const activeDays = entries.filter(([_, c]) => c > 0).length;

    // Calculer la série actuelle
    const today = new Date();
    let currentStreak = 0;
    for (let i = 0; i < 365; i++) {
      const d = new Date(today);
      d.setDate(today.getDate() - i);
      const ds = d.toISOString().slice(0, 10);
      if (calendar[ds] > 0) currentStreak++;
      else if (i > 0) break;
    }

    return { totalSessions, activeDays, currentStreak };
  }, [calendar]);

  // Couleur en fonction de l'intensité
  const intensityColor = (count) => {
    if (count === 0) return C.bgCard;
    if (count === 1) return 'rgba(45,212,191,0.25)';
    if (count <= 3) return 'rgba(45,212,191,0.55)';
    if (count <= 6) return 'rgba(45,212,191,0.85)';
    return C.teal;
  };

  const monthLabels = ['JAN', 'FÉV', 'MAR', 'AVR', 'MAI', 'JUIN', 'JUIL', 'AOÛ', 'SEP', 'OCT', 'NOV', 'DÉC'];
  const dayLabels = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];

  return (
    <div className="slide-up">
      <button onClick={onBack} style={{
        background: 'transparent', border: 'none', color: C.teal, fontSize: 13, padding: 0, marginBottom: 16,
      }}>← retour</button>

      <p style={{ fontSize: 11, color: C.textDim, letterSpacing: 2, margin: '0 0 6px' }}>CALENDRIER</p>
      <p style={{ fontSize: 22, fontWeight: 500, margin: '0 0 24px', color: C.text }}>
        <span className="hanzi" style={{ color: C.teal }}>日历</span> · ton historique
      </p>

      {/* Stats globales */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8, marginBottom: 24 }}>
        <div style={{ background: C.bgCard, border: `0.5px solid ${C.border}`, borderLeft: `2px solid ${C.teal}`, padding: 12 }}>
          <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 1, margin: '0 0 4px' }}>SÉRIE</p>
          <p style={{ fontSize: 22, color: C.teal, margin: 0, fontWeight: 500 }}>{stats.currentStreak}</p>
          <p style={{ fontSize: 10, color: C.textFaint, margin: '4px 0 0' }}>jours{stats.currentStreak > 1 ? ' 🔥' : ''}</p>
        </div>
        <div style={{ background: C.bgCard, border: `0.5px solid ${C.border}`, borderLeft: `2px solid ${C.purple}`, padding: 12 }}>
          <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 1, margin: '0 0 4px' }}>JOURS</p>
          <p style={{ fontSize: 22, color: C.purple, margin: 0, fontWeight: 500 }}>{stats.activeDays}</p>
          <p style={{ fontSize: 10, color: C.textFaint, margin: '4px 0 0' }}>actifs</p>
        </div>
        <div style={{ background: C.bgCard, border: `0.5px solid ${C.border}`, borderLeft: `2px solid ${C.amber}`, padding: 12 }}>
          <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 1, margin: '0 0 4px' }}>SESSIONS</p>
          <p style={{ fontSize: 22, color: C.amber, margin: 0, fontWeight: 500 }}>{stats.totalSessions}</p>
          <p style={{ fontSize: 10, color: C.textFaint, margin: '4px 0 0' }}>total</p>
        </div>
      </div>

      {/* Heatmap */}
      <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 2, margin: '0 0 12px' }}>4 DERNIERS MOIS</p>
      <div style={{
        background: C.bgCard, border: `0.5px solid ${C.border}`,
        borderRadius: 8, padding: 14, marginBottom: 16, overflowX: 'auto',
      }}>
        {/* Mois */}
        <div style={{ display: 'flex', gap: 3, marginLeft: 18, marginBottom: 6 }}>
          {matrix.map((week, wi) => {
            const firstDay = week[0].date;
            const showLabel = firstDay.getDate() <= 7;
            return (
              <div key={wi} style={{ width: 14, fontSize: 8, color: C.textDim, textAlign: 'center', letterSpacing: 0.5 }}>
                {showLabel ? monthLabels[firstDay.getMonth()] : ''}
              </div>
            );
          })}
        </div>
        {/* Grille jours */}
        <div style={{ display: 'flex', gap: 6 }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 3, paddingTop: 1 }}>
            {dayLabels.map((d, i) => (
              <span key={i} style={{ fontSize: 8, color: C.textFaint, height: 14, lineHeight: '14px' }}>
                {i % 2 === 0 ? d : ''}
              </span>
            ))}
          </div>
          <div style={{ display: 'flex', gap: 3 }}>
            {matrix.map((week, wi) => (
              <div key={wi} style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
                {week.map((day, di) => (
                  <div
                    key={di}
                    title={`${day.dateStr} : ${day.count} session${day.count > 1 ? 's' : ''}`}
                    style={{
                      width: 14, height: 14, borderRadius: 2,
                      background: day.isFuture ? 'transparent' : intensityColor(day.count),
                      border: day.isFuture ? `1px dashed ${C.border}` : `0.5px solid ${C.border}`,
                    }}
                  />
                ))}
              </div>
            ))}
          </div>
        </div>

        {/* Légende */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 14, justifyContent: 'flex-end' }}>
          <span style={{ fontSize: 9, color: C.textDim }}>moins</span>
          {[0, 1, 3, 6, 10].map((c, i) => (
            <div key={i} style={{
              width: 11, height: 11, borderRadius: 2,
              background: intensityColor(c),
              border: `0.5px solid ${C.border}`,
            }} />
          ))}
          <span style={{ fontSize: 9, color: C.textDim }}>plus</span>
        </div>
      </div>

      <p style={{ fontSize: 11, color: C.textFaint, textAlign: 'center', fontStyle: 'italic', lineHeight: 1.5 }}>
        Chaque carré = un jour. L'intensité reflète le nombre de sessions complétées.
      </p>
    </div>
  );
}

        {progress && (
          <p style={{ fontSize: 11, color: C.textDim, margin: '10px 0 0' }}>
            Phase actuelle : {currentPhase}/5 — {phaseLabels[currentPhase]}
          </p>
        )}
      </div>

      {/* Stepper des 5 phases */}
      <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 2, margin: '0 0 10px' }}>
        PARCOURS DE LA LEÇON
      </p>
      <div style={{
        background: C.bgCard, border: `0.5px solid ${C.border}`,
        borderRadius: 8, padding: 14, marginBottom: 20,
      }}>
        {[1, 2, 3, 4, 5].map(phaseNum => {
          const isCompleted = progress?.phase_progress?.[phaseNum];
          const isCurrent = currentPhase === phaseNum && !isCompleted;
          const isLocked = !isCompleted && !isCurrent && phaseNum > currentPhase;

          let icon = '○';
          let iconColor = C.textFaint;
          let textColor = C.textDim;
          let badge = null;

          if (isCompleted) {
            icon = '✓'; iconColor = C.teal; textColor = C.text;
          } else if (isCurrent) {
            icon = '◐'; iconColor = C.amber; textColor = C.text;
            badge = (
              <span style={{
                fontSize: 9, padding: '2px 8px', background: C.amber, color: C.bg,
                borderRadius: 10, letterSpacing: 1, fontWeight: 600,
              }}>EN COURS</span>
            );
          } else if (isLocked) {
            icon = '◌'; iconColor = C.textFaint; textColor = C.textFaint;
          }

          return (
            <div key={phaseNum} style={{
              display: 'flex', alignItems: 'center', gap: 12,
              padding: '8px 0',
              borderBottom: phaseNum < 5 ? `0.5px solid ${C.border}` : 'none',
              opacity: isLocked ? 0.5 : 1,
            }}>
              <span style={{
                fontSize: 18, color: iconColor, minWidth: 22, textAlign: 'center',
              }}>{icon}</span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <p style={{ fontSize: 12, margin: '0 0 2px', fontWeight: 500, color: textColor }}>
                  Phase {phaseNum} · {phaseLabels[phaseNum]}
                </p>
                <p style={{ fontSize: 10, color: C.textDim, margin: 0 }}>
                  {phaseNum === 1 && '4 modalités par mot : QCM ↔ traduction + écriture + audio'}
                  {phaseNum === 2 && 'Mots dans des phrases courtes'}
                  {phaseNum === 3 && 'Phrases complètes : QCM, tap-word, écriture'}
                  {phaseNum === 4 && 'Renforcement adaptatif sur les mots faibles'}
                  {phaseNum === 5 && 'Texte de synthèse via IA'}
                </p>
              </div>
              {badge}
            </div>
          );
        })}
      </div>

      {/* Liste des mots cibles */}
      <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 2, margin: '0 0 10px' }}>
        MOTS CIBLES ({words.length})
      </p>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 20 }}>
        {words.map(w => {
          const score = getWordQualityScore(w.id, wordQuality);
          let color = C.textFaint;
          if (score >= 80) color = C.teal;
          else if (score >= 50) color = C.amber;
          else if (score > 0) color = C.purple;
          return (
            <div key={w.id} style={{
              background: C.bgCard, border: `0.5px solid ${C.border}`,
              borderLeft: `2px solid ${color}`,
              padding: '8px 10px', display: 'flex', alignItems: 'center', gap: 6,
            }}>
              <span className="hanzi" style={{ fontSize: 16, color: C.text }}>{w.hanzi}</span>
              <span style={{ fontSize: 9, color: C.textDim }}>{w.pinyin}</span>
            </div>
          );
        })}
      </div>

      {/* Phrases si dispo */}
      {phrases.length > 0 && (
        <>
          <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 2, margin: '0 0 10px' }}>
            PHRASES ASSOCIÉES ({phrases.length}{aiPhrases.length > 0 ? ` · ${banquePhrases.length} banque + ${aiPhrases.length} IA` : ''})
          </p>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 24 }}>
            {phrases.slice(0, 5).map(p => (
              <div key={p.id} style={{
                background: C.bgCard, border: `0.5px solid ${C.border}`,
                padding: 10,
              }}>
                <p className="hanzi" style={{ fontSize: 14, color: C.text, margin: '0 0 2px' }}>{p.hanzi}</p>
                <p style={{ fontSize: 10, color: C.textDim, margin: '0 0 2px', letterSpacing: 0.5 }}>{p.pinyin}</p>
                <p style={{ fontSize: 11, color: C.textFaint, margin: 0 }}>{p.fr}</p>
              </div>
            ))}
            {phrases.length > 5 && (
              <p style={{ fontSize: 11, color: C.textFaint, textAlign: 'center', fontStyle: 'italic', margin: 0 }}>
                + {phrases.length - 5} autres
              </p>
            )}
          </div>
        </>
      )}

      {particles.length > 0 && (
        <>
          <p style={{ fontSize: 10, color: C.purple, letterSpacing: 2, margin: '0 0 10px' }}>
            ✦ PARTICULES À DÉCOUVRIR ({particles.length})
          </p>
          <div style={{
            background: 'linear-gradient(135deg, rgba(168,85,247,0.05), rgba(244,114,182,0.03))',
            border: `0.5px solid ${C.purple}`, borderRadius: 8, padding: 12, marginBottom: 24,
          }}>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 6 }}>
              {particles.map(p => (
                <span key={p.id} style={{
                  background: C.bg,
                  border: `0.5px solid ${C.purple}`,
                  padding: '4px 10px', borderRadius: 4, fontSize: 14,
                }}>
                  <span className="hanzi" style={{ color: C.purple }}>{p.hanzi}</span>
                  <span style={{ fontSize: 10, color: C.textDim, marginLeft: 6, fontFamily: 'monospace' }}>
                    {p.pinyin}
                  </span>
                </span>
              ))}
            </div>
            <p style={{ fontSize: 10, color: C.textFaint, margin: 0, fontStyle: 'italic' }}>
              Tu les découvriras entre les Phases 1 et 2.
            </p>
          </div>
        </>
      )}

      {/* Bouton démarrer */}
      <button onClick={() => onStart(lesson.id)} style={{
        width: '100%',
        background: isCompleted ? C.purple : C.teal,
        color: C.bg, border: 'none', padding: 14, borderRadius: 8,
        fontWeight: 600, fontSize: 14, letterSpacing: 0.5,
        marginBottom: 8,
      }}>
        {isCompleted ? '↻ REVOIR LA LEÇON' : progress ? 'CONTINUER →' : 'COMMENCER →'}
      </button>

      {/* Bouton changer intensité (visible si Phase 1 pas encore complétée) */}
      {progress?.intensity && !progress?.phase_progress?.[1] && onChangeIntensity && (() => {
        const intensityLabels = { light: 'Léger', normal: 'Normal', deep: 'Approfondi' };
        return (
          <button onClick={onChangeIntensity} style={{
            width: '100%',
            background: 'transparent',
            border: `0.5px solid ${C.border}`,
            color: C.textDim, padding: 10, borderRadius: 8,
            fontSize: 11, letterSpacing: 0.5,
          }}>
            ◐ Intensité actuelle : {intensityLabels[progress.intensity]} · changer
          </button>
        );
      })()}
    </div>
  );
}


// ============================================================
// LESSON PHASE 1 — Apprentissage des mots cibles
// QCM pinyin→fr, fr→pinyin, remplissage manuel
// On boucle sur les mots jusqu'à ce qu'ils soient marqués "connus" (qualité >= 60% sur ces 3 modalités)
// ============================================================
function LessonPhase1Screen({ lessonId, onBack, onPhaseComplete }) {
  const lesson = getLessonById(lessonId);
  const words = lesson.word_ids.map(id => getWordById(id)).filter(Boolean);

  // Récupérer l'intensité choisie pour cette leçon (par défaut 'normal')
  const intensity = getLessonIntensity(lessonId) || 'normal';
  const activeModalities = useMemo(() => {
    let mods = getActiveModalities(intensity);
    // Si TTS pas dispo et 'audio' demandé, on le retire
    if (!isTTSAvailable()) mods = mods.filter(m => m !== 'audio');
    return mods;
  }, [intensity]);

  // État de l'exercice courant
  const [currentExo, setCurrentExo] = useState(null); // { word, modality, options/input }
  const [submitted, setSubmitted] = useState(false);
  const [feedback, setFeedback] = useState(null);
  const [userInput, setUserInput] = useState('');
  const [stats, setStats] = useState({ done: 0, correct: 0 });
  const [refreshKey, setRefreshKey] = useState(0);

  // Historique des dernières questions (mot+modalité) pour éviter doublons
  const recentExosRef = useRef([]);

  // Calcul de la progression
  const wordQuality = useMemo(() => loadWordQuality(), [refreshKey]);
  const wordsToWork = useMemo(() => {
    // Un mot est "à travailler" si TOUTES les modalités actives ne sont pas validées
    return words.filter(w => {
      const q = wordQuality[w.id] || {};
      return activeModalities.some(mod => !q[mod]);
    });
  }, [words, wordQuality, activeModalities]);

  // Distracteurs prioritaires : autres mots de la même leçon (plus pertinent)
  const lessonOtherWords = useMemo(() => words, [words]);

  // Choisir le prochain exercice
  const pickNext = () => {
    setSubmitted(false);
    setFeedback(null);
    setUserInput('');

    if (wordsToWork.length === 0) {
      // Phase 1 terminée
      setCurrentExo(null);
      return;
    }

    // Recent : dernières N combinaisons word+modality
    const recent = recentExosRef.current;
    const RECENT_MAX = Math.min(6, Math.max(2, Math.floor(wordsToWork.length / 2)));

    // Choisir un mot à travailler (priorité au moins maîtrisé) — qui n'a pas été vu récemment
    const sortedWords = [...wordsToWork].sort((a, b) => {
      const qa = wordQuality[a.id] || {};
      const qb = wordQuality[b.id] || {};
      const scoreA = (qa.qcm_zh_fr ? 1 : 0) + (qa.qcm_fr_zh ? 1 : 0) + (qa.fill_manual ? 1 : 0) + (qa.audio ? 1 : 0);
      const scoreB = (qb.qcm_zh_fr ? 1 : 0) + (qb.qcm_fr_zh ? 1 : 0) + (qb.fill_manual ? 1 : 0) + (qb.audio ? 1 : 0);
      return scoreA - scoreB; // moins maîtrisé d'abord
    });

    // Filter out les mots vus récemment (sauf si on n'en a plus assez)
    const recentWordIds = new Set(recent.slice(-Math.floor(RECENT_MAX / 2)).map(r => r.wordId));
    const freshWords = sortedWords.filter(w => !recentWordIds.has(w.id));
    const candidatePool = freshWords.length >= 2 ? freshWords : sortedWords;

    // Pick parmi les top 3 candidats
    const word = candidatePool[Math.floor(Math.random() * Math.min(3, candidatePool.length))];

    // Choisir la modalité non encore validée pour ce mot, parmi les modalités actives
    const q = wordQuality[word.id] || {};
    const allModalities = activeModalities.filter(m => !q[m]);

    // Filter out modality vue récemment pour ce mot précis
    const recentForThisWord = recent.filter(r => r.wordId === word.id).map(r => r.modality);
    const freshModalities = allModalities.filter(m => !recentForThisWord.includes(m));
    const pickFromModalities = freshModalities.length > 0 ? freshModalities : allModalities;

    const modality = pickFromModalities[Math.floor(Math.random() * pickFromModalities.length)];

    // Mémoriser pour éviter répétition
    recentExosRef.current = [...recent, { wordId: word.id, modality }].slice(-RECENT_MAX);

    // Construire l'exercice
    if (modality === 'qcm_zh_fr' || modality === 'qcm_fr_zh') {
      // Distracteurs prioritaires : autres mots de la leçon (plus pertinent et plus stimulant)
      let candidates = lessonOtherWords.filter(w => w.id !== word.id);
      if (candidates.length < 3) {
        // Fallback : vocab global avec même thème ou aléatoire
        const fallback = (typeof VOCAB !== 'undefined' ? VOCAB : []).filter(w => w.id !== word.id);
        candidates = [...candidates, ...fallback];
      }
      const distractors = [...candidates].sort(() => Math.random() - 0.5).slice(0, 3);
      const all = [...distractors, word].sort(() => Math.random() - 0.5);
      setCurrentExo({ word, modality, options: all });
    } else if (modality === 'audio') {
      // Audio : on entend, on tape pinyin OU sens (alterne au hasard)
      const audioMode = Math.random() < 0.5 ? 'pinyin' : 'fr';
      setCurrentExo({ word, modality, audioMode });
      // Lancer l'audio automatiquement après un court délai
      setTimeout(() => speak(word.hanzi), 400);
    } else {
      // Remplissage manuel : user tape le pinyin du mot
      setCurrentExo({ word, modality });
    }
  };

  useEffect(() => {
    if (!currentExo && wordsToWork.length > 0) pickNext();
    if (wordsToWork.length === 0) setCurrentExo(null);
  }, [wordsToWork.length, refreshKey]);

  if (!lesson) return <p style={{ color: C.textDim }}>Leçon introuvable.</p>;

  // Si tous les mots sont validés
  if (wordsToWork.length === 0) {
    return (
      <div className="slide-up">
        <button onClick={onBack} style={{
          background: 'transparent', border: 'none', color: C.teal, fontSize: 13, padding: 0, marginBottom: 16,
        }}>← retour</button>

        <div style={{ textAlign: 'center', padding: '3rem 1rem' }}>
          <p style={{ fontSize: 56, margin: '0 0 16px', color: C.teal }}>✓</p>
          <p style={{ fontSize: 22, fontWeight: 500, margin: '0 0 8px', color: C.text }}>
            Phase 1 terminée
          </p>
          <p style={{ fontSize: 13, color: C.textDim, margin: '0 0 24px', lineHeight: 1.6 }}>
            Tu as validé toutes les modalités sur les {words.length} mots de cette leçon.
            Phase 2 : mots + phrases simples (à venir au prochain sprint).
          </p>
          <button onClick={onPhaseComplete} style={{
            background: C.teal, color: C.bg, border: 'none',
            padding: '12px 28px', borderRadius: 8, fontWeight: 600, fontSize: 14, letterSpacing: 0.5,
          }}>RETOUR À LA LEÇON</button>
        </div>
      </div>
    );
  }

  if (!currentExo) return null;

  const { word, modality, options } = currentExo;

  // Handler QCM
  const handleQCMSelect = (opt) => {
    if (submitted) return;
    setSubmitted(true);
    const correct = opt.id === word.id;
    setFeedback(correct ? 'correct' : 'wrong');
    setStats(s => ({ done: s.done + 1, correct: s.correct + (correct ? 1 : 0) }));
    updateWordQuality(word.id, modality, correct);
    if (!correct) {
      logError({
        item_id: word.id, hanzi: word.hanzi, pinyin: word.pinyin, fr: word.fr,
        facet: modality, mode: 'lesson_phase1',
        error_type: detectErrorType(word, opt, 'qcm'),
        user_answer: modality === 'qcm_zh_fr' ? opt.fr : opt.pinyin,
        correct_answer: modality === 'qcm_zh_fr' ? word.fr : word.pinyin,
        confused_with: opt.hanzi,
      });
    }
    markActivity(1);
  };

  // Handler remplissage manuel
  const normalizeInput = (s) => s.toLowerCase().trim()
    .replace(/[āáǎà]/g, 'a').replace(/[ēéěè]/g, 'e').replace(/[īíǐì]/g, 'i')
    .replace(/[ōóǒò]/g, 'o').replace(/[ūúǔù]/g, 'u').replace(/[ǖǘǚǜü]/g, 'u')
    .replace(/\s+/g, '');

  const handleFillSubmit = () => {
    if (submitted) return;
    setSubmitted(true);
    const matchResult = pinyinMatches(userInput, word.pinyin);
    const correct = matchResult.result === 'exact';
    setFeedback(matchResult.result === 'exact' ? 'correct' : matchResult.result === 'close' ? 'close' : 'wrong');
    if (correct) {
      setStats(s => ({ done: s.done + 1, correct: s.correct + 1 }));
      updateWordQuality(word.id, modality, true);
    } else if (matchResult.result === 'wrong') {
      // Erreur franche : on incrémente pas done (on attend la décision sur close), et on log
      setStats(s => ({ done: s.done + 1, correct: s.correct }));
      updateWordQuality(word.id, modality, false);
      logError({
        item_id: word.id, hanzi: word.hanzi, pinyin: word.pinyin, fr: word.fr,
        facet: 'fill_manual', mode: 'lesson_phase1',
        error_type: 'unknown',
        user_answer: userInput, correct_answer: word.pinyin,
      });
    }
    // Si 'close' : on attend que l'utilisateur clique sur "C'était une faute de frappe" ou "Je ne savais pas"
    markActivity(1);
  };

  // Validation manuelle : "C'était une faute de frappe"
  const handleAcceptTypo = () => {
    setFeedback('correct');
    setStats(s => ({ done: s.done + 1, correct: s.correct + 1 }));
    updateWordQuality(word.id, modality, true);
  };

  // Validation manuelle : "Je ne savais pas"
  const handleRejectTypo = () => {
    setFeedback('wrong');
    setStats(s => ({ done: s.done + 1, correct: s.correct }));
    updateWordQuality(word.id, modality, false);
    logError({
      item_id: word.id, hanzi: word.hanzi, pinyin: word.pinyin, fr: word.fr,
      facet: 'fill_manual', mode: 'lesson_phase1',
      error_type: 'typo_rejected',
      user_answer: userInput, correct_answer: word.pinyin,
    });
  };

  // Handler audio : on entend, on tape pinyin OU sens FR
  const handleAudioSubmit = () => {
    if (submitted) return;
    setSubmitted(true);
    const audioMode = currentExo.audioMode; // 'pinyin' | 'fr'
    let correct = false;
    let isClose = false;
    if (audioMode === 'pinyin') {
      const matchResult = pinyinMatches(userInput, word.pinyin);
      correct = matchResult.result === 'exact';
      isClose = matchResult.result === 'close';
    } else {
      // Pour le sens : on accepte si la réponse contient le sens principal (insensible à la casse)
      const userClean = userInput.toLowerCase().trim();
      const expected = word.fr.toLowerCase();
      // On split sur virgules et on accepte si une des variantes match
      const variants = expected.split(/[,;]/).map(s => s.trim());
      correct = variants.some(v => v === userClean) ||
                userClean.length >= 3 && variants.some(v => v.includes(userClean) || userClean.includes(v));
    }
    setFeedback(correct ? 'correct' : isClose ? 'close' : 'wrong');
    if (correct) {
      setStats(s => ({ done: s.done + 1, correct: s.correct + 1 }));
      updateWordQuality(word.id, 'audio', true);
    } else if (!isClose) {
      // Erreur franche
      setStats(s => ({ done: s.done + 1, correct: s.correct }));
      updateWordQuality(word.id, 'audio', false);
      logError({
        item_id: word.id, hanzi: word.hanzi, pinyin: word.pinyin, fr: word.fr,
        facet: 'audio', mode: 'lesson_phase1',
        error_type: 'unknown',
        user_answer: userInput,
        correct_answer: audioMode === 'pinyin' ? word.pinyin : word.fr,
      });
    }
    // Si 'close' : on laisse l'utilisateur décider via les boutons typo
    markActivity(1);
  };

  const handleNext = () => {
    setRefreshKey(k => k + 1);
    pickNext();
  };

  const totalToValidate = words.length * activeModalities.length;
  const validated = words.reduce((sum, w) => {
    const q = wordQuality[w.id] || {};
    return sum + activeModalities.filter(m => q[m]).length;
  }, 0);

  return (
    <div className="slide-up">
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
        <button onClick={onBack} style={{
          background: 'transparent', border: 'none', color: C.teal, fontSize: 13, padding: 0,
        }}>← retour</button>
        <span style={{ fontSize: 11, color: C.textDim, letterSpacing: 1 }}>
          {validated} / {totalToValidate} validations
        </span>
      </div>

      <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 2, margin: '0 0 4px' }}>
        PHASE 1 · APPRENTISSAGE
      </p>
      <p style={{ fontSize: 16, margin: '0 0 16px', color: C.text }}>{lesson.theme}</p>

      {/* Barre de progression de la phase */}
      <div style={{ height: 3, background: C.border, borderRadius: 2, overflow: 'hidden', marginBottom: 20 }}>
        <div style={{
          width: `${(validated / totalToValidate) * 100}%`, height: '100%',
          background: `linear-gradient(90deg, ${C.teal}, ${C.purple})`, transition: 'width 0.3s',
        }} />
      </div>

      {/* QCM hanzi → fr */}
      {modality === 'qcm_zh_fr' && (
        <>
          <div style={{
            background: 'linear-gradient(135deg, rgba(45,212,191,0.08), rgba(168,85,247,0.06))',
            border: `0.5px solid ${C.borderAccent}`,
            borderRadius: 12, padding: '18px 14px', marginBottom: 10, textAlign: 'center',
          }}>
            <p className="hanzi" style={{ fontSize: 56, margin: 0, color: C.text, fontWeight: 300 }}>
              {word.hanzi}
            </p>
            <p style={{ fontSize: 13, color: C.textDim, margin: '12px 0 0', letterSpacing: 1 }}>
              {word.pinyin}
            </p>
            {isTTSAvailable() && (
              <button onClick={() => speak(word.hanzi)} style={{
                marginTop: 12, background: 'transparent', border: `0.5px solid ${C.teal}`, color: C.teal,
                padding: '5px 12px', borderRadius: 8, fontSize: 11, letterSpacing: 1,
              }}>♪ ÉCOUTER</button>
            )}
          </div>
          <p style={{ textAlign: 'center', fontSize: 12, color: C.textDim, margin: '0 0 8px' }}>
            Quel est le sens ?
          </p>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 10 }}>
            {options.map(opt => {
              let borderColor = C.border, bg = C.bgCard;
              if (submitted) {
                if (opt.id === word.id) { borderColor = C.teal; bg = 'rgba(45,212,191,0.08)'; }
                else if (feedback === 'wrong') { /* ne pas highlight les wrong sauf celui qu'on a choisi */ }
              }
              return (
                <button key={opt.id} onClick={() => handleQCMSelect(opt)} disabled={submitted} style={{
                  background: bg, border: `0.5px solid ${borderColor}`, color: C.text,
                  padding: 10, borderRadius: 6, textAlign: 'left', fontSize: 14,
                }}>{opt.fr}</button>
              );
            })}
          </div>
        </>
      )}

      {/* QCM fr → hanzi */}
      {modality === 'qcm_fr_zh' && (
        <>
          <div style={{
            background: 'linear-gradient(135deg, rgba(244,114,182,0.06), rgba(168,85,247,0.04))',
            border: `0.5px solid ${C.borderAccent}`,
            borderRadius: 12, padding: '14px 14px', marginBottom: 10, textAlign: 'center',
          }}>
            <p style={{ fontSize: 22, margin: 0, color: C.text, fontWeight: 400 }}>
              {word.fr}
            </p>
          </div>
          <p style={{ textAlign: 'center', fontSize: 12, color: C.textDim, margin: '0 0 8px' }}>
            Quel hanzi correspond ?
          </p>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 10 }}>
            {options.map(opt => {
              let borderColor = C.border, bg = C.bgCard;
              if (submitted) {
                if (opt.id === word.id) { borderColor = C.teal; bg = 'rgba(45,212,191,0.08)'; }
              }
              return (
                <button key={opt.id} onClick={() => handleQCMSelect(opt)} disabled={submitted} style={{
                  background: bg, border: `0.5px solid ${borderColor}`, color: C.text,
                  padding: 10, borderRadius: 6, textAlign: 'left', fontSize: 16,
                  display: 'flex', alignItems: 'center', gap: 10,
                }}>
                  <span className="hanzi" style={{ fontSize: 20 }}>{opt.hanzi}</span>
                  <span style={{ fontSize: 10, color: C.textDim }}>{opt.pinyin}</span>
                </button>
              );
            })}
          </div>
        </>
      )}

      {/* Remplissage manuel */}
      {modality === 'fill_manual' && (
        <>
          <div style={{
            background: 'linear-gradient(135deg, rgba(251,191,36,0.06), rgba(244,114,182,0.04))',
            border: `0.5px solid ${C.borderAccent}`,
            borderRadius: 12, padding: '18px 14px', marginBottom: 10, textAlign: 'center',
          }}>
            <p className="hanzi" style={{ fontSize: 36, margin: '0 0 6px', color: C.text, fontWeight: 300 }}>
              {word.hanzi}
            </p>
            <p style={{ fontSize: 13, color: C.textDim, margin: 0 }}>
              ({word.fr})
            </p>
          </div>
          <p style={{ textAlign: 'center', fontSize: 12, color: C.textDim, margin: '0 0 14px' }}>
            Tape le pinyin (les tons sont optionnels)
          </p>
          <input
            type="text" value={userInput} onChange={e => setUserInput(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && handleFillSubmit()}
            disabled={submitted}
            placeholder="ex: ni hao"
            autoFocus
            style={{
              width: '100%', boxSizing: 'border-box',
              background: C.bgCard,
              border: `0.5px solid ${submitted ? (feedback === 'correct' ? C.teal : C.red) : C.border}`,
              color: C.text, padding: 14, borderRadius: 8, fontSize: 16,
              fontFamily: 'monospace', letterSpacing: 1,
              marginBottom: 12,
            }}
          />
          {!submitted && (
            <button onClick={handleFillSubmit} disabled={!userInput.trim()} style={{
              width: '100%', background: userInput.trim() ? C.amber : C.border,
              color: userInput.trim() ? C.bg : C.textDim, border: 'none',
              padding: 13, borderRadius: 8, fontWeight: 600, fontSize: 14, letterSpacing: 0.5,
              marginBottom: 12,
            }}>VÉRIFIER</button>
          )}
        </>
      )}

      {/* AUDIO : on entend, on tape pinyin ou français */}
      {modality === 'audio' && currentExo.audioMode && (
        <>
          <div style={{
            background: 'linear-gradient(135deg, rgba(168,85,247,0.08), rgba(45,212,191,0.05))',
            border: `0.5px solid ${C.borderAccent}`,
            borderRadius: 12, padding: '18px 14px', marginBottom: 10, textAlign: 'center',
          }}>
            <p style={{ fontSize: 10, color: C.purple, letterSpacing: 2, margin: '0 0 12px' }}>
              ÉCOUTE
            </p>
            <button onClick={() => speak(word.hanzi)} style={{
              background: C.purple, color: C.bg, border: 'none',
              width: 80, height: 80, borderRadius: '50%',
              fontSize: 32, marginBottom: 8,
              display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
              boxShadow: '0 0 24px rgba(168,85,247,0.35)',
            }}>♪</button>
            <p style={{ fontSize: 11, color: C.textDim, margin: '8px 0 0' }}>
              Tap pour réécouter
            </p>
            {submitted && (
              <p className="hanzi" style={{ fontSize: 22, color: C.text, margin: '12px 0 0' }}>
                {word.hanzi}
              </p>
            )}
          </div>
          <p style={{ textAlign: 'center', fontSize: 12, color: C.textDim, margin: '0 0 14px' }}>
            {currentExo.audioMode === 'pinyin'
              ? 'Tape le pinyin (les tons sont optionnels)'
              : 'Tape la traduction française'}
          </p>
          <input
            type="text" value={userInput} onChange={e => setUserInput(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && handleAudioSubmit()}
            disabled={submitted}
            placeholder={currentExo.audioMode === 'pinyin' ? 'ex: ni hao' : 'ex: bonjour'}
            autoFocus
            style={{
              width: '100%', boxSizing: 'border-box',
              background: C.bgCard,
              border: `0.5px solid ${submitted ? (feedback === 'correct' ? C.teal : C.red) : C.border}`,
              color: C.text, padding: 14, borderRadius: 8, fontSize: 16,
              fontFamily: currentExo.audioMode === 'pinyin' ? 'monospace' : 'inherit',
              letterSpacing: currentExo.audioMode === 'pinyin' ? 1 : 'normal',
              marginBottom: 12,
            }}
          />
          {!submitted && (
            <button onClick={handleAudioSubmit} disabled={!userInput.trim()} style={{
              width: '100%', background: userInput.trim() ? C.purple : C.border,
              color: userInput.trim() ? C.bg : C.textDim, border: 'none',
              padding: 13, borderRadius: 8, fontWeight: 600, fontSize: 14, letterSpacing: 0.5,
              marginBottom: 12,
            }}>VÉRIFIER</button>
          )}
        </>
      )}

      {/* Feedback global */}
      {submitted && (
        <>
          {feedback === 'close' ? (
            // Cas "presque correct" : on demande à l'utilisateur
            <>
              <div style={{
                padding: 10, borderRadius: 6, marginBottom: 8,
                background: 'rgba(251,191,36,0.08)',
                border: `0.5px solid ${C.amber}`,
              }}>
                <p style={{ margin: '0 0 4px', fontSize: 13, color: C.amber, fontWeight: 500 }}>
                  ⚠ Presque, mais pas tout à fait
                </p>
                <p style={{ margin: '0 0 4px', fontSize: 11, color: C.textDim }}>
                  Tu as tapé : <span style={{ color: C.text, fontFamily: 'monospace' }}>{userInput}</span>
                </p>
                <p style={{ margin: 0, fontSize: 12, color: C.textDim }}>
                  Bonne réponse : <span className="hanzi" style={{ fontSize: 14, color: C.text }}>{word.hanzi}</span>
                  <span style={{ marginLeft: 6, color: C.text, fontFamily: 'monospace' }}>{word.pinyin}</span>
                  <span style={{ marginLeft: 6, color: C.textFaint }}>· {word.fr}</span>
                </p>
              </div>
              <p style={{ margin: '0 0 8px', fontSize: 11, color: C.textDim, textAlign: 'center' }}>
                C'était une faute de frappe ?
              </p>
              <div style={{ display: 'flex', gap: 6, marginBottom: 4 }}>
                <button onClick={() => { handleAcceptTypo(); setTimeout(handleNext, 300); }} style={{
                  flex: 1, background: C.teal, color: C.bg, border: 'none',
                  padding: 11, borderRadius: 6, fontSize: 12, fontWeight: 600, letterSpacing: 0.5,
                }}>✓ OUI, JE SAVAIS</button>
                <button onClick={() => { handleRejectTypo(); setTimeout(handleNext, 300); }} style={{
                  flex: 1, background: 'transparent', color: C.red, border: `0.5px solid ${C.red}`,
                  padding: 11, borderRadius: 6, fontSize: 12, fontWeight: 600, letterSpacing: 0.5,
                }}>✗ NON, JE NE SAVAIS PAS</button>
              </div>
            </>
          ) : (
            <>
              <div style={{
                padding: 10, borderRadius: 6, marginBottom: 8,
                background: feedback === 'correct' ? 'rgba(45,212,191,0.08)' : 'rgba(239,68,68,0.08)',
                border: `0.5px solid ${feedback === 'correct' ? C.teal : C.red}`,
              }}>
                <p style={{ margin: '0 0 4px', fontSize: 13, color: feedback === 'correct' ? C.teal : C.red, fontWeight: 500 }}>
                  {feedback === 'correct' ? '✓ Correct' : '✗ Incorrect'}
                </p>
                <p style={{ margin: 0, fontSize: 12, color: C.textDim }}>
                  <span className="hanzi" style={{ fontSize: 14, color: C.text }}>{word.hanzi}</span>
                  <span style={{ marginLeft: 8 }}>{word.pinyin}</span>
                  <span style={{ marginLeft: 8, color: C.textFaint }}>· {word.fr}</span>
                </p>
              </div>
              <button onClick={handleNext} style={{
                width: '100%', background: C.teal, color: C.bg, border: 'none',
                padding: 11, borderRadius: 6, fontWeight: 600, fontSize: 13, letterSpacing: 0.5,
              }}>SUIVANT →</button>
            </>
          )}
        </>
      )}
    </div>
  );
}

// ============================================================
// LESSON PHASE 2 — Mots + petites phrases
// On boucle sur les mots cibles + phrases courtes qui les contiennent
// Objectif : valider la modalité 'in_phrase' pour chaque mot cible
// ============================================================
function LessonPhase2Screen({ lessonId, onBack, onPhaseComplete }) {
  const lesson = getLessonById(lessonId);
  const words = useMemo(() => (lesson?.word_ids || []).map(id => getWordById(id)).filter(Boolean), [lessonId]);
  const allLessonPhrases = useMemo(() => {
    // Combiner phrases banque + phrases générées par IA
    const banque = (lesson?.phrase_ids || []).map(id => getPhraseById(id)).filter(Boolean);
    const ai = (lesson?.extra_ai_phrases || []).map((p, idx) => ({
      ...p,
      id: `ai_${lesson.id}_${idx}`, // id stable distinct des phrases banque
    }));
    return [...banque, ...ai];
  }, [lessonId]);

  // Phrases utilisables : on garde les courtes/moyennes pour Phase 2
  const usablePhrases = useMemo(() => {
    return allLessonPhrases.filter(p => p.hanzi.length <= 14);
  }, [allLessonPhrases]);

  // Configuration selon l'intensité choisie pour la leçon
  const intensity = getLessonIntensity(lessonId) || 'normal';
  const config = useMemo(() => getPhase2Config(intensity), [intensity]);

  // État local : pour chaque phrase, on stocke combien de fois elle a été réussie
  // Format : { 'phrase_id': { phrase_to_fr: 1, fr_to_phrase: 0 } }
  // Persisté en localStorage par leçon pour ne pas perdre la progression entre sessions
  const phraseProgressKey = `hsk_phase2_${lessonId}`;
  const [phraseProgress, setPhraseProgress] = useState(() => {
    try {
      const saved = localStorage.getItem(phraseProgressKey);
      return saved ? JSON.parse(saved) : {};
    } catch { return {}; }
  });

  const persistProgress = (next) => {
    setPhraseProgress(next);
    try { localStorage.setItem(phraseProgressKey, JSON.stringify(next)); } catch {}
  };

  const [currentExo, setCurrentExo] = useState(null);
  const [submitted, setSubmitted] = useState(false);
  const [feedback, setFeedback] = useState(null);
  const [stats, setStats] = useState({ done: 0, correct: 0 });

  // Anti-répétition
  const recentPhrasesRef = useRef([]);

  // Une phrase est "validée" si elle a été réussie suffisamment de fois
  // selon la configuration de l'intensité
  const isPhraseDone = (phraseId) => {
    const prog = phraseProgress[phraseId] || {};
    if (config.useBothDirections) {
      // Doit être réussie sur les 2 directions, requiredPasses fois chacune
      return (prog.phrase_to_fr || 0) >= config.requiredPasses
          && (prog.fr_to_phrase || 0) >= config.requiredPasses;
    }
    // Une seule direction suffit
    const total = (prog.phrase_to_fr || 0) + (prog.fr_to_phrase || 0);
    return total >= config.requiredPasses;
  };

  // Phrases encore à travailler
  const phrasesToWork = useMemo(() => {
    return usablePhrases.filter(p => !isPhraseDone(p.id));
  }, [usablePhrases, phraseProgress, config]);

  // Compteur global pour la barre de progression
  const totalPhrases = usablePhrases.length;
  const validatedCount = totalPhrases - phrasesToWork.length;
  const phaseDone = phrasesToWork.length === 0 || usablePhrases.length === 0;

  const pickNext = () => {
    setSubmitted(false);
    setFeedback(null);
    if (phaseDone) {
      setCurrentExo(null);
      return;
    }

    // Filter récentes
    const recentIds = new Set(recentPhrasesRef.current.slice(-3));
    const fresh = phrasesToWork.filter(p => !recentIds.has(p.id));
    const pool = fresh.length > 0 ? fresh : phrasesToWork;

    const phrase = pool[Math.floor(Math.random() * pool.length)];
    if (!phrase) return;

    // Mémoriser
    recentPhrasesRef.current = [...recentPhrasesRef.current, phrase.id].slice(-5);

    // Choisir le type d'exo selon l'intensité
    let subType;
    if (config.useBothDirections) {
      // Privilégier la direction qui n'a pas encore été validée pour cette phrase
      const prog = phraseProgress[phrase.id] || {};
      const ftfDone = (prog.phrase_to_fr || 0) >= config.requiredPasses;
      const ftpDone = (prog.fr_to_phrase || 0) >= config.requiredPasses;
      if (!ftfDone && ftpDone) subType = 'phrase_to_fr';
      else if (ftfDone && !ftpDone) subType = 'fr_to_phrase';
      else subType = Math.random() < 0.5 ? 'phrase_to_fr' : 'fr_to_phrase';
    } else {
      subType = Math.random() < 0.5 ? 'phrase_to_fr' : 'fr_to_phrase';
    }

    // Distracteurs : 3 autres phrases de la leçon (différentes)
    const otherPhrases = allLessonPhrases.filter(p => p.id !== phrase.id);
    const shuffledP = [...otherPhrases].sort(() => Math.random() - 0.5).slice(0, 3);
    const opts = [phrase, ...shuffledP].sort(() => Math.random() - 0.5);

    setCurrentExo({ type: subType, phrase, options: opts });
  };

  useEffect(() => {
    if (!phaseDone && !currentExo) pickNext();
  }, [phaseDone, phraseProgress]);

  if (!lesson) return <p style={{ color: C.textDim }}>Leçon introuvable.</p>;

  // Phase complétée
  if (phaseDone) {
    return (
      <div className="slide-up">
        <button onClick={onBack} style={{
          background: 'transparent', border: 'none', color: C.teal, fontSize: 13, padding: 0, marginBottom: 16,
        }}>← retour</button>
        <div style={{ textAlign: 'center', padding: '3rem 1rem' }}>
          <p style={{ fontSize: 56, margin: '0 0 16px', color: C.teal }}>✓</p>
          <p style={{ fontSize: 22, fontWeight: 500, margin: '0 0 8px', color: C.text }}>
            Phase 2 terminée
          </p>
          <p style={{ fontSize: 13, color: C.textDim, margin: '0 0 24px', lineHeight: 1.6 }}>
            Tu reconnais maintenant ces mots dans des phrases. Phase 3 : phrases complètes.
          </p>
          <button onClick={onPhaseComplete} style={{
            background: C.teal, color: C.bg, border: 'none',
            padding: '12px 28px', borderRadius: 8, fontWeight: 600, fontSize: 14, letterSpacing: 0.5,
          }}>CONTINUER →</button>
        </div>
      </div>
    );
  }

  if (!currentExo) return null;

  // Handler unifié — incrémente le compteur de la phrase courante selon le type d'exo réussi
  const handleSelect = (correct, phrase) => {
    if (submitted) return;
    setSubmitted(true);
    setFeedback(correct ? 'correct' : 'wrong');
    setStats(s => ({ done: s.done + 1, correct: s.correct + (correct ? 1 : 0) }));
    if (correct && phrase && currentExo) {
      // Incrémenter le compteur de la direction courante pour cette phrase
      const direction = currentExo.type; // 'phrase_to_fr' ou 'fr_to_phrase'
      const next = { ...phraseProgress };
      const current = next[phrase.id] || {};
      next[phrase.id] = {
        ...current,
        [direction]: (current[direction] || 0) + 1,
      };
      persistProgress(next);
    } else if (!correct && phrase) {
      // Logger l'erreur
      logError({
        item_id: phrase.id, hanzi: phrase.hanzi, pinyin: phrase.pinyin, fr: phrase.fr,
        facet: 'phrase_qcm', mode: 'lesson_phase2',
        error_type: 'structure', user_answer: '?', correct_answer: phrase.fr,
      });
    }
    markActivity(1);
  };

  const handleNext = () => {
    pickNext();
  };

  const totalToValidate = totalPhrases;
  const validated = validatedCount;

  return (
    <div className="slide-up">
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
        <button onClick={onBack} style={{
          background: 'transparent', border: 'none', color: C.teal, fontSize: 13, padding: 0,
        }}>← retour</button>
        <span style={{ fontSize: 11, color: C.textDim, letterSpacing: 1 }}>
          {validated} / {totalToValidate} phrases validées
        </span>
      </div>

      <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 2, margin: '0 0 4px' }}>
        PHASE 2 · MOTS DANS PHRASES
      </p>
      <p style={{ fontSize: 16, margin: '0 0 16px', color: C.text }}>{lesson.theme}</p>

      <div style={{ height: 3, background: C.border, borderRadius: 2, overflow: 'hidden', marginBottom: 20 }}>
        <div style={{
          width: `${(validated / totalToValidate) * 100}%`, height: '100%',
          background: `linear-gradient(90deg, ${C.teal}, ${C.purple})`, transition: 'width 0.3s',
        }} />
      </div>

      {/* QCM rapide sur un mot (pour rafraîchir) */}
      {/* Type 1 : phrase chinoise → choisir la bonne traduction française */}
      {currentExo.type === 'phrase_to_fr' && (
        <>
          <div style={{
            background: 'linear-gradient(135deg, rgba(45,212,191,0.06), rgba(244,114,182,0.04))',
            border: `0.5px solid ${C.borderAccent}`,
            borderRadius: 12, padding: '14px 14px', marginBottom: 10, textAlign: 'center',
          }}>
            <p className="hanzi" style={{ fontSize: 28, margin: '0 0 10px', color: C.text }}>
              {currentExo.phrase.hanzi}
            </p>
            <p style={{ fontSize: 13, color: C.textDim, margin: 0, letterSpacing: 0.5 }}>
              {currentExo.phrase.pinyin}
            </p>
            {isTTSAvailable() && (
              <button onClick={() => speak(currentExo.phrase.hanzi)} style={{
                marginTop: 12, background: 'transparent', border: `0.5px solid ${C.teal}`,
                color: C.teal, padding: '5px 12px', borderRadius: 8, fontSize: 11, letterSpacing: 1,
              }}>♪ ÉCOUTER</button>
            )}
          </div>
          <p style={{ textAlign: 'center', fontSize: 12, color: C.textDim, margin: '0 0 8px' }}>
            Quelle est la traduction ?
          </p>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 10 }}>
            {currentExo.options.map(opt => {
              let borderColor = C.border, bg = C.bgCard;
              if (submitted) {
                if (opt.id === currentExo.phrase.id) { borderColor = C.teal; bg = 'rgba(45,212,191,0.08)'; }
              }
              return (
                <button key={opt.id} onClick={() => handleSelect(opt.id === currentExo.phrase.id, currentExo.phrase)} disabled={submitted} style={{
                  background: bg, border: `0.5px solid ${borderColor}`, color: C.text,
                  padding: 10, borderRadius: 6, textAlign: 'left', fontSize: 13,
                }}>{opt.fr}</button>
              );
            })}
          </div>
        </>
      )}

      {/* Type 2 : phrase française → choisir la bonne phrase chinoise */}
      {currentExo.type === 'fr_to_phrase' && (
        <>
          <div style={{
            background: 'linear-gradient(135deg, rgba(168,85,247,0.06), rgba(45,212,191,0.04))',
            border: `0.5px solid ${C.borderAccent}`,
            borderRadius: 12, padding: '14px 14px', marginBottom: 10, textAlign: 'center',
          }}>
            <p style={{ fontSize: 16, color: C.text, margin: 0, lineHeight: 1.5 }}>
              {currentExo.phrase.fr}
            </p>
          </div>
          <p style={{ textAlign: 'center', fontSize: 12, color: C.textDim, margin: '0 0 8px' }}>
            Quelle phrase chinoise correspond ?
          </p>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 10 }}>
            {currentExo.options.map(opt => {
              let borderColor = C.border, bg = C.bgCard;
              if (submitted) {
                if (opt.id === currentExo.phrase.id) { borderColor = C.teal; bg = 'rgba(45,212,191,0.08)'; }
              }
              return (
                <button key={opt.id} onClick={() => handleSelect(opt.id === currentExo.phrase.id, currentExo.phrase)} disabled={submitted} style={{
                  background: bg, border: `0.5px solid ${borderColor}`, color: C.text,
                  padding: 10, borderRadius: 6, textAlign: 'left',
                }}>
                  <p className="hanzi" style={{ fontSize: 16, margin: '0 0 2px' }}>{opt.hanzi}</p>
                  <p style={{ fontSize: 10, color: C.textDim, margin: 0, letterSpacing: 0.5 }}>{opt.pinyin}</p>
                </button>
              );
            })}
          </div>
        </>
      )}

      {submitted && (
        <>
          <div style={{
            padding: 10, borderRadius: 6, marginBottom: 8,
            background: feedback === 'correct' ? 'rgba(45,212,191,0.08)' : 'rgba(239,68,68,0.08)',
            border: `0.5px solid ${feedback === 'correct' ? C.teal : C.red}`,
          }}>
            <p style={{ margin: 0, fontSize: 13, color: feedback === 'correct' ? C.teal : C.red, fontWeight: 500 }}>
              {feedback === 'correct' ? '✓ Bien vu' : '✗ Pas tout à fait'}
            </p>
          </div>
          <button onClick={handleNext} style={{
            width: '100%', background: C.teal, color: C.bg, border: 'none',
            padding: 13, borderRadius: 8, fontWeight: 600, fontSize: 14, letterSpacing: 0.5,
          }}>SUIVANT →</button>
        </>
      )}
    </div>
  );
}


// ============================================================
// LESSON PHASE 3 — Phrases complètes
// 5 sous-modes en boucle :
//  - QCM FR → pinyin
//  - QCM pinyin → FR
//  - Tap word FR → pinyin (construction)
//  - Tap word pinyin → FR (construction)
//  - Remplissage manuel pinyin
// On valide la phrase (et chaque mot reconnu via in_phrase + audio si TTS utilisé)
// On considère la phase complète quand 80% des phrases ont été réussies au moins 1 fois
// ============================================================
function LessonPhase3Screen({ lessonId, onBack, onPhaseComplete }) {
  const lesson = getLessonById(lessonId);
  const phrases = useMemo(() => {
    const banque = (lesson?.phrase_ids || []).map(id => getPhraseById(id)).filter(Boolean);
    const ai = (lesson?.extra_ai_phrases || []).map((p, idx) => ({
      ...p,
      id: `ai_${lesson.id}_${idx}`,
    }));
    return [...banque, ...ai];
  }, [lessonId]);

  // Persistance des phrases déjà réussies dans la phase 3 de cette leçon
  const phraseProgressKey = `hsk_phase3_${lessonId}`;
  const [phraseProgress, setPhraseProgress] = useState(() => {
    try {
      const raw = localStorage.getItem(phraseProgressKey);
      return raw ? JSON.parse(raw) : {};
    } catch { return {}; }
  });
  const savePhraseProgress = (np) => {
    setPhraseProgress(np);
    try { localStorage.setItem(phraseProgressKey, JSON.stringify(np)); } catch {}
  };

  const [currentExo, setCurrentExo] = useState(null);
  const [submitted, setSubmitted] = useState(false);
  const [feedback, setFeedback] = useState(null);
  const [userInput, setUserInput] = useState('');
  const [tapBuilt, setTapBuilt] = useState([]);
  const [tapAvailable, setTapAvailable] = useState([]);
  const [stats, setStats] = useState({ done: 0, correct: 0 });
  const [refreshKey, setRefreshKey] = useState(0);

  if (!lesson) return null;
  if (phrases.length === 0) {
    return (
      <div className="slide-up">
        <button onClick={onBack} style={{
          background: 'transparent', border: 'none', color: C.teal, fontSize: 13, padding: 0, marginBottom: 16,
        }}>← retour</button>
